# Default values for vikunja.
# One container serves both the API and the built frontend on a single port.

replicaCount: 1

image:
  repository: vikunja/vikunja
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Scheduling priority for the pods.
priorityClassName: ""

# Rendered verbatim into a ConfigMap and mounted at /etc/vikunja/config.yml —
# one of the paths viper searches. Secrets do NOT belong here; inject them as
# VIKUNJA_* environment variables via `envFrom` instead, they are merged on top
# of this file at startup.
#
# One exception is structural: auth.openid.providers is a map and Vikunja only
# knows a provider that the config *file* declares. A provider key must exist
# here for the matching VIKUNJA_AUTH_OPENID_PROVIDERS_<KEY>_* vars to land.
config: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# The image is FROM scratch and only ever writes to /tmp (mounted as an
# emptyDir below), so the root filesystem can stay read-only.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3456

# Prometheus endpoint. Vikunja only serves it when config.metrics.enabled is
# true — this block just wires up the scrape.
metrics:
  enabled: false
  path: /api/v1/metrics
  port: http
  scheme: http
  serviceMonitor:
    enabled: false
    namespace: ""
    additionalLabels: {}
    annotations: {}
    interval: ""
    scrapeTimeout: ""
    relabelings: []
    metricRelabelings: []
    # Credentials for config.metrics.username/password, if the endpoint is not
    # left open. Any Secret key name works, so this can point straight at the
    # VIKUNJA_METRICS_* keys the container already reads.
    basicAuth: {}
    #  username:
    #    name: vikunja-core
    #    key: VIKUNJA_METRICS_USERNAME
    #  password:
    #    name: vikunja-core
    #    key: VIKUNJA_METRICS_PASSWORD

# Cloudflare-Tunnel exposure is a plain Ingress kept next to the overlay
# (the same way outline and penpot do it), so this chart only renders the
# Gateway API route.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: https
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

pdb:
  enabled: false
  minAvailable: 1
  # maxUnavailable:

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
startupProbe: {}

# Additional volumes on the output Deployment definition. The /tmp emptyDir and
# the config volume are added by the chart itself.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

# Extra environment variables appended to the container
env: []
# - name: SOME_VAR
#   value: "some-value"

# Extra envFrom sources (configMapRef / secretRef) — this is where the
# VIKUNJA_* secrets belong.
envFrom: []
# - secretRef:
#     name: my-secret
