name: close-invalid-prs

# Closes pull requests opened from a fork's default branch.
# The reusable workflow needs no secrets; GITHUB_TOKEN with pull-requests: write is enough.
on:
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  close:
    name: Close invalid PR
    permissions:
      pull-requests: write
    # v2.9.0 of OneLiteFeatherNET/workflows
    uses: OneLiteFeatherNET/workflows/.github/workflows/close-invalid-prs.yml@7c683feadd3cb43eee719802aac690bc845e5a98 # v2.9.1
