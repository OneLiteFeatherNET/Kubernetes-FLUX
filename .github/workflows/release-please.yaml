name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    permissions:
      contents: write
      pull-requests: write
    # The release App opens the release PR, so the required checks run on it (GITHUB_TOKEN PRs do not trigger workflows).
    uses: OneLiteFeatherNET/workflows/.github/workflows/release-please.yml@ec5d37fed94ad59e54868d63af6ea4ef4ee4e84c # v2.9.0
    # Org secrets carry the App's client ID; GitHub accepts it in place of the numeric App ID.
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
