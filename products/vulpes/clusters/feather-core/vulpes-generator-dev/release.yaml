apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vulpes-generator-dev
  labels:
    flux.onelitefeather.dev/remediation: retries-only
  namespace: vulpes-dev
spec:
  releaseName: vulpes-generator-dev
  interval: 1m0s
  install:
    remediation:
      retries: 3
  # The source in foundation-sources tracks the newest release rather than an exact
  # version, and the chart's appVersion decides the image tag - so dev follows
  # both without anything here being bumped.
  chartRef:
    kind: OCIRepository
    name: vulpes-generator-dev
    namespace: flux-system
  values:
    # Deployed into the backend's dev namespace rather than one of its own: it
    # reads the same database, so the credential and the pull secret already
    # exist there and no copy of either has to be made.
    #
    # Single replica, no PDB -> dev is best-effort and yields to prod under
    # pressure (feather-low).
    priorityClassName: feather-low
    replicaCount: 1
    podDisruptionBudget:
      enabled: false
    # Kept current by ImageUpdateAutomation/vulpes-generator-dev (foundation-sources).
    # Empty until the first develop-* image lands in Harbor; an empty tag falls
    # back to the chart's appVersion, so dev keeps today's behaviour until then.
    image:
      repository: harbor.onelitefeather.dev/onelitefeather/vulpes-generator
      tag: "develop-1794146134-d144e37" # {"$imagepolicy": "flux-system:vulpes-generator-dev:tag"}
    imagePullSecrets:
      - name: harbor-pull
    metrics:
      serviceMonitor:
        enabled: true
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      parentRefs:
        - name: eg
          namespace: envoy
          sectionName: https
      hostnames:
        - vulpes-generator-dev.apps.onelite.feather
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
    # Alloy log pipeline: JSON parsing + per-env stream label.
    podLabels:
      logs.onelitefeather.net/format: json
      logs.onelitefeather.net/env: dev
    # The chart's javaagent injection stays OFF: this service instruments itself
    # (micronaut-tracing-opentelemetry is a compile-time dependency), and running
    # the agent on top of it would instrument everything twice. Its own exporter
    # is switched on through the environment below instead, which is exactly what
    # the application.yml comment asks for.
    tracing:
      enabled: false
    env:
      - name: LOG_JSON
        value: "true"
      - name: OTEL_TRACES_EXPORTER
        value: "otlp"
      # Same tempo-gateway target the chart's own tracing default uses, gRPC as
      # the application configures the protocol.
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://tempo-gateway.grafana.svc.cluster.local:4317"
    # Generated by the vulpes-backend overlay in this namespace. Carries
    # JDBC_URL, DB_USER and DB_PASS, which the datasource below maps onto the
    # names this application expects.
    envFrom:
      - secretRef:
          name: vulpes-dev-app-db
    # Editor release flow (content releases, POST /generator/release). Dev gets
    # the whole flow: the generator reaches the dev backend to read project
    # snapshots and publishes to Reposilite, and builds the vulpes-base
    # artifact. Caches are emptyDir (best-effort dev), so a restart rebuilds
    # cold.
    release:
      # In-cluster Service of vulpes-backend-dev (fullnameOverride
      # vulpes-backend-dev-micronaut, service.port 8080).
      backendUrl: "http://vulpes-backend-dev-micronaut.vulpes-dev.svc.cluster.local:8080"
      # The route needs no token, so it is only switched on where the generator
      # is reachable from the internal network (per the chart).
      editorRouteEnabled: true
      # Cold base builds need a Gradle JVM plus javac on top of the service.
      memoryLimit: 3Gi
      baseCacheVolume:
        sizeLimit: 2Gi
      gradleCacheVolume:
        sizeLimit: 3Gi
      # Publish credentials: written by the maintainer with sops (see kustomization.yaml).
      mavenSecret:
        name: vulpes-generator-dev-maven
        usernameKey: username
        passwordKey: password
      # Read-only Reposilite token for resolving base build dependencies.
      baseMavenSecret:
        name: vulpes-generator-dev-base-maven
        usernameKey: username
        passwordKey: password
    # Chart default request is 256Mi; a cold base build needs more headroom.
    # The limit comes from release.memoryLimit above.
    resources:
      requests:
        memory: 1Gi
    profiles: ["prod"]
    config:
      base: |-
        micronaut:
          application:
            name: Vulpes Generator
          server:
            port: 8080
            # Stelaris is served from its own host, so every call it makes here
            # is cross-origin. This service has no CORS configuration of its own
            # -- without this block the browser rejects every response, and the
            # generate page fails in a way that looks like the service is down.
            cors:
              enabled: true
              configurations:
                stelaris-ui:
                  allowed-origins:
                    - https://stelaris-dev.apps.onelite.feather
                  # The browser client reads the download file name from this header.
                  exposed-headers:
                    - Content-Disposition
            netty:
              access-logger:
                enabled: true
                # Drop probe/metrics noise: kubelet hits /health every 5-10s and
                # Prometheus scrapes /prometheus. Regexes match the request URI.
                exclusions:
                  - /health.*
                  - /prometheus.*
        # Overrides the MariaDB defaults the image ships: the Vulpes data lives
        # in the shared CNPG Postgres. Read-only, because this service only ever
        # reads a schema the backend owns.
        datasources:
          default:
            url: $${JDBC_URL}
            username: $${DB_USER}
            password: $${DB_PASS}
            driverClassName: org.postgresql.Driver
            read-only: true
            # Deliberately small. The CNPG cluster runs at max_connections=100
            # and is shared; a read-only generator does not need a large pool,
            # and idle pools here are what starve the applications that do.
            maximum-pool-size: 2
            minimum-idle: 1
            poolName: "HikariPool-Vulpes-Generator"
        jpa:
          default:
            properties:
              hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                hbm2ddl.auto: none
      profiles:
        prod: |-
          logger:
            levels:
              root: WARN
              # Per-request access logs (micronaut.server.netty.access-logger).
              # root is WARN, so the access logger must be raised explicitly.
              HTTP_ACCESS_LOGGER: INFO
              "org.hibernate.SQL": WARN
              "com.zaxxer.hikari": WARN
