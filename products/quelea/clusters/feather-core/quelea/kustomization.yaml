apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quelea
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ../../../base/quelea/
  - httproute.yaml
patches:
  - path: release.yaml

secretGenerator:
  - name: harbor-pull
    type: kubernetes.io/dockerconfigjson
    files:
      - .dockerconfigjson=harbor.onelitefeather.dev.dockerconfigjson.sops.json
  - name: quelea-redis
    envs:
      - redis.sops.env
  - name: quelea-sentry
    envs:
      - sentry.sops.env
