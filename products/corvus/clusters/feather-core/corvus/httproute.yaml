# Internal front door for the Corvus API, for the CloudNet node mc01 (Velocity
# plugin: GET /api/v1/plugin/blocklist). The public corvus.onelitefeather.dev
# host sits behind Cloudflare, which serves a managed JS challenge to the
# server's IP. Same backend as the Cloudflare tunnel Ingress (corvus-ui:8080,
# whose nginx proxies /api/ to the API Service); only /api is routed, the SPA
# stays public-only. Authentication is unchanged: no valid token returns 401.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: corvus-api
spec:
  parentRefs:
    - name: eg
      namespace: envoy
      sectionName: https
  hostnames:
    - corvus.apps.onelite.feather
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: corvus-ui
          port: 8080
