# Internal gateway routes: the Grus web UI (no login; see the internal-access
# proposal) and, further down, the agent API on its own hostname. The API paths for the event and instance streams are long-lived
# Server-Sent-Events streams, so they carry no request deadline.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grus-dev
spec:
  parentRefs:
    - name: eg
      namespace: envoy
      sectionName: https
  hostnames:
    - grus-dev.apps.onelite.feather
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/grus/v1/events
        - path:
            type: PathPrefix
            value: /api/grus/v1/instances
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
              - name: Referrer-Policy
                value: no-referrer
              - name: X-Content-Type-Options
                value: nosniff
      timeouts:
        request: "0s"
        backendRequest: "0s"
      backendRefs:
        - name: grus-web
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
              - name: Referrer-Policy
                value: no-referrer
              - name: X-Content-Type-Options
                value: nosniff
      backendRefs:
        - name: grus-web
          port: 3000
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: grus-dev
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grus-dev
  timeout:
    http:
      # SSE event stream and live log stream. The event stream carries instance
      # updates every few seconds; the idle timeout is a backstop only.
      requestTimeout: 0s
      maxStreamDuration: 0s
      streamIdleTimeout: 1h
---
# Agent API for hosts outside Kubernetes (mc01). Allow list only: everything else,
# including the admin API, is not matched and answers 404 at the gateway. Identity
# stays in the controller (agent and instance tokens).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grus-dev-api
spec:
  parentRefs:
    - name: eg
      namespace: envoy
      sectionName: https
  hostnames:
    - grus-dev-api.apps.onelite.feather
  rules:
    # Register, long-poll desired state (about 25s) and report observed state.
    - matches:
        - path:
            type: PathPrefix
            value: /v1/agents
      timeouts:
        request: "60s"
        backendRequest: "60s"
      backendRefs:
        - name: grus
          port: 8080
    # Instances report readiness and player counts with their per-instance token.
    - matches:
        - path:
            type: PathPrefix
            value: /v1/self
      backendRefs:
        - name: grus
          port: 8080
    # Template archive download only; uploads are not routed.
    - matches:
        - method: GET
          path:
            type: PathPrefix
            value: /v1/templates
      backendRefs:
        - name: grus
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: grus
          port: 8080
