apiVersion: v1
kind: Namespace
metadata:
  name: grus-dev
  labels:
    # baseline enforced: the Minecraft game images still run as root. restricted is
    # reported as warning and audit only, see the Grus image work.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
