# Dev-only prototype: controller, Velocity proxy and Minestom lobbies as pods.
# Reachable only through kubectl port-forward (no Service of type LoadBalancer,
# no HTTPRoute). Remove the layer line in products/layers/feather-core/dev to roll back.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grus
  namespace: grus-dev
  labels:
    flux.onelitefeather.dev/remediation: retries-only
spec:
  releaseName: grus
  chart:
    spec:
      chart: ./deploy/helm/grus
      # Revision repackages on every commit of the pinned source, same as menura-dev.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: grus
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  interval: 10m0s
  values:
    image:
      repository: harbor.onelitefeather.dev/onelitefeather/grus
      # Pinned prototype tag; move it together with ref.commit in foundation/sources/.../grus.yaml.
      tag: prototype-4f5d516
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: harbor-pull

    adminToken:
      existingSecret: grus-dev-secrets
      key: GRUS_ADMIN_TOKEN

    controller:
      debugEndpoints: true
      maxInstances: 10

    # Controller pod: feather-low is the lowest PriorityClass, so it never preempts platform workloads.
    priorityClassName: feather-low
    podLabels:
      logs.onelitefeather.net/format: json
      logs.onelitefeather.net/env: dev
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi

    # Game pods created by the controller. nodeSelector stays empty: add
    # fr01-wrk-xl-01 or fr01-wrk-xl-02 here only if the scheduler cannot place them.
    instances:
      imagePullSecrets:
        - harbor-pull
      priorityClassName: feather-low
      nodeSelector: {}
      podLabels:
        logs.onelitefeather.net/format: json
        logs.onelitefeather.net/env: dev

    persistence:
      enabled: true
      size: 1Gi

    templates:
      seed:
        lobby-config:
          - path: grus-template.txt
            content: |
              Seeded by the Grus template store (lobby-config, stable).
