# Dev-only Grus v2: controller, Velocity proxy and Minestom lobbies as pods, plus an
# agent on mc01 (outside Kubernetes) that reaches the controller on
# grus-dev-api.apps.onelite.feather. Templates live in S3, pools may come from CRs.
# Web UI reachable on the internal gateway (grus-dev.apps.onelite.feather, no login)
# and through kubectl port-forward. No Service of type LoadBalancer.
# Remove the layer line in products/layers/feather-core/dev to roll back.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grus
  namespace: grus-dev
  labels:
    flux.onelitefeather.dev/remediation: retries-only
spec:
  releaseName: grus
  chart:
    spec:
      chart: ./deploy/helm/grus
      # Revision repackages on every commit of the pinned source, same as menura-dev.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: grus
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  interval: 10m0s
  values:
    image:
      repository: harbor.onelitefeather.dev/onelitefeather/grus
      # Pinned v2 tag; move it together with ref.commit in foundation/sources/.../grus.yaml.
      tag: prototype-58123e1
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: harbor-pull

    adminToken:
      existingSecret: grus-dev-secrets
      key: GRUS_ADMIN_TOKEN

    # Agent hosts: only the SHA-256 of each agent token is stored (host=<hash>).
    agents:
      tokens:
        existingSecret: grus-dev-secrets
        key: GRUS_AGENT_TOKENS

    # Watch Environment, Group and Pool CRs of this namespace (CRDs: grus-dev-crds).
    crds:
      watch: true

    controller:
      debugEndpoints: true
      maxInstances: 10

    # Controller pod: feather-low is the lowest PriorityClass, so it never preempts platform workloads.
    priorityClassName: feather-low
    podLabels:
      logs.onelitefeather.net/format: json
      logs.onelitefeather.net/env: dev
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi

    # Game pods created by the controller. nodeSelector stays empty: add
    # fr01-wrk-xl-01 or fr01-wrk-xl-02 here only if the scheduler cannot place them.
    instances:
      imagePullSecrets:
        - harbor-pull
      priorityClassName: feather-low
      nodeSelector: {}
      podLabels:
        logs.onelitefeather.net/format: json
        logs.onelitefeather.net/env: dev

    persistence:
      enabled: true
      size: 1Gi

    # Web UI for the controller API. It has no login yet; it is reachable on the internal
    # gateway (httproute.yaml) and through kubectl -n grus-dev port-forward svc/grus-web 3000:3000.
    # Its pull secret falls back to imagePullSecrets (harbor-pull).
    web:
      enabled: true
      image:
        repository: harbor.onelitefeather.dev/onelitefeather/grus-web
        # Same commit as the controller; move it together with ref.commit in foundation/sources/.../grus.yaml.
        tag: prototype-58123e1

    # Templates in S3: credentials and endpoint come from the Rook claim grus-templates-dev
    # (templates-bucket.yaml). Plain http because the RGW traffic stays inside the cluster.
    templates:
      backend: s3
      s3:
        existingSecret: grus-templates-dev
        existingConfigMap: grus-templates-dev
        insecure: true
      seed:
        lobby-config:
          - path: grus-template.txt
            content: |
              Seeded by the Grus template store (lobby-config, stable).
