apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vllm
  namespace: sturnus
spec:
  # A first start downloads about 9 GB of weights and compiles kernels before
  # /health answers; the startup probe allows 30 minutes for that, and Helm must
  # wait as long, or it calls a healthy rollout failed and rolls it back.
  timeout: 30m
  values:
    controllers:
      vllm:
        type: deployment
        replicas: 1
        # The model cache is a ReadWriteOnce volume: a rolling update would start the
        # new pod while the old one still holds it.
        strategy: Recreate
        pod:
          priorityClassName: feather-standard
          automountServiceAccountToken: false
          labels:
            logs.onelitefeather.net/env: prod
          # The vLLM CPU image runs as root and has no USER directive, so the
          # speaches runAsNonRoot settings do not apply. The namespace enforces
          # baseline, which this satisfies: no privileged, no host namespaces.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      # Whisper large-v3 on CPU wants the 32-core xl workers,
                      # which have AVX-512 (the vLLM CPU build relies on it).
                      - key: node-role.feather/workload-class
                        operator: In
                        values: ["xl"]
                      # The cache PVC is ceph-rbd-fr01, which only attaches in fr-rosenau.
                      - key: topology.kubernetes.io/region
                        operator: In
                        values: ["fr-rosenau"]
        containers:
          app:
            image:
              repository: vllm/vllm-openai-cpu
              tag: v0.33.0-x86_64@sha256:4154467a886f8b7ffa9dbab32f873f5ca4528409d042a6ec866e8888223263d3
            # The image's entrypoint is `vllm serve`; these are its arguments.
            # `whisper-1` is the name Sturnus posts, which the served-model-name maps to
            # openai/whisper-large-v3. The full model, not -turbo, and float32, not a
            # quantised type: the team wants accuracy, not speed. Turbo keeps 4 of the 32
            # decoder layers and loses most on German; large-v3 runs below real time on
            # these CPUs, which a protocol written after the meeting can afford.
            args:
              - openai/whisper-large-v3
              - --served-model-name
              - whisper-1
              - --dtype
              - float32
              - --port
              - "8000"
            env:
              # KV cache budget in GiB. Whisper's decoder needs little of it, so 2 keeps
              # the limit for weights (about 6 GB in float32), activations and /dev/shm.
              VLLM_CPU_KVCACHE_SPACE: "2"
              # Let OpenMP run unpinned: the pod's CPU set comes from the kubelet, and
              # vLLM's own core binding fights it on a shared node.
              VLLM_CPU_OMP_THREADS_BIND: nobind
              # Match the CPU request below.
              OMP_NUM_THREADS: "8"
              # Hugging Face downloads and the compiled artefacts live on the cache volume,
              # so a restart does not download the model again.
              HF_HOME: /cache/huggingface
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: "8"
                memory: 14Gi
              limits:
                cpu: "8"
                memory: 20Gi
            probes:
              # The first start downloads the model and compiles kernels on an empty cache,
              # which can take well over ten minutes. 180 x 10 s allows 30 minutes.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 10
                  failureThreshold: 180
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 15
    service:
      app:
        controller: vllm
        type: ClusterIP
        ports:
          http:
            port: 8000
    persistence:
      hf-cache:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        # openai/whisper-large-v3 ships its weights twice, fp16 (3 GB) and fp32 (6 GB),
        # and vLLM downloads both; 10Gi ran out mid-download and crash-looped the pod.
        size: 30Gi
        storageClass: ceph-rbd-fr01
        globalMounts:
          - path: /cache
      dshm:
        type: emptyDir
        medium: Memory
        # PyTorch uses /dev/shm for inter-thread tensor sharing; Docker's 64 MiB default is too small.
        sizeLimit: 4Gi
        globalMounts:
          - path: /dev/shm
