apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: menura
  labels:
    flux.onelitefeather.dev/remediation: retries-only
  namespace: menura
spec:
  releaseName: menura
  chart:
    spec:
      chart: ./deploy/helm/menura
      # The chart is read from the `main` branch of the Menura repo. Without
      # Revision, source-controller only repackages when Chart.yaml's version
      # changes, so chart edits that are not releases would never reach the
      # cluster while the HelmRelease still reports Ready. Revision repackages
      # on every commit to the branch (see the same note in sturnus' release.yaml).
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: menura
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  interval: 1m0s
  # Default values
  #
  values: {}
