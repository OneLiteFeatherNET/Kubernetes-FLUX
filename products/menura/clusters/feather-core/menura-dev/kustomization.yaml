apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: menura-dev
generatorOptions:
  disableNameSuffixHash: true
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - release.yaml
  - httproute.yaml
  - ratelimit.yaml

# Own Secret, own namespace: it holds the signing key and the Entra settings
# only, no database credentials. The network policies keep cnpg-system
# unreachable from this namespace.
secretGenerator:
  - name: menura-dev-secrets
    envs:
      - menura-dev-secrets.sops.env
  # Same shared Harbor robot as the other apps in the private `onelitefeather`
  # project (see products/menura/clusters/feather-core/menura/kustomization.yaml).
  - name: harbor-pull
    type: kubernetes.io/dockerconfigjson
    files:
      - .dockerconfigjson=harbor.onelitefeather.dev.dockerconfigjson.sops.json
