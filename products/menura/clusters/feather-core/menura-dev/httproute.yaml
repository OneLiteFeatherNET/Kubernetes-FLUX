# The chart's own routes stay disabled (see release.yaml). Same shape as the
# stelaris-dev route: the API paths go to the server, everything else to web.
# The response headers are the chart's edge.responseHeaders (HSTS, no referrer,
# no MIME sniffing), set here because the chart renders no route for this host.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: menura-dev
spec:
  parentRefs:
    - name: eg
      namespace: envoy
      sectionName: https
  hostnames:
    - menura-dev.apps.onelite.feather
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /health
        - path:
            type: PathPrefix
            value: /openapi
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
              - name: Referrer-Policy
                value: no-referrer
              - name: X-Content-Type-Options
                value: nosniff
      backendRefs:
        - name: menura-dev-server
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
              - name: Referrer-Policy
                value: no-referrer
              - name: X-Content-Type-Options
                value: nosniff
      backendRefs:
        - name: menura-dev-web
          port: 8080
