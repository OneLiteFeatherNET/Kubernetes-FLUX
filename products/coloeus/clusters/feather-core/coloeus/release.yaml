apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coloeus
  namespace: coloeus
spec:
  values:
    # HA prod: 2 replicas with seamless rollouts (surge +1, 0 unavailable),
    # spread across nodes, and a PDB so node drains never take the service down.
    replicaCount: 2
    priorityClassName: feather-standard
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: coloeus
                  app.kubernetes.io/name: micronaut
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    image:
      repository: harbor.onelitefeather.dev/onelitefeather/coloeus
      pullPolicy: IfNotPresent
      tag: "0.1.0"
    imagePullSecrets:
      - name: harbor-pull
    service:
      port: 8080
    metrics:
      enabled: false
      serviceMonitor:
        enabled: false
    ingress:
      enabled: false
    # Routed by the own HTTPRoute (httproute.yaml).
    httpRoute:
      enabled: false
    profiles: ["prod"]

    rbac:
      create: false

    # Opt in to Alloy's JSON log pipeline (LOG_JSON=true emits structured logs).
    podLabels:
      logs.onelitefeather.net/format: json
      logs.onelitefeather.net/env: prod

    # The app exports its own traces via OTLP (OTEL_* env below); no
    # javaagent injection.
    tracing:
      enabled: false

    startupProbe:
      enabled: true
    # The image runs as its own unprivileged user (uid 10001), not the chart's 1000.
    securityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault

    config:
      base: |-
        micronaut:
          application:
            name: coloeus
          server:
            port: 8080
            netty:
              access-logger:
                enabled: true
                # Drop probe noise: kubelet hits /health every 5-10s. Regexes match the request URI.
                exclusions:
                  - /health.*
      profiles:
        prod: |-
          logger:
            levels:
              root: INFO
              # root is INFO, but keep per-request access logs explicit.
              HTTP_ACCESS_LOGGER: INFO
    envFrom:
      - secretRef:
          name: coloeus-database
    # Helm replaces list values: this env list must carry every variable itself.
    env:
      - name: LOG_JSON
        value: "true"
      - name: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=50.0 -Duser.timezone=UTC"
      - name: OTEL_TRACES_EXPORTER
        value: "otlp"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://alloy-receiver.grafana.svc:4317"
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: "grpc"
      - name: OTEL_SERVICE_NAME
        value: "coloeus"
      # Entra ID tenant and API audience. Public identifiers, not secrets.
      - name: COLOEUS_TENANT_ID
        value: "1a14dfb5-0eac-41bf-94cb-195c2e387520"
      - name: COLOEUS_AUDIENCE
        value: "e6ba3e14-7b03-4792-b6aa-d963f776bd0c"
      # The coloeus role allows 20 connections; 5 per pod keeps a rollout (2 replicas + 1 surge = 15) below it.
      - name: DATASOURCES_DEFAULT_MAXIMUM_POOL_SIZE
        value: "5"
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 1
        memory: 768Mi
    readinessProbe:
      path: /health/readiness
      initialDelaySeconds: 5
      periodSeconds: 5
    livenessProbe:
      path: /health/liveness
      initialDelaySeconds: 15
      periodSeconds: 10
