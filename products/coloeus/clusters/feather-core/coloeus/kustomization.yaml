apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coloeus
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ../../../base/coloeus/
  - httproute.yaml
patches:
  - path: release.yaml

secretGenerator:
  - name: harbor-pull
    type: kubernetes.io/dockerconfigjson
    files:
      - .dockerconfigjson=harbor.onelitefeather.dev.dockerconfigjson.sops.json
  - name: coloeus-database
    envs:
      - database.sops.env
