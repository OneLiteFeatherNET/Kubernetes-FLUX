apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coloeus
spec:
  parentRefs:
    - name: eg
      namespace: envoy
      sectionName: https
  hostnames:
    - coloeus.apps.onelite.feather
  rules:
    # The staff web UI (Nitro) owns /admin; everything else is the backend.
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: coloeus-admin-micronaut
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: coloeus-micronaut
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: coloeus
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: coloeus
  # Local = each Envoy proxy pod counts on its own (no rate-limit service in this
  # cluster), so the effective ceiling is 100 rps x Envoy replicas.
  rateLimit:
    local:
      rules:
        - limit:
            requests: 100
            unit: Second
