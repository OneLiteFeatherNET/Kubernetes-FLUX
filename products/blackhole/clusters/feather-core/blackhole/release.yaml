apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackhole
  namespace: blackhole
spec:
  values:
    global:
      environment: prod
      priorityClassName: feather-standard
      imagePullSecrets:
        - name: harbor-pull

    # Shared infrastructure. Every Secret is generated by the kustomization next to this file.
    database:
      existingSecret: blackhole-db
    redis:
      existingSecret: blackhole-redis
    keys:
      existingSecret: blackhole-keys
    nats:
      url: nats://nats.nats.svc:4222
      existingSecret: blackhole-nats
      stream:
        replicas: 3
    s3:
      # In-cluster RGW service; going through the public host would hit Cloudflare's 100 MB limit.
      endpoint: http://rook-ceph-rgw-feather-s3.rook-ceph-fr01.svc:80
      bucket: blackhole-evidence
      # The Secret Rook creates for the ObjectBucketClaim in evidence-bucket.yaml.
      existingSecret: blackhole-evidence
      accessKeyKey: AWS_ACCESS_KEY_ID
      secretKeyKey: AWS_SECRET_ACCESS_KEY

    # Public discovery metadata and object ids, none of them a secret. Entra objects are created
    # by docs/entra-setup.sh in the Blackhole repo.
    auth:
      # The OneLiteFeather Entra tenant (same one apus and dependency-track use).
      tenantId: 1a14dfb5-0eac-41bf-94cb-195c2e387520
      # PLACEHOLDER: client id of the "Blackhole" API app registration (also the token audience).
      apiClientId: 1661e815-9d35-43e1-a3dd-4dee48f78fbd # gitleaks:allow (public client id)
      # PLACEHOLDER: object ids of the Entra groups.
      roles:
        admin: f49e8fc2-6966-4f21-b04a-8cbfb57eeb10
        moderator: 15818bfc-1231-42b8-bfc8-6127c0fbf76a
        viewer: d6909b73-c6e7-4555-937a-c3e985227e3b
        metrics: 5e403ac4-0254-4c78-a2cc-786af25ffeaa
      machineClients:
        proxy: 439fd999-e77a-4462-89ec-70e7de56790b
        metrics: 6e9be876-30ca-4ac9-8e9b-4ec910c5ca8c
        discord: 377ca1e1-ef17-4161-8c31-78168f9d92dd

    # /.well-known/security.txt of the panel and the appeal portal. The contact is the chart default
      # (mailto:security@onelitefeather.net). Renew expires at least yearly: the apps refuse to start on
      # a past or more-than-a-year-ahead date. See the Blackhole chart README, Security disclosure.
    securityTxt:
      expires: "2027-06-30T12:00:00Z"

    backend:
      replicaCount: 2
      # CNPG puts its PgBouncer function public.user_search into every database, so Flyway sees a
      # non-empty schema on the first start. Baseline at 0: every migration from V1 still runs.
      config:
        BLACKHOLE_APPEAL_MIN_DAYS_MANUAL: "0"
        BLACKHOLE_APPEAL_MIN_DAYS_AUTO: "0"
        FLYWAY_DATASOURCES_DEFAULT_BASELINE_ON_MIGRATE: "true"
        FLYWAY_DATASOURCES_DEFAULT_BASELINE_VERSION: "0"
      # Raise after rotating a Secret: the generated Secrets keep stable names and do not roll pods.
      secretRevision: "1"
      # Off until an Entra client for Blackhole.Metrics exists; then add metrics.sops.env as
      # Secret blackhole-metrics (see SECRETS.sops.env.TEMPLATE) and set
      # metrics.serviceMonitor.oauth2.existingSecret.
      metrics:
        serviceMonitor:
          enabled: false
      # The separate host the Velocity proxies (outside the cluster) use; routes only the proxy
      # prefixes. Cloudflare terminates TLS.
      externalApi:
        enabled: true
        host: blackhole-api.onelitefeather.net
        # The API server refuses an Ingress path that starts with ^, so the allow-list runs in the chart's nginx.
        mode: nginx

    web:
      replicaCount: 2
      secretRevision: "1"
      # Panel origin: security.txt names its Canonical URL on it (the chart requires it with securityTxt.contact).
      origin: https://blackhole.onelitefeather.net
      oidc:
        # PLACEHOLDER: client id of the public "Blackhole Panel" app registration.
        clientId: 1ded6f32-02ec-4fc1-be99-67764a815f3c
        # PLACEHOLDER: api://<auth.apiClientId>/access_as_user
        apiScope: api://1661e815-9d35-43e1-a3dd-4dee48f78fbd/access_as_user
      # Cloudflare Tunnel, same pattern as apus and corvus; TLS ends at the edge.
      ingress:
        enabled: true
        host: blackhole.onelitefeather.net
        className: cloudflare-tunnel

    portal:
      replicaCount: 2
      secretRevision: "1"
      origin: https://appeal.onelitefeather.net
      ingress:
        enabled: true
        host: appeal.onelitefeather.net
        className: cloudflare-tunnel

    # Off until the Discord bot token and the guild ids exist.
    discord:
      enabled: false

    clamav:
      enabled: true
      secretRevision: "1"
      persistence:
        storageClass: ceph-rbd-fr01
