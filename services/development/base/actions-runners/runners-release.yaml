apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: isuku-runners
  labels:
    flux.onelitefeather.dev/remediation: retries-only
  namespace: arc-runners
spec:
  releaseName: isuku-runners
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
    namespace: flux-system
  dependsOn:
    # The controller chart ships the AutoscalingRunnerSet CRDs.
    - name: gha-runner-scale-set-controller
      namespace: arc-systems
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  interval: 1m0s
  values:
    # Organization-scoped: the only registration target, see the spec.
    githubConfigUrl: https://github.com/IsukuVerlag
    # Name of the Secret created from github-app.sops.yaml in the cluster overlay.
    githubConfigSecret: isuku-github-app
    runnerScaleSetName: isuku-runners
    controllerServiceAccount:
      namespace: arc-systems
      name: gha-runner-scale-set-controller
    minRunners: 0
    maxRunners: 2
    # Explicit small listener limits, so the LimitRange default (2 CPU / 6Gi) does not
    # eat the namespace quota. Quota is sized for two runners at limits plus this listener.
    listenerTemplate:
      spec:
        containers:
          - name: listener
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 250m
                memory: 256Mi
    template:
      spec:
        # Pod-level: non-root with the image's runner user (uid 1001, see the
        # actions/runner Dockerfile). Runners only ever run plain steps, no Docker.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.2
            command: ["/home/runner/run.sh"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              # 6Gi, not 4Gi: the website's lint and build run Node with a 4 GB heap
              # (--max-old-space-size=4096), which needs room beyond the heap itself.
              limits:
                cpu: "2"
                memory: 6Gi
