# Kubernetes container mode, two runners: each runner pod plus a workflow pod (job container and
# service containers such as Postgres or Directus). Work volumes only from the ephemeral RBD class.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: isuku-runners
  namespace: arc-runners
spec:
  hard:
    requests.cpu: 2500m
    requests.memory: 12Gi
    limits.cpu: "10"
    limits.memory: 32Gi
    persistentvolumeclaims: "4"
    requests.storage: 40Gi
    ceph-rbd-fr01.storageclass.storage.k8s.io/requests.storage: "0"
    ceph-cephfs-fr01.storageclass.storage.k8s.io/requests.storage: "0"
---
# Containers without explicit resources (job and service containers of the workflow pod).
apiVersion: v1
kind: LimitRange
metadata:
  name: isuku-runners
  namespace: arc-runners
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 2Gi
