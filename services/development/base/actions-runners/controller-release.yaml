apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set-controller
  labels:
    flux.onelitefeather.dev/remediation: retries-only
  namespace: arc-systems
spec:
  releaseName: gha-runner-scale-set-controller
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-controller
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  interval: 10m0s
  values:
    # Watch only the runner namespace: no cluster-wide watches on pods and secrets
    # (API-server load, smaller blast radius).
    flags:
      watchSingleNamespace: arc-runners
    # Metrics on :8080 for the controller and for every listener it starts.
    # The controller only passes --listener-metrics-addr when this block is set.
    metrics:
      controllerManagerAddr: ":8080"
      listenerAddr: ":8080"
      listenerEndpoint: "/metrics"
