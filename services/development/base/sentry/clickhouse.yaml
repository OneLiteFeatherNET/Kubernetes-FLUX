apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse
  namespace: sentry
spec:
  releaseName: clickhouse
  chart:
    spec:
      chart: clickhouse
      version: "4.1.1"
      sourceRef:
        kind: HelmRepository
        name: sentry-kubernetes
        namespace: flux-system
  install:
    timeout: 10m0s
    remediation:
      retries: 3
  upgrade:
    timeout: 10m0s
    remediation:
      retries: 3
      remediateLastFailure: true
  interval: 1m0s
  # Default values
  #
  values: {}
