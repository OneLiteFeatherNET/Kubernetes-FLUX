apiVersion: v1
kind: ServiceAccount
metadata:
  name: dependency-track-sbom-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dependency-track-sbom-sync
rules:
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["sbomreports"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dependency-track-sbom-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dependency-track-sbom-sync
subjects:
  - kind: ServiceAccount
    name: dependency-track-sbom-sync
