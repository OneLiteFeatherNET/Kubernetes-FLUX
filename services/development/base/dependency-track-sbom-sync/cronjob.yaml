# Hourly SBOM bridge into Dependency-Track 5. Dry run until the v5 cutover.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dependency-track-sbom-sync
spec:
  schedule: "17 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 2400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dependency-track-sbom-sync
        spec:
          restartPolicy: Never
          serviceAccountName: dependency-track-sbom-sync
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
              command: ["python3", "-I", "-B", "/app/sbom_sync.py"]
              args: ["--dry-run"]
              env:
                - name: DRY_RUN
                  value: "true"
              envFrom:
                - configMapRef:
                    name: dependency-track-sbom-sync-config
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 1Gi
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
                - name: credentials
                  mountPath: /etc/sbom-sync
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: script
              configMap:
                name: dependency-track-sbom-sync-script
            - name: credentials
              secret:
                secretName: dependency-track-sbom-sync
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
