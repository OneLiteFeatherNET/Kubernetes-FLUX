apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ingot-loadtest
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ../../../base/ingot-loadtest
  - postgres.yaml
  - bucket.yaml
secretGenerator:
  # Owner role of the CNPG bootstrap (username, password).
  - name: ingot-loadtest-pg-credentials
    type: kubernetes.io/basic-auth
    envs:
      - pg-credentials.sops.env
  # Ingot connection string (key database), same password as above.
  - name: ingot-loadtest-database
    envs:
      - database.sops.env
