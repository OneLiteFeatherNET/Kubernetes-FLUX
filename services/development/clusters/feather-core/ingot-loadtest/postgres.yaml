# Dedicated PostgreSQL of the load tests, so a run never loads the shared feather-core-cluster-pg.
# Ingot reads the connection string from Secret ingot-loadtest-database, key database
# ("postgresql ingot-loadtest-pg-rw.ingot-loadtest.svc.cluster.local:5432 ingot ingot <password>").
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ingot-loadtest-pg
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
  bootstrap:
    initdb:
      database: ingot
      owner: ingot
      secret:
        name: ingot-loadtest-pg-credentials
  # The operator adds barman-cloud to every Cluster (CNPG_INCLUDE_PLUGINS). Without a backup store
  # the instance cannot load it and never becomes ready. Test data needs no backup.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: false
  postgresql:
    parameters:
      # Room for the scalable topologies with several replicas, each with its own pool.
      max_connections: "200"
  storage:
    size: 10Gi
    storageClass: ceph-rbd-fr01
  # Small enough to fit the nearly full workers. feather-low would be preempted by any default pod,
  # and the development layer waits for this cluster to be ready.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 512Mi
  priorityClassName: feather-standard
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: fr01
