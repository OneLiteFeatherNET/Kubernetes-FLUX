apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reposilite-cloudflare-tunnel
  annotations:
    # The dashboard serves plain HTTP on 8080 and proxies everything else to the backend.
    cloudflare-tunnel-ingress-controller.strrl.dev/backend-protocol: http
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: repo-staging.onelitefeather.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingot-dashboard
                port:
                  number: 8080
