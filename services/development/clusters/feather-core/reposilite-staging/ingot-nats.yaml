# A small NATS broker for the staging Ingot cluster bus. It runs in operator (JWT) mode like the
# shared NATS in the nats namespace, but with its own operator, account and user, because the shared
# keystore is not available to automation. Its config is in ingot-nats.sops.conf and the user
# credentials Ingot connects with are in ingot-nats-creds.sops.conf.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingot-nats
  labels:
    app.kubernetes.io/name: ingot-nats
    app.kubernetes.io/part-of: ingot
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ingot-nats
  # One broker and no JetStream, so there is nothing to share while a pod is replaced.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingot-nats
        app.kubernetes.io/part-of: ingot
        logs.onelitefeather.net/env: staging
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          # Tag and digest, as Renovate maintains them together.
          image: nats:2.15.1@sha256:023a08c46caa5aff878fb86841187bebfdad9a6e3c552ba5c1a1e18938bbf88a
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/nats/nats.conf
          ports:
            - name: client
              containerPort: 4222
              protocol: TCP
            - name: monitor
              containerPort: 8222
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: ingot-nats-config
---
apiVersion: v1
kind: Service
metadata:
  name: ingot-nats
  labels:
    app.kubernetes.io/name: ingot-nats
    app.kubernetes.io/part-of: ingot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingot-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
      protocol: TCP
    - name: monitor
      port: 8222
      targetPort: monitor
      protocol: TCP
