# The Ingot dashboard in its own container: a small Node server (Nitro) on a distroless base. It
# serves the dashboard and proxies every other path to the backend Service, so one backend address
# is enough. See the split dashboard how-to in the Ingot repository for the request routing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingot-dashboard
  labels:
    app.kubernetes.io/name: ingot-dashboard
    app.kubernetes.io/part-of: ingot
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ingot-dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingot-dashboard
        app.kubernetes.io/part-of: ingot
        logs.onelitefeather.net/env: staging
    spec:
      # The dashboard talks to the backend over HTTP and needs no API access.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # The image's numeric nonroot user; the distroless base has no user database.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ingot-dashboard
                topologyKey: kubernetes.io/hostname
      containers:
        - name: ingot-dashboard
          # Tag and digest, as Renovate and the image automation maintain them together. The digest
          # is the one the nightly tag pointed at when this line was last rolled out.
          image: ghcr.io/onelitefeathernet/ingot-dashboard:nightly@sha256:af2b0bffbf2fe47a402719003007f43fbd6a70b32d59797f2bdb972afc3c4143 # {"$imagepolicy": "flux-system:ingot-dashboard-staging"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # The backend Service of the staging Ingot server.
            - name: INGOT_BACKEND
              value: "http://reposilite.reposilite-staging.svc.cluster.local:8080"
          # /healthz answers from the dashboard process alone, so a slow backend does not take the
          # dashboard out of rotation.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: ingot-dashboard
  labels:
    app.kubernetes.io/name: ingot-dashboard
    app.kubernetes.io/part-of: ingot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingot-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingot-dashboard
  labels:
    app.kubernetes.io/name: ingot-dashboard
    app.kubernetes.io/part-of: ingot
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingot-dashboard
