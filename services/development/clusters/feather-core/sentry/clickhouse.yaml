apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse
  namespace: sentry
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: feather-standard
          # ClickHouse images from 24.x on run a user-setup step in their
          # entrypoint: with neither CLICKHOUSE_USER nor CLICKHOUSE_PASSWORD
          # set, it writes users.d/default-user.xml to disable network access
          # for `default`. This chart mounts users.d from a ConfigMap, so that
          # path is read-only and the container dies before the server starts:
          #
          #   /entrypoint.sh: line 156:
          #     /etc/clickhouse-server/users.d/default-user.xml: Read-only file system
          #
          # Flux then saw StatefulSet status 'Failed' and rolled back to 23.8
          # five times over. The chart has no env: block at all -- it only
          # exports SHARD in the container command -- so this cannot come from
          # values and has to be patched in here. The chart's own users
          # ConfigMap already defines `default`, so skipping the step is right.
          - target:
              kind: StatefulSet
              name: clickhouse
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/env
                value:
                  - name: CLICKHOUSE_SKIP_USER_SETUP
                    value: "1"
  values:
    clickhouse:
      # The chart's own appVersion is 23.8, which is far behind what Sentry
      # 26.7 needs: upstream self-hosted builds its ClickHouse from
      # altinity/clickhouse-server:25.3.6.10034.altinitystable. On 23.8 the
      # events_analytics_platform migrations 0049/0050 died mid-run and left
      # themselves marked in_progress, which blocks every later migration
      # attempt. Pin the image the upstream actually uses.
      image: altinity/clickhouse-server
      imageVersion: "25.3.6.10034.altinitystable"

      # Upstream self-hosted Sentry runs a single ClickHouse. The chart default
      # is 3, but replication here needs Zookeeper, which this cluster does not
      # have -- three nodes without it would be three unsynchronised copies,
      # not a cluster.
      replicas: 1
      configmap:
        remote_servers:
          replica:
            backup:
              # Gates a second StatefulSet (clickhouse-replica) plus its
              # services. Without Zookeeper that replica can never stay in
              # sync, so it is pure overhead -- and `replicas: 1` alone does
              # not remove it.
              enabled: false
      persistentVolumeClaim:
        enabled: true
        dataPersistentVolume:
          enabled: true
          accessModes:
            - ReadWriteOnce
          storageClassName: ceph-rbd-fr01
          storage: 200Gi
        logsPersistentVolume:
          enabled: true
          accessModes:
            - ReadWriteOnce
          storageClassName: ceph-rbd-fr01
          storage: 20Gi
      podLabels:
        logs.onelitefeather.net/env: prod
      resources:
        requests:
          cpu: 500m
          memory: 4Gi
        limits:
          memory: 8Gi
