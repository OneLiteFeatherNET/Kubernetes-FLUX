apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dependency-track-v5-internal
spec:
  parentRefs:
    - name: eg
      namespace: envoy
      sectionName: https
  hostnames:
    - dependency-track.apps.onelite.feather
  rules:
    # Internal API path for hosts that Cloudflare's bot challenge blocks (BOM uploads).
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: dependency-track-v5-api-server
          port: 8080
