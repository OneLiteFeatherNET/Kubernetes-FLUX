apiVersion: 1
groups:
  - orgId: 1
    name: core_services
    folder: Core Services
    interval: 60s
    rules:
      - uid: flux-core-layer-not-ready
        title: Flux core layer not ready
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Sustain check lives in PromQL instead of `for:`, so short reconcile blips never
              # fire; aggregating to exactly 2 labels is a hard requirement of the Discord template.
              expr: min_over_time((max by (exported_namespace, name) (gotk_resource_info{customresource_kind="Kustomization", ready!="True"}) or max by (exported_namespace, name) (gotk_resource_info{customresource_kind="Kustomization"}) * 0)[15m:1m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        keepFiringFor: 15m
        annotations:
          summary: "Flux Kustomization {{ $labels.name }} (namespace {{ $labels.exported_namespace }}) has not been Ready for 15 minutes."
          problem: "Kustomization not Ready for >15 min"
          service: "Flux"
          threshold: "Ready = True (sustained 15 min)"
          object_label: "Layer"
          object_key: "name"
          location_key: "exported_namespace"
          check: "Look at the layer's status conditions first - a layer below a stuck dependency only reports that its dependency is not ready and is not the cause."
          check_command: "flux get kustomization -A"
          dashboard_url: "https://grafana.apps.onelite.feather/d/flux-control-plane"
        labels:
          severity: critical
      - uid: core-infra-helmrelease-not-ready
        title: Core infrastructure HelmRelease not ready
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Dropped metallb/dragonfly (never existed in 90d retention), added 9 real infra
              # releases; descheduler stays out on purpose (optimiser, not a dependency).
              expr: min_over_time((max by (exported_namespace, name) (gotk_resource_info{customresource_kind="HelmRelease", ready!="True", name=~"alloy-logs|alloy-metrics|alloy-receiver|ceph-csi-drivers|cert-manager|cloudflare-tunnel-ingress-controller|cnpg|envoy|grafana|kube-prometheus-stack|loki|mariadb-operator|mariadb-operator-crds|mimir|rook-ceph|spegel|step-ca|step-issuer|tempo"}) or max by (exported_namespace, name) (gotk_resource_info{customresource_kind="HelmRelease", name=~"alloy-logs|alloy-metrics|alloy-receiver|ceph-csi-drivers|cert-manager|cloudflare-tunnel-ingress-controller|cnpg|envoy|grafana|kube-prometheus-stack|loki|mariadb-operator|mariadb-operator-crds|mimir|rook-ceph|spegel|step-ca|step-issuer|tempo"}) * 0)[15m:1m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        keepFiringFor: 15m
        annotations:
          summary: "Flux HelmRelease {{ $labels.name }} (namespace {{ $labels.exported_namespace }}) has not been Ready for 15 minutes."
          problem: "HelmRelease not Ready for >15 min"
          service: "Flux"
          threshold: "Ready = True (sustained 15 min)"
          object_label: "Release"
          object_key: "name"
          location_key: "exported_namespace"
          check: "Read the HelmRelease status; a failed upgrade usually leaves a pending-upgrade lock that has to be cleared before Flux retries."
          check_command: "flux get helmrelease -A"
          dashboard_url: "https://grafana.apps.onelite.feather/d/flux-control-plane"
        labels:
          severity: critical
  - orgId: 1
    name: backups
    folder: Backups
    interval: 60s
    rules:
      - uid: cnpg-backup-stale
        title: CNPG backup stale
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # cnpg_collector_last_available_backup_timestamp never updates for
              # plugin-based (barman-cloud) backups -- confirmed live it stays
              # stuck at 0 even after real completed backups. cnpg_backup_stopped_at_seconds
              # (kube-state-metrics customResourceState reading the Backup CR itself)
              # is the metric that actually reflects reality.
              expr: (time() - max(cnpg_backup_stopped_at_seconds{cluster="feather-core-cluster-pg", phase="completed"})) / 3600
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 24
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "No successful CloudNativePG (Postgres) backup in over 24h."
          problem: "No backup for over 24 h"
          service: "CloudNativePG"
          threshold: "< 24 h since last backup"
          value_unit: "h since last backup"
          value_fmt: "%.1f"
          location: "cnpg-system"
          check: "Check whether the scheduled backup still runs and whether the S3 target accepts writes."
          check_command: "kubectl -n cnpg-system get backups.postgresql.cnpg.io"
          dashboard_url: "https://grafana.apps.onelite.feather/d/cloudnative-pg"
        labels:
          severity: warning
      - uid: cnpg-backup-failing
        title: CNPG backup failing
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Same dead-metric issue as cnpg-backup-stale: the legacy
              # cnpg_collector_last_failed_backup_timestamp metric never fires
              # for plugin-based backups. Failed backups never get a stoppedAt
              # (only completed ones do), so use createdAt instead: any Backup
              # CR that entered phase=failed within the staleness window (24h).
              expr: count(cnpg_backup_created_at_seconds{cluster="feather-core-cluster-pg", phase="failed"} > (time() - 86400)) OR vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "CloudNativePG's most recent backup attempt failed (a failure timestamp is newer than the last successful one)."
          problem: "Backup attempt failed"
          service: "CloudNativePG"
          threshold: "0 failures in 24 h"
          value_unit: "failed backups in 24 h"
          value_fmt: "%.0f"
          location: "cnpg-system"
          check: "Read the failed Backup object's error field; S3 credentials and RGW user permissions are the usual cause."
          check_command: "kubectl -n cnpg-system get backups.postgresql.cnpg.io"
          dashboard_url: "https://grafana.apps.onelite.feather/d/cloudnative-pg"
        labels:
          severity: warning
      - uid: mariadb-galera-backup-job-failed
        title: MariaDB Galera backup job failed
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Seconds the newest failed run is newer than the last successful one; a retry that succeeds clears it. Jobs are owned by the PhysicalBackup (no CronJob).
              expr: max(kube_job_status_start_time{job="kube-state-metrics", namespace="mariadb-galera"} and on (namespace, job_name) (kube_job_status_failed{job="kube-state-metrics", namespace="mariadb-galera"} > 0) and on (namespace, job_name) kube_job_owner{job="kube-state-metrics", namespace="mariadb-galera", owner_name="mariadb-galera-backup"}) - max(kube_job_status_completion_time{job="kube-state-metrics", namespace="mariadb-galera"} and on (namespace, job_name) kube_job_owner{job="kube-state-metrics", namespace="mariadb-galera", owner_name="mariadb-galera-backup"}) > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          # No dashboard_url: the mariadb-galera dashboard (gnetId 13106) covers
          # cluster health, not backup jobs, so it wouldn't add useful context here.
          summary: "The mariadb-galera-backup CronJob's most recent Job run failed."
          problem: "Backup CronJob failed"
          service: "MariaDB Galera"
          threshold: "no failed run after the last success"
          value_unit: "s after the last success"
          value_fmt: "%.0f"
          location: "mariadb-galera"
          check: "Read the log of the failed Job's pod."
          check_command: "kubectl -n mariadb-galera get jobs"
        labels:
          severity: warning
      - uid: mongodb-backup-job-failed
        title: MongoDB backup job failed
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Newest failed run newer than the last success (seconds); only CronJob-owned Jobs, so manual test Jobs never page and a successful retry clears it.
              expr: max(kube_job_status_start_time{job="kube-state-metrics", namespace="mongodb"} and on (namespace, job_name) (kube_job_status_failed{job="kube-state-metrics", namespace="mongodb"} > 0) and on (namespace, job_name) kube_job_owner{job="kube-state-metrics", namespace="mongodb", owner_name="mongodb-backup"}) - max(kube_cronjob_status_last_successful_time{job="kube-state-metrics", namespace="mongodb", cronjob="mongodb-backup"}) > 0
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "A Job created by the mongodb-backup CronJob failed."
          problem: "Backup CronJob failed"
          service: "MongoDB"
          threshold: "no failed run after the last success"
          value_unit: "s after the last success"
          value_fmt: "%.0f"
          location: "mongodb"
          check: "Read the log of the failed Job pod."
          check_command: "kubectl -n mongodb get jobs"
        labels:
          severity: warning
      - uid: mongodb-backup-stale
        title: MongoDB backup stale
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # 6 h schedule plus 1 h slack; no data (CronJob never succeeded) alerts too.
              expr: (time() - max(kube_cronjob_status_last_successful_time{job="kube-state-metrics", namespace="mongodb", cronjob="mongodb-backup"})) / 3600
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 7
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "No successful MongoDB backup in over 7 h (schedule is every 6 h)."
          problem: "No backup for over 7 h"
          service: "MongoDB"
          threshold: "< 7 h since last backup"
          value_unit: "h since last backup"
          value_fmt: "%.1f"
          location: "mongodb"
          check: "Check whether the CronJob is suspended or its Jobs fail."
          check_command: "kubectl -n mongodb get cronjob,jobs"
        labels:
          severity: warning
  - orgId: 1
    name: storage
    folder: Storage
    interval: 60s
    rules:
      - uid: mariadb-galera-pvc-usage-high
        title: MariaDB Galera PVC usage high
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Aggregating to (persistentvolumeclaim, node) is what the Discord template needs and keeps a pod reschedule (new instance label) from spawning a second alert instance.
              expr: max by (persistentvolumeclaim, node) (kubelet_volume_stats_used_bytes{namespace="mariadb-galera", persistentvolumeclaim=~"storage-mariadb-galera-.*"} / kubelet_volume_stats_capacity_bytes{namespace="mariadb-galera", persistentvolumeclaim=~"storage-mariadb-galera-.*"}) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "MariaDB Galera PVC {{ $labels.persistentvolumeclaim }} on node {{ $labels.node }} is above 80% capacity."
          problem: "PVC over 80 % full"
          service: "MariaDB Galera"
          threshold: "< 80 % used"
          value_unit: "% used"
          value_fmt: "%.1f"
          object_label: "PVC"
          object_key: "persistentvolumeclaim"
          location_key: "node"
          check: "Check binlog and tmp growth before resizing; the volume grows via storage.size in the MariaDB CR."
          check_command: "kubectl -n mariadb-galera get pvc"
          dashboard_url: "https://grafana.apps.onelite.feather/d/pXgz0qFGk/galera-mariadb-overview"
        labels:
          severity: warning
      - uid: mariadb-galera-pvc-usage-critical
        title: MariaDB Galera PVC almost full
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              expr: max by (persistentvolumeclaim, node) (kubelet_volume_stats_used_bytes{namespace="mariadb-galera", persistentvolumeclaim=~"storage-mariadb-galera-.*"} / kubelet_volume_stats_capacity_bytes{namespace="mariadb-galera", persistentvolumeclaim=~"storage-mariadb-galera-.*"}) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "MariaDB Galera PVC {{ $labels.persistentvolumeclaim }} on node {{ $labels.node }} is above 90% capacity and at risk of filling up."
          problem: "PVC over 90 % full"
          service: "MariaDB Galera"
          threshold: "< 90 % used"
          value_unit: "% used"
          value_fmt: "%.1f"
          object_label: "PVC"
          object_key: "persistentvolumeclaim"
          location_key: "node"
          check: "Check binlog and tmp growth before resizing; the volume grows via storage.size in the MariaDB CR."
          check_command: "kubectl -n mariadb-galera get pvc"
          dashboard_url: "https://grafana.apps.onelite.feather/d/pXgz0qFGk/galera-mariadb-overview"
        labels:
          severity: critical
      - uid: mongodb-volume-filling
        title: MongoDB data volume filling up
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Aggregating to (persistentvolumeclaim, node) is what the Discord template needs and keeps a pod reschedule (new instance label) from spawning a second alert instance.
              expr: max by (persistentvolumeclaim, node) (kubelet_volume_stats_used_bytes{job="kubelet", namespace="mongodb", persistentvolumeclaim=~"data-volume-.*"} / kubelet_volume_stats_capacity_bytes{job="kubelet", namespace="mongodb", persistentvolumeclaim=~"data-volume-.*"}) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          summary: "MongoDB PVC {{ $labels.persistentvolumeclaim }} on node {{ $labels.node }} is above 80% capacity."
          problem: "PVC over 80 % full"
          service: "MongoDB"
          threshold: "< 80 % used"
          value_unit: "% used"
          value_fmt: "%.1f"
          object_label: "PVC"
          object_key: "persistentvolumeclaim"
          location_key: "node"
          check: "Check oplog and data growth before resizing; the volume grows via the MongoDBCommunity statefulSet volumeClaimTemplates."
          check_command: "kubectl -n mongodb get pvc"
        labels:
          severity: warning
      - uid: ceph-cluster-health-warning
        title: Ceph cluster health degraded
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              expr: max(ceph_health_status)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        # Only rule kept as the sentinel for "Ceph telemetry is gone": ceph_health_status was
        # present 40319/40321 min in 28 days (longest gap 1 min), so for: 10m cannot blip-fire.
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "Ceph cluster health is not HEALTH_OK (HEALTH_WARN or worse)."
          problem: "Ceph not HEALTH_OK"
          service: "Rook-Ceph"
          threshold: "HEALTH_OK"
          value_unit: "(0 = OK, 1 = WARN, 2 = ERR)"
          value_fmt: "%.0f"
          location: "rook-ceph-fr01"
          check: "Read the health detail output; a single failing OSD or a stuck PG is the common case."
          check_command: "kubectl -n rook-ceph-fr01 exec deploy/rook-ceph-tools -- ceph health detail"
          dashboard_url: "https://grafana.apps.onelite.feather/d/tbO9LAiZK/ceph-cluster"
        labels:
          severity: warning
      - uid: ceph-cluster-health-critical
        title: Ceph cluster health critical
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              expr: max(ceph_health_status)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Ceph cluster health is HEALTH_ERR."
          problem: "Ceph HEALTH_ERR"
          service: "Rook-Ceph"
          threshold: "not HEALTH_ERR"
          value_unit: "(0 = OK, 1 = WARN, 2 = ERR)"
          value_fmt: "%.0f"
          location: "rook-ceph-fr01"
          check: "Read the health detail output; HEALTH_ERR usually means unfound objects, full OSDs or a down monitor quorum."
          check_command: "kubectl -n rook-ceph-fr01 exec deploy/rook-ceph-tools -- ceph health detail"
          dashboard_url: "https://grafana.apps.onelite.feather/d/tbO9LAiZK/ceph-cluster"
        labels:
          severity: critical
