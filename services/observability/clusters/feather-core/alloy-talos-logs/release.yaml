# Talos machine.logging intake (json_lines over TCP). Separate from alloy-receiver
# so Talos traffic never shares pods or ports with the public OTLP path.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-talos-logs
  namespace: grafana
spec:
  values:
    controller:
      type: deployment
      replicas: 2
      priorityClassName: feather-high
      podLabels:
        logs.onelitefeather.net/env: prod
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
    service:
      type: LoadBalancer
      # Fixed address from Cilium pool lb-fr01. Talos machine.logging destination:
      # tcp://10.200.90.8:5140 (format json_lines).
      annotations:
        lbipam.cilium.io/ips: "10.200.90.8"
    serviceMonitor:
      enabled: true
    configReloader:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 64Mi
    alloy:
      # otelcol.receiver.tcplog (the Talos json_lines listener) is "experimental";
      # Alloy refuses to load it at the default generally-available level.
      stabilityLevel: experimental
      extraPorts:
        - name: talos-logs
          port: 5140
          targetPort: 5140
          protocol: TCP
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      configMap:
        content: |
          // Talos sends each service log line as one JSON object (json_lines) over TCP.
          // The OTel tcplog receiver splits the stream into one record per line and
          // hands the raw line to loki.process via otelcol.exporter.loki; the Talos
          // fields are lifted into labels there.
          otelcol.receiver.tcplog "talos" {
            listen_address = "0.0.0.0:5140"

            output {
              logs = [otelcol.exporter.loki.talos.input]
            }
          }

          otelcol.exporter.loki "talos" {
            forward_to = [loki.process.talos.receiver]
          }

          loki.process "talos" {
            stage.static_labels {
              values = {
                job = "talos",
              }
            }

            // otelcol.exporter.loki wraps the OTel record as {"body": "<line>"};
            // unwrap it first, then parse the Talos JSON inside.
            stage.json {
              expressions = {
                talos_raw = "body",
              }
            }

            // talos-level / talos-service / talos-time are the fields Talos always sends.
            // node comes from machine.logging.destinations[].extraTags on the Talos side.
            stage.json {
              source      = "talos_raw"
              expressions = {
                msg     = "msg",
                level   = "\"talos-level\"",
                service = "\"talos-service\"",
                node    = "node",
                log_ts  = "\"talos-time\"",
              }
            }

            stage.timestamp {
              source = "log_ts"
              format = "RFC3339Nano"
            }

            stage.labels {
              values = {
                level   = "level",
                service = "service",
                node    = "node",
              }
            }

            // auditd alone sends several hundred lines per second per node (SELinux
            // audit records), drowning every other service. Drop it until there is a
            // use for audit records and a filter that keeps only the relevant ones.
            stage.drop {
              source = "service"
              value  = "auditd"
            }

            // The stored line is the Talos message text, not the JSON envelope.
            stage.output {
              source = "msg"
            }

            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.grafana.svc.cluster.local/loki/api/v1/push"
            }

            external_labels = {
              cluster = "feather-core",
            }
          }
