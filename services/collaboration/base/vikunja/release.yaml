apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vikunja
  namespace: vikunja
spec:
  releaseName: vikunja
  chart:
    spec:
      chart: ./helm/vikunja
      sourceRef:
        kind: GitRepository
        name: helmcharts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  interval: 1m0s
  # Default values
  #
  values: {}
