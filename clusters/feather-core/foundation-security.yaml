apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-security
  namespace: flux-system
spec:
  # Trivy operator (ClientServer). The server PVC needs storage; ServiceMonitor CRDs come from platform.
  dependsOn:
    - name: foundation-platform
    - name: foundation-storage
  interval: 10m0s
  retryInterval: 30s
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./foundation/layers/feather-core/trivy
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
