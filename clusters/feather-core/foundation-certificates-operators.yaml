apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-certificates-operators
  namespace: flux-system
spec:
  # cert-manager, step-certificates and step-issuer: the CRDs and controllers behind every Certificate and Issuer.
  dependsOn:
    - name: foundation-platform
  interval: 1m0s
  retryInterval: 30s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./foundation/layers/feather-core/certificates-operators
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
