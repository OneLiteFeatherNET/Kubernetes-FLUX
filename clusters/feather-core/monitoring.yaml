apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: configs
  interval: 1m0s
  retryInterval: 30s
  timeout: 20m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./services/layers/feather-core/monitoring
  # frozen for the layer split (split-flux-layers); do not re-enable before the legacy layers are retired
  prune: false
  deletionPolicy: Orphan
  # wait:false on purpose: loki/mimir/tempo depend on the
  # external Ceph RGW S3 backend whose bucket quota can be exceeded.
  # Health-gating here must NOT block base-apps -> apps.
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      ALLOWED_CIDRS: "172.16.0.0/16,10.200.0.0/16,192.168.0.0/16"
