apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-databases-operators
  namespace: flux-system
spec:
  # CloudNativePG (incl. barman-cloud plugin), mariadb-operator and Dragonfly operator. The mariadb-operator
  # webhook and the barman-cloud plugin use cert-manager Certificates/Issuer; CRDs come from foundation-platform.
  dependsOn:
    - name: foundation-platform
    - name: foundation-certificates-operators
  interval: 10m0s
  retryInterval: 30s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./foundation/layers/feather-core/databases-operators
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  patches:
    # Stateful or CRD-heavy releases: retries only, no automatic rollback.
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        labelSelector: "flux.onelitefeather.dev/remediation=retries-only"
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: not-used
        spec:
          install:
            remediation:
              retries: 3
          upgrade:
            remediation:
              retries: 3
