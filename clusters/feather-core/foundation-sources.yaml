apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-sources
  namespace: flux-system
spec:
  # ImageRepository/ImagePolicy/ImageUpdateAutomation (stelaris-image-automation.yaml)
  # live here, and their CRDs are only installed by the flux-system root
  # Kustomization (clusters/feather-core/flux-system/gotk-components.yaml).
  # Both watch the same GitRepository, so without this they'd race on the same
  # revision - dependsOn makes foundation-sources wait until flux-system is Ready
  # (CRDs established, its controller Deployments healthy) before applying.
  dependsOn:
    - name: flux-system
  interval: 1m0s
  retryInterval: 30s
  timeout: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./foundation/layers/feather-core/sources
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
