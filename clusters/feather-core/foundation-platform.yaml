apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-platform
  namespace: flux-system
spec:
  # PriorityClasses and CRD bundles every later layer needs.
  dependsOn:
    - name: foundation-observability
  interval: 10m0s
  retryInterval: 30s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./foundation/layers/feather-core/platform
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
