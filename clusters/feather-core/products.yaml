apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: products
  namespace: flux-system
spec:
  # OneLiteFeather's own projects (production): bluemap, apus, sturnus, otis, stelaris, vulpes.
  dependsOn:
    # Harbor serves the images; the foundation layers are reached through services-development
    - name: services-development
  interval: 10m0s
  retryInterval: 30s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./products/layers/feather-core/prod
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      ALLOWED_CIDRS: "172.16.0.0/16,10.200.0.0/16,192.168.0.0/16"
  patches:
    # HelmRelease remediation defaults; opt-outs via the flux.onelitefeather.dev/remediation label.
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        labelSelector: "flux.onelitefeather.dev/remediation notin (retries-only,manual)"
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: not-used
        spec:
          install:
            remediation:
              retries: 3
          upgrade:
            cleanupOnFail: true
            remediation:
              retries: 3
              remediateLastFailure: true
              strategy: rollback
    # Stateful or CRD-heavy releases: retries only, no automatic rollback.
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        labelSelector: "flux.onelitefeather.dev/remediation=retries-only"
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: not-used
        spec:
          install:
            remediation:
              retries: 3
          upgrade:
            remediation:
              retries: 3
