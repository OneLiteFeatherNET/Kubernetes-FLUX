apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-networking
  namespace: flux-system
spec:
  # MetalLB pools and BGP, the shared Gateway with its certificates, and MetalLB monitoring.
  dependsOn:
    - name: foundation-networking-operators
    - name: foundation-certificates
  interval: 10m0s
  retryInterval: 30s
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./foundation/layers/feather-core/networking
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
