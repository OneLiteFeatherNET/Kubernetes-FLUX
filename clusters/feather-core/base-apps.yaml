apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: base-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: configs
    - name: foundation-databases
    - name: foundation-messaging
  interval: 10m0s
  retryInterval: 30s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./services/layers/feather-core/base-apps
  # frozen for the layer split (split-flux-layers); do not re-enable before the legacy layers are retired
  prune: false
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      ALLOWED_CIDRS: "172.16.0.0/16,10.200.0.0/16,192.168.0.0/16"
