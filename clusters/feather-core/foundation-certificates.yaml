apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-certificates
  namespace: flux-system
spec:
  # ClusterIssuers (ACME) and the internal step-ca Certificates, issued by the operators layer.
  dependsOn:
    - name: foundation-certificates-operators
  interval: 1m0s
  retryInterval: 30s
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./foundation/layers/feather-core/certificates
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  # wait:false keeps the legacy internal-certs rule: an internal-only cert that cannot be issued yet
  # must not block the layers behind this one.
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
