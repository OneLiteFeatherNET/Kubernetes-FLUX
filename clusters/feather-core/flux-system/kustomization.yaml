apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
- monitoring.yaml
# gotk-components.yaml is generated by `flux bootstrap` ("DO NOT EDIT"). It sets
# priorityClassName: system-cluster-critical on source-, kustomize- and
# helm-controller, but not on notification-controller — an upstream quirk.
# Patched here so it survives the next bootstrap regenerating that file.
patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: notification-controller
      namespace: flux-system
    spec:
      template:
        spec:
          priorityClassName: system-cluster-critical
# Retry layers blocked on a dependency after 5s instead of the 30s default
# (9-hop layer chain adds ~4.5 min to a rollout). Upstream: fluxcd.io bootstrap customization.
- patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --requeue-dependency=5s
  target:
    kind: Deployment
    namespace: flux-system
    name: "(kustomize-controller|helm-controller)"
