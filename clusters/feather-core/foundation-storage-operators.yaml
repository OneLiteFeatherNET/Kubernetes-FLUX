apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-storage-operators
  namespace: flux-system
spec:
  # Rook operator and the Ceph CSI drivers (CRDs, RBD/CephFS drivers); needs feather-critical
  # and the snapshot/ServiceMonitor CRDs from foundation-platform.
  dependsOn:
    - name: foundation-platform
  interval: 1m0s
  retryInterval: 30s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./foundation/layers/feather-core/storage-operators
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
