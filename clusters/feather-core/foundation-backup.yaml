apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-backup
  namespace: flux-system
spec:
  # Velero (cluster backups, RBD CSI snapshots). Own layer so that a failing Velero install
  # cannot block foundation-storage, which holds Rook-Ceph.
  dependsOn:
    - name: foundation-storage
  interval: 10m0s
  retryInterval: 30s
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./foundation/layers/feather-core/backup
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
