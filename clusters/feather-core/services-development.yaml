apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-development
  namespace: flux-system
spec:
  # Developer tooling: Harbor, Reposilite, Dependency-Track, Sentry, Penpot, Telepresence. Needs networking, storage, databases, messaging and certificates.
  dependsOn:
    - name: foundation-networking
    - name: foundation-storage
    - name: foundation-databases
    - name: foundation-messaging
    - name: foundation-certificates
  interval: 10m0s
  retryInterval: 30s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./services/layers/feather-core/development
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      ALLOWED_CIDRS: "172.16.0.0/16,10.200.0.0/16,192.168.0.0/16"
