apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-data
  namespace: flux-system
spec:
  # Polaris (Iceberg REST catalog), Airflow and their secrets, buckets and CNPG databases in namespace data.
  # Needs the operators (data-operators), the CNPG databases (databases) and the RGW buckets and users (storage).
  dependsOn:
    - name: foundation-data-operators
    - name: foundation-databases
    - name: foundation-storage
  interval: 10m0s
  retryInterval: 30s
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./foundation/layers/feather-core/data
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
