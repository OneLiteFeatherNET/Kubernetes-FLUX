apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-media
  namespace: flux-system
spec:
  # Media: Jellyfin, Kavita, media-library, filebrowser. Needs networking, storage and messaging.
  dependsOn:
    - name: foundation-networking
    - name: foundation-storage
    - name: foundation-messaging
  interval: 10m0s
  retryInterval: 30s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./services/layers/feather-core/media
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substitute:
      ALLOWED_CIDRS: "172.16.0.0/16,10.200.0.0/16,192.168.0.0/16"
