apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: foundation-observability
  namespace: flux-system
spec:
  # First after sources: provides the Prometheus Operator CRDs (ServiceMonitor/PodMonitor/PrometheusRule)
  # that later layers' HelmReleases and monitors need.
  dependsOn:
    - name: foundation-sources
  interval: 1m0s
  retryInterval: 30s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./foundation/layers/feather-core/observability
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
