apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-dependency-track-v5
  namespace: flux-system
spec:
  # Dependency-Track 5 beside v4 (test hostname until cutover). Own layer, so a failing v5 release does not hold services-development, which products depend on.
  dependsOn:
    - name: foundation-databases
    - name: foundation-networking
    - name: foundation-storage
  interval: 10m0s
  retryInterval: 30s
  timeout: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./services/layers/feather-core/dependency-track-v5
  prune: true
  # Orphan: deleting this CR must never delete what it manages
  deletionPolicy: Orphan
  # wait:false on purpose: the suspended release and Jobs never report Ready, which would hold this layer NotReady from merge.
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  patches:
    # HelmRelease remediation defaults; opt-outs via the flux.onelitefeather.dev/remediation label.
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        labelSelector: "flux.onelitefeather.dev/remediation notin (retries-only,manual)"
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: not-used
        spec:
          install:
            remediation:
              retries: 3
          upgrade:
            cleanupOnFail: true
            remediation:
              retries: 3
              remediateLastFailure: true
              strategy: rollback
    # Stateful, CRD-heavy or schema-migrating releases: retries only, no automatic rollback.
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        labelSelector: "flux.onelitefeather.dev/remediation=retries-only"
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: not-used
        spec:
          install:
            remediation:
              retries: 3
          upgrade:
            remediation:
              retries: 3
