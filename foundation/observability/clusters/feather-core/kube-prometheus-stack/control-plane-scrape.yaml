apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane-scrape
  namespace: monitoring
---
# Read access the chart's control-plane ServiceMonitors need to scrape kubelet,
# apiserver, controller-manager, etcd, scheduler, proxy and coredns with the
# token in control-plane-scrape-token.yaml. Mirrors the chart's prometheus RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: control-plane-scrape
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: control-plane-scrape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: control-plane-scrape
subjects:
  - kind: ServiceAccount
    name: control-plane-scrape
    namespace: monitoring
