apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: luckperms
spec:
  # If you want the user to be created with a different name than the resource name
  # name: user-custom
  mariaDbRef:
    name: mariadb-galera
  passwordSecretKeyRef:
    name: user-luckperms-secret
    key: password
  # This field defaults to 10
  # Every service and proxy keeps a pool of 10, and MaxScale opens each client session on all
  # three Galera nodes: 250 left no room once all proxies were restarted.
  maxUserConnections: 350
  host: "%"
  # Delete the resource in the database whenever the CR gets deleted.
  # Alternatively, you can specify Skip in order to omit deletion.
  cleanupPolicy: Delete
  requeueInterval: 10h
  retryInterval: 30s