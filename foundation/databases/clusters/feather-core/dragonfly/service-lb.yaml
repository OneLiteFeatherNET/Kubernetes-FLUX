apiVersion: v1
kind: Service
metadata:
  name: dragonfly-master-lb
  namespace: dragonfly
  annotations:
    # Reuse the external IP the old Bitnami redis master used (freed when the
    # bitnami redis was decommissioned). Clients keep the same host:port.
    lbipam.cilium.io/ips: "10.200.90.5"
spec:
  type: LoadBalancer
  # Only the master's node announces the VIP: one path, no cross-node hop.
  externalTrafficPolicy: Local
  # IP is pinned via the lbipam.cilium.io/ips annotation above; do not also set spec.loadBalancerIP.
  # Master-only: the dragonfly-operator maintains `role: master` on exactly one
  # pod and moves the label to the new master on failover, so this LB always
  # points at the current write master (never a read-only replica).
  selector:
    app: dragonfly
    role: master
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
