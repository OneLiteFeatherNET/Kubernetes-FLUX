apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: feather-core-cluster-pg-pooler-rw-tx
  namespace: cnpg-system
spec:
  cluster:
    name: feather-core-cluster-pg
  type: rw
  instances: 2
  pgbouncer:
    # Transaction mode multiplexes idle client pools onto few backends; apps move here from direct connections.
    poolMode: transaction
    parameters:
      max_client_conn: "400"
      # Per (user,db) pool and per pooler pod: 2 pods * 20 caps one app at 40 backends.
      default_pool_size: "20"
      # Lets pgjdbc/pgx/asyncpg keep server-side prepared statements in transaction mode (PgBouncer >= 1.21).
      max_prepared_statements: "200"
      # Hand idle backends back to Postgres after 60s instead of 600s.
      server_idle_timeout: "60"
  template:
    spec:
      priorityClassName: feather-high
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
