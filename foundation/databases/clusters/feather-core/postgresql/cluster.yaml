apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: feather-core-cluster-pg
  namespace: cnpg-system
spec:
  instances: 3
  # Exact tag; trixie is maintained (bullseye has no CNPG builds since 2026-08-31).
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
  postgresql:
    parameters:
      # Raised from the CNPG default (100): the shared cluster sits at saturation
      # (large idle pools, esp. harbor ~26 + dependency-track ~23), which starves
      # apps of connection slots during restart storms. Memory bumped in lockstep
      # below (~5-10MB/backend). See the postgres-connection-saturation memory note;
      # the proper fix is pooler adoption + trimming idle pools.
      max_connections: "200"
  storage:
    size: 75Gi
    storageClass: ceph-rbd-fr01
  # Memory request==limit for OOM safety; raised 1Gi -> 2Gi to cover
  # max_connections=200 (each backend ~5-10MB). CPU request only (no CPU limit
  # to avoid throttling the DB).
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 2Gi
  enableSuperuserAccess: true
  priorityClassName: feather-platform
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: fr01
    podAntiAffinityType: preferred
  managed:
    roles:
      - name: harbor
        login: true
        ensure: present
        passwordSecret:
          name: role-harbor
      - name: otis
        login: true
        ensure: present
        passwordSecret:
          name: role-otis
      - name: otis_dev
        login: true
        ensure: present
        passwordSecret:
          name: role-otis-dev
      - name: vulpes
        login: true
        ensure: present
        passwordSecret:
          name: role-vulpes
      - name: vulpes_dev
        login: true
        ensure: present
        passwordSecret:
          name: role-vulpes-dev
      # Telepresence developers; dev databases only via membership.
      - name: developer
        login: true
        ensure: present
        inRoles:
          - otis_dev
          - vulpes_dev
        passwordSecret:
          name: role-developer
      - name: titan
        login: true
        ensure: present
        passwordSecret:
          name: role-titan
      - name: titan_dev
        login: true
        ensure: present
        passwordSecret:
          name: role-titan-dev
      - name: outline
        login: true
        ensure: present
        passwordSecret:
          name: role-outline
      - name: dependency-track
        login: true
        ensure: present
        passwordSecret:
          name: role-dependency-track
      - name: backstage
        login: true
        ensure: present
        passwordSecret:
          name: role-backstage
      - name: grafana
        login: true
        ensure: present
        passwordSecret:
          name: role-grafana
      - name: n8n
        login: true
        ensure: present
        passwordSecret:
          name: role-n8n
      - name: penpot
        login: true
        ensure: present
        passwordSecret:
          name: role-penpot
      - name: sentry
        login: true
        ensure: present
        passwordSecret:
          name: role-sentry
      - name: vikunja
        login: true
        ensure: present
        passwordSecret:
          name: role-vikunja
      - name: sturnus
        login: true
        ensure: present
        passwordSecret:
          name: role-sturnus
      - name: skygridng
        login: true
        ensure: present
        connectionLimit: 20
        passwordSecret:
          name: role-skygridng
      # Ingest, score and the migrate hook connect to the -rw service directly
      # (advisory locks do not survive the transaction pooler). Capped so a
      # runaway worker count cannot exhaust the shared 200 connection slots.
      - name: corvus
        login: true
        ensure: present
        connectionLimit: 30
        passwordSecret:
          name: role-corvus
      # ML jobs: reads corvus.player_keys to unwrap the DEKs of raw-byte builds. Least
      # privilege (CONNECT, USAGE, SELECT on that table) cannot be declared in CNPG;
      # the grants are a one-time SQL step, see the pull request. Not a superuser, no
      # inRoles.
      - name: corvus_jobs
        login: true
        ensure: present
        connectionLimit: 5
        passwordSecret:
          name: role-corvus-jobs
      # Gedeckelt: geteilter Cluster nahe der Sättigung (max_connections: 200).
      - name: metabase
        login: true
        ensure: present
        connectionLimit: 15
        passwordSecret:
          name: role-metabase
      # Nur lesend: pg_read_all_data deckt alle Datenbanken ab, auch künftige.
      # Gedeckelt: geteilter Cluster nahe der Sättigung (max_connections: 200).
      - name: metabase_ro
        login: true
        ensure: present
        inRoles:
          - pg_read_all_data
        connectionLimit: 20
        passwordSecret:
          name: role-metabase-ro
      - name: cygnus_stats
        login: true
        ensure: present
        connectionLimit: 20
        passwordSecret:
          name: role-cygnus-stats
      - name: cygnus_stats_dev
        login: true
        ensure: present
        connectionLimit: 10
        passwordSecret:
          name: role-cygnus-stats-dev
      # Blackhole ban system. Capped: the shared cluster sits near saturation
      # (max_connections: 200). The backend's pool is sized per replica, and prod
      # runs 2 replicas plus one surge pod during a rollout.
      - name: blackhole
        login: true
        ensure: present
        connectionLimit: 30
        passwordSecret:
          name: role-blackhole
      # Group role of the Blackhole analytics views. Migration V37 only creates it when it is missing,
      # and the application role may not create roles.
      - name: analytics_reader
        login: false
        ensure: present
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: "feather-core-cluster-pg-rw-external"
              annotations:
                metallb.io/loadBalancerIPs: 10.200.90.3
            spec:
              type: LoadBalancer
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: s3-store
