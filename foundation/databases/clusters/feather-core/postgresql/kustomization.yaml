apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cnpg-system
generatorOptions:
  disableNameSuffixHash: true
resources:
  - cluster.yaml
  - podmonitor.yaml
  - object-store.yaml
  - backup.yaml
  - scheduled-backup.yaml
  - pooler-rw.yaml
  - pooler-rw-tx.yaml
  - pooler-ro.yaml
  - pdb.yaml
  - database/harbor.yaml
  - database/outline.yaml
  - database/otis.yaml
  - database/otis-dev.yaml
  - database/vulpes.yaml
  - database/vulpes-dev.yaml
  - database/titan.yaml
  - database/titan-dev.yaml
  - database/backstage.yaml
  - database/dependency-track.yaml
  - database/grafana.yaml
  - database/n8n.yaml
  - database/penpot.yaml
  - database/sentry.yaml
  - database/vikunja.yaml
  - database/sturnus.yaml
  - database/corvus.yaml
  - database/metabase.yaml
  - database/cygnus-stats.yaml
  - database/cygnus-stats-dev.yaml
  - database/skygridng.yaml
  - database/blackhole.yaml
  - database/blackhole-dev.yaml

secretGenerator:
