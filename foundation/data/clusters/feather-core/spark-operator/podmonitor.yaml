apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: spark-kubernetes-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-kubernetes-operator
  podMetricsEndpoints:
    - port: metrics-port
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
