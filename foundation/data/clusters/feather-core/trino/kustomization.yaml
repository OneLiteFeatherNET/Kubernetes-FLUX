apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ../../../base/trino
  - networkpolicy.yaml
patches:
  - path: release.yaml

secretGenerator:
  # Entra client secret of "Polaris Trino" (client id is inline in release.yaml).
  - name: trino-oauth
    envs:
      - trino-oauth.sops.env
