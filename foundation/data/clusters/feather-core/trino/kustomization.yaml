apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ../../../base/trino
  - networkpolicy.yaml
patches:
  - path: release.yaml

secretGenerator:
  # Entra client secret of "Polaris Trino" (client id is inline in release.yaml).
  - name: trino-oauth
    envs:
      - trino-oauth.sops.env
  # S3 keys of RGW user trino-lake (copied from rook-ceph-object-user-feather-s3-trino-lake in
  # rook-ceph-fr01); the bucket policy on polaris-corvus allows this user to read only.
  - name: trino-lake-s3
    envs:
      - trino-lake-s3.sops.env
