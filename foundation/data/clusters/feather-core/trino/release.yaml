apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trino
  namespace: data
spec:
  values:
    # Pinned explicitly, same as the chart's appVersion (484) at the time of the pin.
    image:
      tag: "484"

    server:
      # Two workers, so a crashed worker leaves Trino slower instead of unavailable.
      workers: 2
      config:
        query:
          # Cluster-wide query memory: per-node limit (1500MB) times the two workers.
          maxMemory: "3GB"

    coordinator:
      priorityClassName: feather-standard
      # Heap at about two thirds of the limit: the rest is metaspace, thread stacks and the
      # native buffers of the S3 client. A heap at 75% of the limit got the pod OOM-killed.
      jvm:
        maxHeapSize: "2G"
      config:
        query:
          maxMemoryPerNode: "1GB"
      resources:
        requests:
          cpu: 250m
          memory: 3Gi
        limits:
          memory: 3Gi

    worker:
      priorityClassName: feather-standard
      # Heap at about two thirds of the limit, as on the coordinator: Parquet reads from S3 use
      # off-heap buffers, and a heap of 2400M in 3Gi got the worker OOM-killed under dashboards.
      jvm:
        maxHeapSize: "3G"
      config:
        query:
          maxMemoryPerNode: "1500MB"
      resources:
        # The XL nodes are nearly full on requests: request what the old worker had, so the pods
        # schedule, and keep the limit as the headroom above the 3G heap.
        requests:
          cpu: 500m
          memory: 3Gi
        limits:
          memory: 4608Mi
      # Replace one worker at a time without a surge pod: with one worker per node and full nodes,
      # a surge pod has nowhere to go and the rollout (and the Helm upgrade) times out.
      deployment:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
      # Spread the workers over nodes when there is room. Preferred, not required: the XL nodes are
      # nearly full, and a hard rule left the second worker unschedulable.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: trino
                    app.kubernetes.io/instance: trino
                    app.kubernetes.io/component: worker

    # Environment for the catalog properties (${ENV:...}). Applies to coordinator and worker.
    # The client id is not a secret; the client secret and the trino-lake keys are.
    env:
      - name: POLARIS_TRINO_CLIENT_ID
        value: "8832de30-7197-40ed-a2bc-68c88bc770cb"
      - name: POLARIS_TRINO_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: trino-oauth
            key: POLARIS_TRINO_CLIENT_SECRET
      # Keys of the read-only RGW user trino-lake (Secret trino-lake-s3, kustomization.yaml).
      - name: TRINO_LAKE_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: trino-lake-s3
            key: access-key
      - name: TRINO_LAKE_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: trino-lake-s3
            key: secret-key

    catalogs:
      # Iceberg catalog of the Polaris warehouse "corvus". Polaris issues no vended credentials
      # (RGW has no STS), Trino reads S3 with the keys of the RGW user trino-lake.
      corvus: |
        connector.name=iceberg
        iceberg.catalog.type=rest
        iceberg.rest-catalog.uri=http://polaris.data.svc.cluster.local:8181/api/catalog
        iceberg.rest-catalog.warehouse=corvus
        iceberg.rest-catalog.security=OAUTH2
        iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_TRINO_CLIENT_ID}:${ENV:POLARIS_TRINO_CLIENT_SECRET}
        iceberg.rest-catalog.oauth2.server-uri=https://login.microsoftonline.com/1a14dfb5-0eac-41bf-94cb-195c2e387520/oauth2/v2.0/token
        iceberg.rest-catalog.oauth2.scope=api://9e2548f4-5e10-440d-9444-cad813a20c87/.default
        iceberg.rest-catalog.vended-credentials-enabled=false
        # Second layer besides the file-based access control: the connector itself writes nothing.
        iceberg.security=read_only
        fs.native-s3.enabled=true
        s3.endpoint=http://rook-ceph-rgw-feather-s3.rook-ceph-fr01.svc
        s3.path-style-access=true
        s3.region=us-east-1
        s3.aws-access-key=${ENV:TRINO_LAKE_ACCESS_KEY}
        s3.aws-secret-key=${ENV:TRINO_LAKE_SECRET_KEY}

    accessControl:
      # File-based rules: the catalog corvus and the system catalog are read-only. Everything
      # else (no rule matches) is denied. Trino does not authenticate users in this setup
      # (no authenticationType); the NetworkPolicy is what limits callers to Superset.
      type: configmap
      refreshPeriod: 60s
      rules:
        rules.json: |-
          {"catalogs": [{"catalog": "corvus", "allow": "read-only"}, {"catalog": "system", "allow": "read-only"}]}

    # Metrics are not scraped in this change: the NetworkPolicy admits only Superset and Trino.
    serviceMonitor:
      enabled: false

    networkPolicy:
      # The overlay ships its own NetworkPolicy (networkpolicy.yaml); the chart's stays off.
      enabled: false
