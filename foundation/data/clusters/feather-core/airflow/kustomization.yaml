apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ../../../base/airflow
  - rbac.yaml
  - servicemonitor.yaml
  - httproute.yaml
  - airflow-pools-job.yaml
patches:
  - path: release.yaml

secretGenerator:
  # fernet-key, api-secret-key, jwt-secret (referenced by the chart's *SecretName values).
  - name: airflow-keys
    envs:
      - airflow-keys.sops.env
  # Entra client of the lake-maintenance job. client_secret is a PLACEHOLDER (REPLACE_ME)
  # until the maintainer sets the real secret with `sops`.
  - name: lake-maintenance-oauth
    envs:
      - lake-maintenance-oauth.sops.env
  # Entra clients of the lake pipeline and erasure DAGs (roles lake-pipeline, lake-erasure).
  # SOPS-encrypted client_id and client_secret, created by the maintainer in Entra ID.
  - name: lake-pipeline-oauth
    envs:
      - lake-pipeline-oauth.sops.env
  - name: lake-erasure-oauth
    envs:
      - lake-erasure-oauth.sops.env

configMapGenerator:
  # Pool definitions for the import Job (no secrets).
  - name: airflow-pools
    files:
      - pools.json
