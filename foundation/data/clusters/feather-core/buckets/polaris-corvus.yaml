# Warehouse bucket of the Polaris catalog "corvus". Deliberately NOT in rook-ceph-fr01: Rook writes the
# credentials Secret (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) and the ConfigMap into the claim's
# namespace, and Polaris reads them from namespace data (same approach as products/corvus/.../bucket.yaml).
# The name differs from the Corvus product bucket corvus-lake, which already exists with owner corvus.
# The owner is the dedicated CephObjectStoreUser polaris in foundation/storage/.../rook-fr01/users/polaris.yaml.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: polaris-corvus
spec:
  bucketName: polaris-corvus
  storageClassName: ceph-bucket-fr01
  additionalConfig:
    bucketOwner: polaris
    # Object access for the Corvus ingest, score and ML jobs (CephObjectStoreUser corvus-lake in
    # foundation/storage/.../rook-fr01/users/corvus-lake.yaml). Rook applies additionalConfig when
    # it provisions the claim; see the PR for the post-merge check.
    bucketPolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "CorvusLakeObjects",
            "Effect": "Allow",
            "Principal": {"AWS": ["arn:aws:iam:::user/corvus-lake"]},
            "Action": [
              "s3:ListBucket", "s3:ListBucketMultipartUploads", "s3:GetBucketLocation",
              "s3:GetObject", "s3:PutObject", "s3:DeleteObject",
              "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"
            ],
            "Resource": ["arn:aws:s3:::polaris-corvus", "arn:aws:s3:::polaris-corvus/*"]
          },
          {
            "Sid": "TrinoLakeRead",
            "Effect": "Allow",
            "Principal": {"AWS": ["arn:aws:iam:::user/trino-lake"]},
            "Action": ["s3:GetObject", "s3:ListBucket", "s3:GetBucketLocation"],
            "Resource": ["arn:aws:s3:::polaris-corvus", "arn:aws:s3:::polaris-corvus/*"]
          }
        ]
      }
