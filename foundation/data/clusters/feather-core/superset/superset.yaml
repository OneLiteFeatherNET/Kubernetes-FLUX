# Superset instance managed by the Apache Superset Kubernetes Operator (superset-system, watches data).
# Operator: https://apache.github.io/superset-kubernetes-operator/ (chart 0.3.0, see superset-operator sources).
# Secrets come from the SOPS Secret superset-secrets; no secret value appears in this file.
apiVersion: superset.apache.org/v1alpha1
kind: Superset
metadata:
  name: superset
spec:
  environment: Production
  image:
    # Pinned release tag. The operator keys migrations off repository:tag, so never a mutable tag.
    # py311 variant: DuckDB 2.x needs Python >= 3.11 (the default 6.1.0 image ships 3.10).
    tag: "6.1.0-py311"
  secretKeyFrom:
    name: superset-secrets
    key: secret-key
  metastore:
    # CloudNativePG database superset (role superset), reached through the rw service.
    hostFrom:
      name: superset-secrets
      key: host
    portFrom:
      name: superset-secrets
      key: port
    databaseFrom:
      name: superset-secrets
      key: dbname
    usernameFrom:
      name: superset-secrets
      key: username
    passwordFrom:
      name: superset-secrets
      key: password
  # Driver packages (trino client, psycopg2) are installed by the init container in podTemplate into
  # /opt/pydeps. This script puts that directory on PYTHONPATH and keeps the image's own entry.
  bootstrapScript: |
    export PYTHONPATH="/opt/pydeps${PYTHONPATH:+:$PYTHONPATH}"
  # Appended to superset_config.py of every Python component. Login is Entra ID only; the
  # Superset role mapping and the DuckDB connection come from this file and from lifecycle.init.
  config: |
    import os
    from flask_appbuilder.security.manager import AUTH_OAUTH

    # Entra ID is the only login (AUTH_OAUTH, provider azure). Assignment to the enterprise
    # app is enforced by Entra; Superset creates no user for an unassigned account.
    AUTH_TYPE = AUTH_OAUTH
    OAUTH_PROVIDERS = [
        {
            "name": "azure",
            "icon": "fa-windows",
            "token_key": "access_token",
            "remote_app": {
                "client_id": "b592b27d-d127-4de6-9e4d-d3e252b46852",
                "client_secret": os.environ.get("ENTRA_CLIENT_SECRET"),
                "server_metadata_url": "https://login.microsoftonline.com/1a14dfb5-0eac-41bf-94cb-195c2e387520/v2.0/.well-known/openid-configuration",
                "client_kwargs": {"scope": "openid profile email"},
            },
        }
    ]
    # Roles come from the id token "roles" claim (Entra app roles), synced at every login.
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = "Gamma"
    AUTH_ROLES_SYNC_AT_LOGIN = True
    AUTH_ROLES_MAPPING = {"superset-admin": ["Admin"]}
    # Behind the Envoy Gateway: honour X-Forwarded-* for the OAuth redirect URL.
    ENABLE_PROXY_FIX = True

    # No shared cache (no Valkey): file-system caches, no Celery, no async queries.
    CACHE_CONFIG = {
        "CACHE_TYPE": "FileSystemCache",
        "CACHE_DIR": "/tmp/superset-cache",
        "CACHE_DEFAULT_TIMEOUT": 86400,
    }
    DATA_CACHE_CONFIG = CACHE_CONFIG
    FILTER_STATE_CACHE_CONFIG = CACHE_CONFIG
    EXPLORE_FORM_DATA_CACHE_CONFIG = CACHE_CONFIG
    FEATURE_FLAGS = {"GLOBAL_ASYNC_QUERIES": False}

    # DuckDB reads the corvus Iceberg tables through Polaris and S3 directly (replaces Trino).
    # Every new DuckDB connection loads the pre-installed extensions and attaches the catalog.
    from sqlalchemy import event
    from sqlalchemy.engine import Engine


    @event.listens_for(Engine, "connect")
    def _attach_corvus(dbapi_connection, connection_record):
        if not type(dbapi_connection).__module__.startswith(("duckdb", "_duckdb")):
            return
        env = os.environ
        for statement in (
            "SET extension_directory = '/opt/pydeps/duckdb-extensions'",
            "SET autoinstall_known_extensions = false",
            "SET memory_limit = '768MB'",
            "SET threads = 2",
            "SET temp_directory = '/tmp/duckdb'",
            "LOAD httpfs",
            "LOAD iceberg",
        ):
            dbapi_connection.execute(statement)
        dbapi_connection.execute(
            "CREATE SECRET lake_s3 (TYPE s3, KEY_ID $1, SECRET $2, REGION 'us-east-1',"
            " ENDPOINT 'rook-ceph-rgw-feather-s3.rook-ceph-fr01.svc', URL_STYLE 'path', USE_SSL false)",
            [env["LAKE_S3_ACCESS_KEY"], env["LAKE_S3_SECRET_KEY"]],
        )
        dbapi_connection.execute(
            "CREATE SECRET polaris (TYPE iceberg, CLIENT_ID $1, CLIENT_SECRET $2,"
            " OAUTH2_SERVER_URI 'https://login.microsoftonline.com/1a14dfb5-0eac-41bf-94cb-195c2e387520/oauth2/v2.0/token',"
            " OAUTH2_SCOPE 'api://9e2548f4-5e10-440d-9444-cad813a20c87/.default')",
            [env["POLARIS_CLIENT_ID"], env["POLARIS_CLIENT_SECRET"]],
        )
        dbapi_connection.execute(
            "ATTACH 'corvus' AS corvus (TYPE iceberg, SECRET polaris, ACCESS_DELEGATION_MODE 'none',"
            " ENDPOINT 'http://polaris.data.svc.cluster.local:8181/api/catalog')"
        )
        # SQL Lab users must not read the pod's files or change these limits; S3 goes through httpfs.
        dbapi_connection.execute("SET disabled_filesystems = 'LocalFileSystem'")
        dbapi_connection.execute("SET lock_configuration = true")

  podTemplate:
    priorityClassName: feather-standard
    podSecurityContext:
      runAsNonRoot: true
      # The image names its user (superset, created by useradd without -u: UID/GID 1000), so the
      # kubelet cannot verify runAsNonRoot without a numeric id.
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    initContainers:
      # Trino client, DuckDB with duckdb-engine and its extensions for the corvus connection,
      # psycopg2 for the metastore and authlib for the
      # Entra login (AUTH_OAUTH imports it; the image does not ship it). The Superset 6.1.0 image
      # is the minimal build without database drivers. Same tag as spec.image.tag.
      - name: install-drivers
        image: apachesuperset.docker.scarf.sh/apache/superset:6.1.0-py311
        command:
          - /bin/sh
          - -c
          # The image's venv (/app/.venv) has no pip; the image installs packages with uv
          # (/usr/local/bin/uv, see the upstream Dockerfile), so the init container does the same.
          - |
            set -e
            uv pip install --no-cache --python /app/.venv/bin/python --target /opt/pydeps trino==0.340.0 psycopg2-binary==2.9.13 authlib==1.9.3 duckdb==2.0.1
            # Without dependencies: duckdb-engine would pull a SQLAlchemy 2 that shadows Superset's 1.4.
            uv pip install --no-cache --no-deps --python /app/.venv/bin/python --target /opt/pydeps duckdb-engine==0.17.0
            # Extensions are installed here so the Superset container never downloads at query time.
            mkdir -p /opt/pydeps/duckdb-extensions
            HOME=/tmp PYTHONPATH=/opt/pydeps /app/.venv/bin/python -c "import duckdb; c = duckdb.connect(config={'extension_directory': '/opt/pydeps/duckdb-extensions'}); [c.execute('INSTALL ' + e) for e in ('httpfs', 'avro', 'iceberg')]"
        volumeMounts:
          - name: pydeps
            mountPath: /opt/pydeps
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
    volumes:
      - name: pydeps
        emptyDir: {}
      # Datasource import (DuckDB connection corvus). Plain ConfigMap, no credential inside.
      - name: datasource-import
        configMap:
          name: superset-datasources
      # Corvus dashboard bundle (flat ConfigMap keys, see corvus-bundle/). Plain, no secret.
      - name: corvus-bundle
        configMap:
          name: superset-corvus-bundle
    container:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        # Superset writes /tmp (file cache) and the rendered config path.
        readOnlyRootFilesystem: false
      volumeMounts:
        - name: pydeps
          mountPath: /opt/pydeps
        - name: datasource-import
          mountPath: /app/configs
          readOnly: true
        - name: corvus-bundle
          mountPath: /app/corvus-bundle
          readOnly: true
      env:
        - name: ENTRA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: superset-secrets
              key: entra-client-secret
        # DuckDB: Polaris principal and read-only S3 keys, shared with Trino until Trino is removed.
        - name: POLARIS_CLIENT_ID
          value: "8832de30-7197-40ed-a2bc-68c88bc770cb"
        - name: POLARIS_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: trino-oauth
              key: POLARIS_TRINO_CLIENT_SECRET
        - name: LAKE_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: trino-lake-s3
              key: access-key
        - name: LAKE_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: trino-lake-s3
              key: secret-key
      # Queries run in the Superset process: up to 8 at once (gunicorn below) x DuckDB memory_limit
      # 768MB, spilling to /tmp/duckdb.
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          memory: 8Gi

  webServer:
    # Service superset-web-server (operator naming: {name}-web-server), port 8088.
    replicas: 1
    # A dashboard fires all its chart queries at once; cap them at 8 and allow slow cold queries.
    gunicorn:
      workers: 2
      threads: 4
      timeout: 120
    podTemplate:
      container:
        # The default probe (5 s timeout, 3 failures) restarted the pod while dashboards loaded.
        livenessProbe:
          httpGet:
            path: /health
            port: 8088
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
    service:
      type: ClusterIP

  # No celeryWorker, celeryBeat, celeryFlower, websocketServer or mcpServer: absent means disabled.
  # No networkPolicy: the operator creates its own policies only when this field is set, and those
  # would allow all egress. The policies of this overlay (networkpolicy.yaml) replace them.

  lifecycle:
    podTemplate:
      container:
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 1Gi
    init:
      # A custom init command is not wrapped by the operator, so it sources the bootstrap script itself.
      # Same as `superset init` plus the datasource import the Helm chart used to do.
      command:
        - /bin/sh
        - -c
        - |
          . /app/pythonpath/superset_bootstrap.sh
          superset init
          if [ -f /app/configs/import_datasources.yaml ]; then
            superset import_datasources -p /app/configs/import_datasources.yaml
          fi
          # Corvus dashboard bundle: zip the flat keys, then import with an Admin as owner. Overwrites
          # the bundle objects on every start (code is the source). Skipped until a user has logged in.
          if [ -f /app/corvus-bundle/metadata.yaml ]; then
            /app/.venv/bin/python /app/corvus-bundle/build_bundle.py /app/corvus-bundle /tmp/corvus-packet-types.zip
            # The config loader prints a line on stdout; the username is the last line.
            owner="$(/app/.venv/bin/python /app/corvus-bundle/owner_username.py | tail -n 1)"
            if [ -n "$owner" ]; then
              superset import-dashboards -p /tmp/corvus-packet-types.zip -u "$owner" || echo "corvus bundle import failed"
            else
              echo "no Superset user yet, corvus bundle import skipped"
            fi
          fi
