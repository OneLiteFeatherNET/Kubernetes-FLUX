sql: "{% if from_dttm %}{% set lo = \"DATE '\" ~ (from_dttm | string | truncate(10, true, '')) ~ \"'\" %}{% else %}{% set lo = \"current_date - INTERVAL '7' DAY\" %}{% endif %}{% if to_dttm %}{% set hi\
  \ = \"DATE '\" ~ (to_dttm | string | truncate(10, true, '')) ~ \"'\" %}{% else %}{% set hi = \"current_date\" %}{% endif %}\nWITH vocabulary (id, name, vocab_direction, private, payload_policy) AS (\n\
  \  VALUES\n    (1, 'C_TELEPORT_CONFIRM', 'serverbound', false, 'default'),\n    (2, 'C_CLIENT_STATUS', 'serverbound', false, 'default'),\n    (3, 'C_CLIENT_SETTINGS', 'serverbound', false, 'default'),\n\
  \    (4, 'C_WINDOW_CONFIRMATION', 'serverbound', false, 'default'),\n    (5, 'C_CLICK_WINDOW_BUTTON', 'serverbound', false, 'default'),\n    (6, 'C_CLICK_WINDOW', 'serverbound', false, 'stripped'),\n\
  \    (7, 'C_CLOSE_WINDOW', 'serverbound', false, 'default'),\n    (8, 'C_PLUGIN_MESSAGE', 'serverbound', false, 'stripped'),\n    (9, 'C_INTERACT_ENTITY', 'serverbound', false, 'default'),\n    (10, 'C_KEEP_ALIVE',\
  \ 'serverbound', false, 'default'),\n    (11, 'C_PLAYER_POSITION', 'serverbound', false, 'default'),\n    (12, 'C_PLAYER_POSITION_AND_ROTATION', 'serverbound', false, 'default'),\n    (13, 'C_PLAYER_ROTATION',\
  \ 'serverbound', false, 'default'),\n    (14, 'C_PLAYER_FLYING', 'serverbound', false, 'default'),\n    (15, 'C_VEHICLE_MOVE', 'serverbound', false, 'default'),\n    (16, 'C_STEER_BOAT', 'serverbound',\
  \ false, 'default'),\n    (17, 'C_PLAYER_ABILITIES', 'serverbound', false, 'default'),\n    (18, 'C_PLAYER_DIGGING', 'serverbound', false, 'default'),\n    (19, 'C_ENTITY_ACTION', 'serverbound', false,\
  \ 'default'),\n    (20, 'C_STEER_VEHICLE', 'serverbound', false, 'default'),\n    (21, 'C_PONG', 'serverbound', false, 'default'),\n    (22, 'C_HELD_ITEM_CHANGE', 'serverbound', false, 'default'),\n \
  \   (23, 'C_CREATIVE_INVENTORY_ACTION', 'serverbound', false, 'stripped'),\n    (24, 'C_ANIMATION', 'serverbound', false, 'default'),\n    (25, 'C_PLAYER_BLOCK_PLACEMENT', 'serverbound', false, 'default'),\n\
  \    (26, 'C_USE_ITEM', 'serverbound', false, 'default'),\n    (27, 'C_CLIENT_TICK_END', 'serverbound', false, 'default'),\n    (28, 'C_PLAYER_INPUT', 'serverbound', false, 'default'),\n    (29, 'C_ATTACK',\
  \ 'serverbound', false, 'default'),\n    (30, 'C_PUNCH', 'serverbound', false, 'default'),\n    (31, 'C_SPECTATE', 'serverbound', false, 'stripped'),\n    (32, 'C_PICK_ITEM', 'serverbound', false, 'default'),\n\
  \    (33, 'C_CONFIGURATION_ACK', 'serverbound', false, 'default'),\n    (34, 'C_CHUNK_BATCH_ACK', 'serverbound', false, 'default'),\n    (35, 'C_RESOURCE_PACK_STATUS', 'serverbound', false, 'default'),\n\
  \    (36, 'C_PLAYER_LOADED', 'serverbound', false, 'default'),\n    (37, 'C_EDIT_BOOK', 'serverbound', false, 'stripped'),\n    (38, 'C_NAME_ITEM', 'serverbound', false, 'stripped'),\n    (39, 'C_UPDATE_COMMAND_BLOCK',\
  \ 'serverbound', false, 'stripped'),\n    (40, 'C_UPDATE_COMMAND_BLOCK_MINECART', 'serverbound', false, 'stripped'),\n    (41, 'C_UPDATE_STRUCTURE_BLOCK', 'serverbound', false, 'stripped'),\n    (42,\
  \ 'C_UPDATE_JIGSAW_BLOCK', 'serverbound', false, 'stripped'),\n    (43, 'C_UPDATE_SIGN', 'serverbound', false, 'stripped'),\n    (44, 'C_COOKIE_RESPONSE', 'serverbound', false, 'stripped'),\n    (45,\
  \ 'C_SET_TEST_BLOCK', 'serverbound', false, 'stripped'),\n    (46, 'C_TEST_INSTANCE_BLOCK_ACTION', 'serverbound', false, 'stripped'),\n    (47, 'C_CUSTOM_CLICK_ACTION', 'serverbound', false, 'stripped'),\n\
  \    (48, 'C_SET_GAME_RULE', 'serverbound', false, 'stripped'),\n    (49, 'C_CHAT_PREVIEW', 'serverbound', true, 'frame_dropped'),\n    (50, 'C_CHAT_MESSAGE', 'serverbound', true, 'frame_dropped'),\n\
  \    (51, 'C_TAB_COMPLETE', 'serverbound', true, 'frame_dropped'),\n    (52, 'C_CHAT_COMMAND', 'serverbound', true, 'frame_dropped'),\n    (53, 'C_CHAT_COMMAND_UNSIGNED', 'serverbound', true, 'frame_dropped'),\n\
  \    (54, 'C_CHAT_ACK', 'serverbound', true, 'frame_dropped'),\n    (55, 'C_CHAT_SESSION_UPDATE', 'serverbound', true, 'frame_dropped'),\n    (100, 'S_ENTITY_RELATIVE_MOVE', 'clientbound', false, 'default'),\n\
  \    (101, 'S_ENTITY_RELATIVE_MOVE_AND_ROTATION', 'clientbound', false, 'default'),\n    (102, 'S_ENTITY_ROTATION', 'clientbound', false, 'default'),\n    (103, 'S_ENTITY_HEAD_LOOK', 'clientbound', false,\
  \ 'default'),\n    (104, 'S_ENTITY_TELEPORT', 'clientbound', false, 'default'),\n    (105, 'S_ENTITY_VELOCITY', 'clientbound', false, 'default'),\n    (106, 'S_ENTITY_POSITION_SYNC', 'clientbound', false,\
  \ 'default'),\n    (107, 'S_PLAYER_POSITION_AND_LOOK', 'clientbound', false, 'default'),\n    (108, 'S_KEEP_ALIVE', 'clientbound', false, 'all_only'),\n    (109, 'S_PING', 'clientbound', false, 'all_only'),\n\
  \    (110, 'S_WINDOW_CONFIRMATION', 'clientbound', false, 'all_only'),\n    (111, 'S_DAMAGE_EVENT', 'clientbound', false, 'all_only'),\n    (112, 'S_HURT_ANIMATION', 'clientbound', false, 'all_only'),\n\
  \    (113, 'S_ENTITY_ANIMATION', 'clientbound', false, 'all_only'),\n    (114, 'S_ENTITY_STATUS', 'clientbound', false, 'all_only'),\n    (115, 'S_EXPLOSION', 'clientbound', false, 'all_only'),\n    (116,\
  \ 'S_UPDATE_HEALTH', 'clientbound', false, 'all_only'),\n    (117, 'S_RESPAWN', 'clientbound', false, 'all_only'),\n    (118, 'S_JOIN_GAME', 'clientbound', false, 'all_only'),\n    (119, 'S_DESTROY_ENTITIES',\
  \ 'clientbound', false, 'all_only'),\n    (120, 'S_SPAWN_ENTITY', 'clientbound', false, 'all_only'),\n    (121, 'S_ENTITY_EFFECT', 'clientbound', false, 'all_only'),\n    (122, 'S_REMOVE_ENTITY_EFFECT',\
  \ 'clientbound', false, 'all_only'),\n    (123, 'S_ENTITY_EQUIPMENT', 'clientbound', false, 'all_only'),\n    (124, 'S_ENTITY_METADATA', 'clientbound', false, 'all_only'),\n    (125, 'S_BLOCK_CHANGE',\
  \ 'clientbound', false, 'all_only'),\n    (126, 'S_ACKNOWLEDGE_PLAYER_DIGGING', 'clientbound', false, 'all_only'),\n    (127, 'S_ACKNOWLEDGE_BLOCK_CHANGES', 'clientbound', false, 'all_only'),\n    (128,\
  \ 'S_CHANGE_GAME_STATE', 'clientbound', false, 'all_only'),\n    (129, 'S_PLAYER_ABILITIES', 'clientbound', false, 'all_only'),\n    (130, 'S_SET_SLOT', 'clientbound', false, 'all_only'),\n    (131, 'S_WINDOW_ITEMS',\
  \ 'clientbound', false, 'all_only'),\n    (132, 'S_CLOSE_WINDOW', 'clientbound', false, 'all_only'),\n    (133, 'S_OPEN_WINDOW', 'clientbound', false, 'all_only'),\n    (134, 'S_UPDATE_ATTRIBUTES', 'clientbound',\
  \ false, 'all_only'),\n    (135, 'S_PLUGIN_MESSAGE', 'clientbound', false, 'all_only'),\n    (136, 'S_DISCONNECT', 'clientbound', false, 'all_only'),\n    (137, 'S_SET_PASSENGERS', 'clientbound', false,\
  \ 'all_only'),\n    (138, 'S_ATTACH_ENTITY', 'clientbound', false, 'all_only'),\n    (139, 'S_COLLECT_ITEM', 'clientbound', false, 'all_only'),\n    (140, 'S_ENTITY_MOVEMENT', 'clientbound', false, 'all_only'),\n\
  \    (141, 'S_PLAYER_ROTATION', 'clientbound', false, 'all_only'),\n    (142, 'S_MOVE_MINECART', 'clientbound', false, 'all_only'),\n    (143, 'S_BUNDLE', 'clientbound', false, 'all_only'),\n    (144,\
  \ 'S_TIME_UPDATE', 'clientbound', false, 'all_only'),\n    (145, 'S_SET_COOLDOWN', 'clientbound', false, 'all_only'),\n    (146, 'S_CHAT_PREVIEW_PACKET', 'clientbound', true, 'frame_dropped'),\n    (147,\
  \ 'S_PLAYER_CHAT_HEADER', 'clientbound', true, 'frame_dropped'),\n    (148, 'S_TAB_COMPLETE', 'clientbound', true, 'frame_dropped'),\n    (149, 'S_DECLARE_COMMANDS', 'clientbound', true, 'frame_dropped'),\n\
  \    (150, 'S_CHAT_MESSAGE', 'clientbound', true, 'frame_dropped'),\n    (151, 'S_SYSTEM_CHAT_MESSAGE', 'clientbound', true, 'frame_dropped'),\n    (152, 'S_DELETE_CHAT', 'clientbound', true, 'frame_dropped'),\n\
  \    (153, 'S_DISGUISED_CHAT', 'clientbound', true, 'frame_dropped'),\n    (154, 'S_DISPLAY_CHAT_PREVIEW', 'clientbound', true, 'frame_dropped'),\n    (155, 'S_CUSTOM_CHAT_COMPLETIONS', 'clientbound',\
  \ true, 'frame_dropped'),\n    (156, 'S_SERVER_DATA', 'clientbound', true, 'frame_dropped'),\n    (157, 'S_PLAYER_INFO', 'clientbound', true, 'frame_dropped'),\n    (158, 'S_PLAYER_INFO_UPDATE', 'clientbound',\
  \ true, 'frame_dropped'),\n    (159, 'S_PLAYER_INFO_REMOVE', 'clientbound', true, 'frame_dropped'),\n    (160, 'S_SPAWN_PLAYER', 'clientbound', false, 'all_only'),\n    (200, 'CFG_C_CLIENT_SETTINGS',\
  \ 'serverbound', false, 'all_only'),\n    (201, 'CFG_C_PLUGIN_MESSAGE', 'serverbound', false, 'all_only'),\n    (202, 'CFG_C_CONFIGURATION_END_ACK', 'serverbound', false, 'all_only'),\n    (203, 'CFG_C_KEEP_ALIVE',\
  \ 'serverbound', false, 'all_only'),\n    (204, 'CFG_C_PONG', 'serverbound', false, 'all_only'),\n    (205, 'CFG_C_RESOURCE_PACK_STATUS', 'serverbound', false, 'all_only'),\n    (206, 'CFG_C_SELECT_KNOWN_PACKS',\
  \ 'serverbound', false, 'all_only'),\n    (220, 'CFG_S_PLUGIN_MESSAGE', 'clientbound', false, 'all_only'),\n    (221, 'CFG_S_DISCONNECT', 'clientbound', false, 'all_only'),\n    (222, 'CFG_S_CONFIGURATION_END',\
  \ 'clientbound', false, 'all_only'),\n    (223, 'CFG_S_KEEP_ALIVE', 'clientbound', false, 'all_only'),\n    (224, 'CFG_S_PING', 'clientbound', false, 'all_only'),\n    (225, 'CFG_S_REGISTRY_DATA', 'clientbound',\
  \ false, 'all_only'),\n    (226, 'CFG_S_UPDATE_TAGS', 'clientbound', false, 'all_only'),\n    (227, 'CFG_S_SELECT_KNOWN_PACKS', 'clientbound', false, 'all_only'),\n    (228, 'CFG_S_RESET_CHAT', 'clientbound',\
  \ true, 'frame_dropped')\n)\nSELECT\n  r.date,\n  substr(to_hex(r.session_id), 1, 12) AS session,\n  r.packet_type,\n  COALESCE(v.name, 'UNKNOWN_' || CAST(r.packet_type AS varchar)) AS packet_name,\n\
  \  v.name IS NOT NULL AS in_vocabulary,\n  CASE r.direction WHEN 1 THEN 'serverbound' WHEN 2 THEN 'clientbound' ELSE 'unspecified' END AS direction_label,\n  CASE r.state WHEN 1 THEN 'handshaking' WHEN\
  \ 2 THEN 'status' WHEN 3 THEN 'login'\n    WHEN 4 THEN 'configuration' WHEN 5 THEN 'play' ELSE 'unknown' END AS state_label,\n  COALESCE(v.private, false) AS private,\n  COALESCE(v.payload_policy, 'unknown')\
  \ AS payload_policy,\n  r.payload_original_size,\n  CAST(floor(r.offset_nanos / 60e9) AS bigint) AS session_minute\nFROM corvus.capture.raw AS r\nLEFT JOIN vocabulary AS v ON v.id = r.packet_type\nWHERE\
  \ r.date >= {{ lo }} AND r.date <= {{ hi }}\n\n"
