  \   (156, 'S_SERVER_DATA', 'clientbound', true, 'frame_dropped'),\n    (157, 'S_PLAYER_INFO',\
  \ 'clientbound', true, 'frame_dropped'),\n    (158, 'S_PLAYER_INFO_UPDATE', 'clientbound',\
  \ true, 'frame_dropped'),\n    (159, 'S_PLAYER_INFO_REMOVE', 'clientbound', true,\
  \ 'frame_dropped'),\n    (160, 'S_SPAWN_PLAYER', 'clientbound', false, 'all_only'),\n\
  \    (200, 'CFG_C_CLIENT_SETTINGS', 'serverbound', false, 'all_only'),\n    (201,\
  \ 'CFG_C_PLUGIN_MESSAGE', 'serverbound', false, 'all_only'),\n    (202, 'CFG_C_CONFIGURATION_END_ACK',\
  \ 'serverbound', false, 'all_only'),\n    (203, 'CFG_C_KEEP_ALIVE', 'serverbound',\
  \ false, 'all_only'),\n    (204, 'CFG_C_PONG', 'serverbound', false, 'all_only'),\n\
  \    (205, 'CFG_C_RESOURCE_PACK_STATUS', 'serverbound', false, 'all_only'),\n  \
  \  (206, 'CFG_C_SELECT_KNOWN_PACKS', 'serverbound', false, 'all_only'),\n    (220,\
  \ 'CFG_S_PLUGIN_MESSAGE', 'clientbound', false, 'all_only'),\n    (221, 'CFG_S_DISCONNECT',\
  \ 'clientbound', false, 'all_only'),\n    (222, 'CFG_S_CONFIGURATION_END', 'clientbound',\
  \ false, 'all_only'),\n    (223, 'CFG_S_KEEP_ALIVE', 'clientbound', false, 'all_only'),\n\
  \    (224, 'CFG_S_PING', 'clientbound', false, 'all_only'),\n    (225, 'CFG_S_REGISTRY_DATA',\
  \ 'clientbound', false, 'all_only'),\n    (226, 'CFG_S_UPDATE_TAGS', 'clientbound',\
  \ false, 'all_only'),\n    (227, 'CFG_S_SELECT_KNOWN_PACKS', 'clientbound', false,\
  \ 'all_only'),\n    (228, 'CFG_S_RESET_CHAT', 'clientbound', true, 'frame_dropped')\n\
  ),\nframes AS (\n  SELECT e.date, e.session_id, e.segment, e.seq, e.offset_nanos,\
  \ e.direction, e.packet_type\n  FROM corvus.capture.events AS e\n),\nlagged AS (\n\
  \  SELECT *, LAG(seq) OVER (PARTITION BY session_id, segment ORDER BY seq) AS prev_seq\n\
  \  FROM frames\n)\nSELECT\n  l.date,\n  substr(to_hex(l.session_id), 1, 12) AS session,\n\
  \  l.segment,\n  l.seq,\n  l.offset_nanos / 1e9 AS offset_s,\n  l.packet_type,\n\
  \  COALESCE(v.name, 'UNKNOWN_' || CAST(l.packet_type AS varchar)) AS packet_name,\n\
  \  CAST(v.name IS NULL AS integer) AS unknown,\n  CASE l.direction WHEN 1 THEN 'serverbound'\
  \ WHEN 2 THEN 'clientbound' ELSE 'unspecified' END AS direction_label,\n  CAST(CASE\
  \ WHEN l.prev_seq IS NULL THEN 0 WHEN l.seq - l.prev_seq > 1 THEN 1 ELSE 0 END AS\
  \ integer) AS seq_gap,\n  CAST(r.seq IS NOT NULL AS integer) AS has_payload,\n \
  \ r.protocol_version,\n  CAST(COALESCE(r.payload_original_size > length(r.payload),\
  \ false) AS integer) AS truncated\nFROM lagged AS l\nLEFT JOIN vocabulary AS v ON\
  \ v.id = l.packet_type\nLEFT JOIN corvus.capture.raw AS r\n  ON r.session_id = l.session_id\
  \ AND r.segment = l.segment AND r.seq = l.seq\n"
