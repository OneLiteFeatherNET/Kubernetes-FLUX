# Superset (operator pods, label app.kubernetes.io/name=superset): web UI reachable from the internal
# Gateway only; egress limited to DNS, Trino (8080), Polaris (8181), RGW S3 (80), CloudNativePG (5432) and HTTPS for Entra ID login
# and the driver install at pod start. The operator's own policy is not used (see superset.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: superset
  namespace: data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: superset
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy
      ports:
        - protocol: TCP
          port: 8088
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trino
              app.kubernetes.io/instance: trino
      ports:
        - protocol: TCP
          port: 8080
    # DuckDB: Polaris REST catalog and the RGW S3 endpoint.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: polaris
              app.kubernetes.io/instance: polaris
      ports:
        - protocol: TCP
          port: 8181
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rook-ceph-fr01
          podSelector:
            matchLabels:
              app: rook-ceph-rgw
              rook_object_store: feather-s3
      ports:
        - protocol: TCP
          port: 80
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
