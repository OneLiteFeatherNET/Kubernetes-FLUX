apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polaris
  namespace: data
  labels:
    # Stateful, schema-migrating release: retries only, no automatic rollback.
    flux.onelitefeather.dev/remediation: retries-only
spec:
  releaseName: polaris
  chart:
    spec:
      chart: polaris
      version: "=1.9.0"
      sourceRef:
        kind: HelmRepository
        name: polaris
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: warn
    ignore:
      # The documented rollout-restart workflow (CLAUDE.md) mutates this.
      - paths: ["/spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt"]
  interval: 1m0s
  values: {}
