apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trino
  namespace: data
spec:
  releaseName: trino
  chart:
    spec:
      chart: trino
      version: "=1.45.0"
      sourceRef:
        kind: HelmRepository
        name: trino
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  interval: 10m
