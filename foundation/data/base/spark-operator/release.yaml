apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spark-kubernetes-operator
  labels:
    flux.onelitefeather.dev/remediation: retries-only
  namespace: spark-system
spec:
  releaseName: spark-kubernetes-operator
  chart:
    spec:
      chart: spark-kubernetes-operator
      version: "=1.9.0"
      sourceRef:
        kind: HelmRepository
        name: spark-kubernetes-operator
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: warn
  interval: 10m0s
  values: {}
