apiVersion: v1
kind: Namespace
metadata:
  # Privileged on purpose: kube-bench needs hostPID and read access to
  # /etc/kubernetes. Only the kube-bench CronJobs run in this namespace.
  name: kube-bench
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
