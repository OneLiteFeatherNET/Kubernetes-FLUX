# Audit only: results land in PolicyReport objects, requests are never denied.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pod-security-baseline
  annotations:
    policies.kyverno.io/title: Pod Security Baseline (audit)
    policies.kyverno.io/category: Pod Security Standards
    policies.kyverno.io/description: >-
      Pod Security Standards baseline profile, reported in audit mode.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: baseline
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
                - kyverno
      validate:
        failureAction: Audit
        message: "Pod violates the Pod Security Standards baseline profile."
        podSecurity:
          level: baseline
          version: latest
