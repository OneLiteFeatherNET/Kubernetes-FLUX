# Audit only: results land in PolicyReport objects, requests are never denied.
# Same rule as the olf-require-memory-resources ValidatingAdmissionPolicy,
# kept as a second opinion in the reports.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-memory-resources
  annotations:
    policies.kyverno.io/title: Require memory requests and limits (audit)
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      Every container needs a memory request and a memory limit.
spec:
  # Fail open: a CEL evaluation error must never block a request.
  failurePolicy: Ignore
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - flux-system
            - kyverno
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - daemonsets
        - replicasets
        - jobs
        - cronjobs
  validationActions:
    - Audit
  variables:
    - name: containers
      expression: "object.spec.containers + object.spec.?initContainers.orValue([])"
  validations:
    - expression: >-
        variables.containers.all(c,
          c.?resources.?requests.?memory.orValue('') != '' &&
          c.?resources.?limits.?memory.orValue('') != '')
      message: "Every container needs a memory request and a memory limit."
