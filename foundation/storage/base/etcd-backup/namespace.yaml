# Baseline enforced: the snapshot pod is restricted-compliant anyway; warn/audit
# at restricted show any drift. No privileged pod is admitted here.
apiVersion: v1
kind: Namespace
metadata:
  name: etcd-backup
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
