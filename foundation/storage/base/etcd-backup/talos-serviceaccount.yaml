# Talos issues a client certificate for this ServiceAccount: a Secret of the same name
# with the talosconfig under key `config`. The role may only run etcd snapshots.
# Requires the Talos machine config to allow os:etcd:backup for namespace etcd-backup.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-snapshot
spec:
  roles:
    - os:etcd:backup
