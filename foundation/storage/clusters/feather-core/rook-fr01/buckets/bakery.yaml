apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: bakery
  namespace: rook-ceph-fr01
spec:
  bucketName: bakery
  storageClassName: ceph-bucket-fr01
  additionalConfig:
    # External party: the bucket must be owned by the `bakery` user itself,
    # otherwise its own access key gets 403 on every request.
    bucketOwner: bakery
