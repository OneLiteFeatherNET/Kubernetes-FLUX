apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: velero
  namespace: rook-ceph-fr01
spec:
  bucketName: velero
  storageClassName: ceph-bucket-fr01
  additionalConfig:
    # Without an explicit owner, Rook 1.20 answers named users 403 AccessDenied.
    bucketOwner: velero
