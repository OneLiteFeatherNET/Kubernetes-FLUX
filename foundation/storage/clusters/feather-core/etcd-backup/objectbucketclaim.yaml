apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: etcd-snapshots
  namespace: etcd-backup
spec:
  bucketName: etcd-snapshots
  storageClassName: ceph-bucket-fr01
  additionalConfig:
    # Without an explicit owner, Rook 1.20 answers named users 403 AccessDenied.
    bucketOwner: etcd-backup
