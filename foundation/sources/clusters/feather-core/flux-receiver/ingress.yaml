# Public GitHub webhook intake. Only /hook/ is routed; the Receiver's HMAC check is the auth.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-receiver-cloudflare-tunnel
  namespace: flux-system
  annotations:
    cloudflare-tunnel-ingress-controller.strrl.dev/backend-protocol: http
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: flux-hook.onelitefeather.net
      http:
        paths:
          - path: /hook/
            pathType: Prefix
            backend:
              service:
                name: webhook-receiver
                port:
                  number: 80
