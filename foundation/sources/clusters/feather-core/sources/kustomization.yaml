apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - mariadb-operator.yml
  - mongodb.yml
  - cnpg.yml
  - helmcharts.yml
  - node-red.yml
  - reposilite.yml
  - strrl.yml
  - smallstep.yml
  - jetstack.yml
  - kyverno.yaml
  - spegel.yaml
  - harbor.yml
  - dependency-track.yml
  - dirsigler.yml
  - envoy.yaml
  - prometheus-stack.yaml
  - grafana.yml
  - rook.yaml
  - ceph-csi-operator.yaml
  - n8n.yml
  - ollama.yml
  - descheduler.yml
  - aquasecurity.yml
  - apus.yaml
  - penpot.yaml
  - strimzi.yaml
  - nats.yaml
  - sentry-kubernetes.yaml
  - sturnus.yaml
  - menura.yaml
  - menura-prototype.yaml
  - corvus.yaml
  - pmint93.yml
  - stelaris-ui.yaml
  - stelaris-image-automation.yaml
  - ingot-image-automation.yaml
  - vulpes-backend.yaml
  - vulpes-backend-image-automation.yaml
  - blackhole.yaml
  - vulpes-generator.yaml
  - vulpes-generator-image-automation.yaml
  - cilium.yaml
  - jellyfin.yaml
  - app-template.yaml
  - opencost.yaml
  - telepresence.yaml
  - gha-runner-scale-set-controller.yaml

# The OCIRepositories above pull from the private onelitefeather Harbor project,
# so flux-system needs the same pull credential the workloads use.
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: harbor-pull
    type: kubernetes.io/dockerconfigjson
    files:
      - .dockerconfigjson=harbor.onelitefeather.dev.dockerconfigjson.sops.json
