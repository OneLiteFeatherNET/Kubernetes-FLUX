---
# Apus ships its charts as OCI artifacts from our own Harbor, versioned together with
# the images they deploy: apus-operator 0.8.0 references apus/operator:0.8.0, because the
# chart leaves image.tag empty and falls back to .Chart.AppVersion. Pin both repositories
# to the same version for that reason -- mixing them defeats the coupling.
#
# 0.7.0 brought two things the platform overlay depends on: the dashboard split into a
# tenant application and a separate management console (apus/console, served under
# /console), and NUXT_PUBLIC_OIDC_SCOPE, without which neither can obtain a token Entra
# will let through to the API.
#
# 0.8.0 adds per-tenant options with override and lock: Tenant.spec.policy, which the operator
# chart ships as a CRD change. The api module enforces four keys (source types, poll floor,
# keepVersions cap, forced renders) and reports every other entry as stored-but-not-enforced.
# Upgrading the operator chart before the platform chart is not required -- an older api simply
# ignores the field -- but keeping the pins equal keeps the coupling the comment above describes.
#
# 0.9.1 is the floor now, and 0.9.0 must not be reinstated. The 0.9.0 api image does not
# start at all: TenantGroupIndexLoader declared @Scheduled(fixedDelay = "60s"), a spelling
# Micronaut's converter rejects, so the context failed during start() and the single api
# replica went into CrashLoopBackOff, taking the whole API with it. The 0.9.0 operator starts,
# but cannot read Rook's own CephObjectStoreUser -- its status model knew only `phase` while
# Rook had added `info` -- so every tenant reconciliation failed and no tenant ever got the
# application instance 0.9.0 exists to provision. Both are fixed in 0.9.1, which also adds a
# build step that boots the shipped jar, because nothing in the test suite could see the first
# failure.
#
# 0.9.0 brings the last two pieces of the per-tenant work. The operator now provisions one
# instance of the tenant application per tenant -- a Deployment, Service and Ingress in the
# tenant's own namespace, serving https://<host>/t/<tenant>/ -- guarded by tenantUi.host, which
# is empty by default so the feature stays off until it is configured below. And the api module
# gains the directory: teams, invitations, password resets and impersonation, plus
# Tenant.spec.identity.groupId, which is what finally lets a signed-in user resolve to a tenant
# at all (the `organization` claim it used to read was never emitted by the app registration).
#
# 0.7.2 is what makes any of it usable, and is the floor for this cluster. The API named
# the JWKS endpoint `jwks-uri` in application.yml, a property Micronaut does not bind
# (JwksSignatureConfigurationProperties has setUrl and no setJwksUri). The bean existed
# with a null URL, so no fetch was ever attempted, nothing was logged above DEBUG, and
# every authenticated request was answered 401 for any broker. Do not roll back past this.
# 0.7.1 was an attempt at the same symptom from a wrong diagnosis and does not fix it.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: apus-operator
  namespace: flux-system
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://harbor.onelitefeather.dev/apus/charts/apus-operator
  ref:
    semver: "=0.9.1"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: apus-platform
  namespace: flux-system
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  url: oci://harbor.onelitefeather.dev/apus/charts/apus-platform
  ref:
    semver: "=0.9.1"
