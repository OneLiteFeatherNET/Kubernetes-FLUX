# Prototype of the Grus control plane (products/grus/clusters/feather-core/grus-dev).
# Remove together with that release once the prototype is done.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: grus
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/OneLiteFeatherNET/grus.git
  # Pinned to one commit of the Grus repository, never a moving branch. The commit also
  # carries the CRDs (deploy/crds, applied by grus-dev-crds). Bump it through a pull
  # request. The image tag in grus-dev/release.yaml stays at the prototype tag until
  # images are built for this commit.
  ref:
    commit: 7055f78123030e85e6af83c4222519e6efaff4db
