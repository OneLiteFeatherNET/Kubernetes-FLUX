# Grus control plane (v2 build) (products/grus/clusters/feather-core/grus-dev).
# Remove together with that release once the prototype is done.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: grus
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/OneLiteFeatherNET/grus.git
  # Pinned to one commit of the Grus repository, never a moving branch. The commit also
  # carries the CRDs (deploy/crds, applied by grus-dev-crds). Bump it through a pull
  # request. The image tags in grus-dev/release.yaml move together with it.
  ref:
    commit: 82a3d5acab6709de0de49e86510970708171ce34
