apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  labels:
    # Adopts the release installed by hand: no central rollback defaults, no uninstall.
    flux.onelitefeather.dev/remediation: manual
  namespace: kube-system
spec:
  releaseName: cilium
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: cilium
      version: "=1.20.4"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  # Cilium creates its CRDs at runtime; the chart ships none.
  install:
    crds: Skip
    remediation:
      retries: 0
  upgrade:
    crds: Skip
    remediation:
      retries: 0
      remediateLastFailure: false
  interval: 1m0s
  values: {}
