apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  releaseName: metallb
  chart:
    spec:
      chart: metallb
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: warn
    ignore:
      # The documented rollout-restart workflow (CLAUDE.md) mutates this.
      - paths: ["/spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt"]
  interval: 1m0s
  # Default values
  #
  values: {}
