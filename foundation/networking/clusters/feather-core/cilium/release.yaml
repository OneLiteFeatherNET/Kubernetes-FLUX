apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  values:
    # Cilium as CNI and kube-proxy replacement. MetalLB keeps BGP; policies audit-only.
    kubeProxyReplacement: true
    # Explicit, not implied by kubeProxyReplacement.
    socketLB:
      enabled: true
    nodePort:
      enabled: true
    hostPort:
      enabled: true
    sessionAffinity: true
    k8sServiceHost: localhost
    k8sServicePort: 7445
    ipam:
      mode: kubernetes
    ipv4:
      enabled: true
    ipv6:
      enabled: true
    routingMode: tunnel
    tunnelProtocol: vxlan
    MTU: 1500
    devices: [ens18]
    bpf:
      masquerade: false
      hostLegacyRouting: true
    enableIPv4Masquerade: true
    # Never masquerade pod-to-pod (also while Flannel still carries cross-node traffic).
    ipv4NativeRoutingCIDR: 10.244.0.0/16
    ipv6NativeRoutingCIDR: fd83:4192:3b5e:1500::/56
    enableIPv6Masquerade: true
    loadBalancer:
      mode: snat
    # BGP for LoadBalancer IPs, handed over from MetalLB node by node (label bgp.onelite.feather/speaker=cilium).
    bgpControlPlane:
      enabled: true
      # Same ORIGIN as MetalLB (INCOMPLETE) so mixed MetalLB/Cilium nodes stay equal-cost on the router.
      legacyOriginAttribute:
        enabled: true
    # Cilium LB-IPAM assigns LoadBalancer IPs (pinned per Service via lbipam.cilium.io/ips).
    defaultLBServiceIPAM: lbipam
    policyEnforcementMode: default
    policyAuditMode: true
    cni:
      exclusive: true
      customConf: false
      uninstall: false
    operator:
      replicas: 2
      unmanagedPodWatcher:
        restart: false
    securityContext:
      capabilities:
        ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
