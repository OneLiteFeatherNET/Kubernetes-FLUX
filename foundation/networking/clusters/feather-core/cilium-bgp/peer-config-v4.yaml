apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: mkgfire-v4
spec:
  transport:
    peerPort: 179
  # Same timers and graceful restart as the former MetalLB sessions.
  timers:
    holdTimeSeconds: 180
    keepAliveTimeSeconds: 60
  gracefulRestart:
    enabled: true
    restartTimeSeconds: 120
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          bgp.onelite.feather/advertise: lb-ips
