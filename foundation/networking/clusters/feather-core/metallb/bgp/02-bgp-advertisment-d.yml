apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: local
  namespace: metallb-system
spec:
  ipAddressPools:
  - lb-dc06
  # One announcing site per VIP: the same VIP from two sites routes replies asymmetrically.
  peers:
  - fr01-peer
  - fr01-peer-v6
  nodeSelectors:
  - matchLabels:
      topology.kubernetes.io/zone: "fr01"
  # Per family. Both are host routes, no aggregation on either side.
  aggregationLength: 32
  aggregationLengthV6: 128
  localPref: 100
  communities: []
