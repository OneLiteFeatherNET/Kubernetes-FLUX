apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: penpot
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ../../../../../apps/base/penpot/
  - ingress.yaml
patches:
  - path: release.yaml

secretGenerator:
  # Must carry the same password as the CNPG role-penpot secret.
  - name: penpot-db
    envs:
      - penpot-db.sops.env
  # One complete URI under redis-uri, pointing at Dragonfly DB 13.
  - name: penpot-redis
    envs:
      - penpot-redis.sops.env
  # Rook-minted keys, copied from rook-ceph-object-user-feather-s3-penpot
  # (namespace rook-ceph-fr01). Re-copy them if that CephObjectStoreUser is
  # ever recreated — see docs/penpot-mcp.md.
  - name: penpot-s3
    envs:
      - penpot-s3.sops.env
  # api-secret-key backs persistent user sessions; changing it logs everyone
  # out, so keep it stable.
  - name: penpot-core
    envs:
      - penpot-core.sops.env
  # Client id and secret of the "Penpot" Entra app registration. The secret
  # expires two years after it was issued — see docs/penpot-oidc.md for the
  # rotation steps.
  - name: penpot-oidc
    envs:
      - penpot-oidc.sops.env
