apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ../../../../../apps/base/filebrowser/
  - httproute.yaml
patches:
  - path: release.yaml

secretGenerator:
  # Vollstaendige Quantum-Konfiguration inklusive OIDC-Client-Secret der
  # Entra-App-Registrierung "FileBrowser". Das Secret laeuft ab — siehe Runbook.
  - name: filebrowser-config
    files:
      - config.yaml=filebrowser-config.sops.yaml
