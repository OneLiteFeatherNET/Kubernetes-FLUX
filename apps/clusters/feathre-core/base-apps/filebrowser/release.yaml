apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: filebrowser
  namespace: media
spec:
  values:
    controllers:
      filebrowser:
        type: deployment
        replicas: 1
        strategy: Recreate
        pod:
          priorityClassName: feather-standard
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            # Ohne dies chownt das kubelet bei jedem Start rekursiv die ganze Bibliothek.
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          labels:
            logs.onelitefeather.net/env: prod
        containers:
          app:
            image:
              repository: ghcr.io/gtsteffaniak/filebrowser
              tag: 1.5.6-stable
            env:
              # Getrennt vom Datenverzeichnis, damit das PVC die Datei nicht verdeckt.
              FILEBROWSER_CONFIG: /etc/filebrowser/config.yaml
              TZ: Europe/Berlin
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 15
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 15
    service:
      app:
        controller: filebrowser
        ports:
          http:
            port: 8080
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-rbd-fr01
        globalMounts:
          - path: /home/filebrowser/data
      config:
        type: secret
        name: filebrowser-config
        globalMounts:
          - path: /etc/filebrowser
            readOnly: true
      library:
        type: persistentVolumeClaim
        existingClaim: media-library
        globalMounts:
          - path: /srv
