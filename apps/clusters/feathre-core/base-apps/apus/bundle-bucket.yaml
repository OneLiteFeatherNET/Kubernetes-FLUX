---
# Deliberately NOT in rook-ceph-fr01 like the other claims: Rook creates the
# credentials secret in the namespace of the claim, and the operator reads it
# from its own.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: apus-bundles
  namespace: apus-system
spec:
  bucketName: apus-bundles
  storageClassName: ceph-bucket-fr01
  additionalConfig:
    bucketOwner: apus
