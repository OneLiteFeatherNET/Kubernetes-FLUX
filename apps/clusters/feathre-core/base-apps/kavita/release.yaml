apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kavita
  namespace: media
spec:
  values:
    controllers:
      kavita:
        type: deployment
        replicas: 1
        strategy: Recreate
        pod:
          priorityClassName: feather-standard
          automountServiceAccountToken: false
          # Kavita läuft als root und /kavita gehört root; runAsNonRoot
          # würde den Start verhindern. Namespace steht auf baseline.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          labels:
            logs.onelitefeather.net/env: prod
        containers:
          app:
            image:
              repository: docker.io/jvmilazz0/kavita
              tag: "0.9.1"
            env:
              TZ: Europe/Berlin
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: kavita
        ports:
          http:
            port: 5000
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ceph-rbd-fr01
        globalMounts:
          - path: /kavita/config
      library:
        type: persistentVolumeClaim
        existingClaim: media-library
        globalMounts:
          - path: /books
            subPath: books
            readOnly: true
