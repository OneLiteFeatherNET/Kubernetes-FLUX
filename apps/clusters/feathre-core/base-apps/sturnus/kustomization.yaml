apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sturnus
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ../../../../../apps/base/sturnus/
  - ingress.yaml
patches:
  - path: release.yaml

# The chart references this Secret by name through `existingSecret` and hands
# each component only the keys its own settings class reads, so a key missing
# here stops that one pod at CreateContainerConfigError rather than starting
# it with an empty value.
secretGenerator:
  - name: sturnus-secrets
    envs:
      - sturnus-secrets.sops.env
  # The `onelitefeather` Harbor project is private, so pulling needs
  # credentials. Same shared robot the other apps in that project use --
  # otis, otis-dev, vulpes-backend and vulpes-backend-dev all reference this
  # identical file; the `+otis` in its name is where it was first created,
  # not what it is scoped to.
  - name: harbor-pull
    type: kubernetes.io/dockerconfigjson
    files:
      - .dockerconfigjson=harbor.onelitefeather.dev.dockerconfigjson.sops.json
