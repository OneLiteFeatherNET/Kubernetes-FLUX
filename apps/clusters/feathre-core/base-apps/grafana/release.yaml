apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: grafana
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: feather-high
  valuesFrom:
    - kind: Secret
      name: grafana-admin
      valuesKey: adminUser
      targetPath: adminUser
    - kind: Secret
      name: grafana-admin
      valuesKey: adminPassword
      targetPath: adminPassword
    - kind: Secret
      name: grafana-discord
      valuesKey: webhookUrl
      targetPath: alerting.contactpoints\.yaml.secret.contactPoints[0].receivers[0].settings.url
    - kind: Secret
      name: grafana-discord
      valuesKey: webhookUrl
      targetPath: alerting.contactpoints\.yaml.secret.contactPoints[1].receivers[0].settings.url
  values:
    podLabels:
      logs.onelitefeather.net/env: prod
    replicas: 2
    headlessService: true
    useStatefulSet: false
    serviceMonitor:
      enabled: true
    podDisruptionBudget:
      minAvailable: 1
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: topology.kubernetes.io/region
                  operator: In
                  values:
                    - fr-rosenau
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
            app.kubernetes.io/instance: grafana
    persistence:
      enabled: false
    ingress:
      enabled: false
    env:
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: feather-core-cluster-pg-pooler-rw.cnpg-system.svc.cluster.local:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_SSL_MODE: disable
    envValueFrom:
      POD_IP:
        fieldRef:
          apiVersion: v1
          fieldPath: status.podIP
      GF_DATABASE_USER:
        secretKeyRef:
          name: grafana-postgresql
          key: username
      GF_DATABASE_PASSWORD:
        secretKeyRef:
          name: grafana-postgresql
          key: password
    # Keys in grafana-azuread are already named like the env vars, so the whole
    # secret is injected; rotating it needs `kubectl rollout restart` (stable name).
    envFromSecret: grafana-azuread
    grafana.ini:
      server:
        domain: grafana.apps.onelite.feather
        root_url: https://grafana.apps.onelite.feather
      auth:
        disable_login_form: false
      auth.azuread:
        name: Entra ID
        enabled: true
        allow_sign_up: true
        auto_login: false
        client_authentication: client_secret_post
        client_id: $__env{GF_AUTH_AZUREAD_CLIENT_ID}
        client_secret: $__env{GF_AUTH_AZUREAD_CLIENT_SECRET}
        scopes: openid email profile
        auth_url: https://login.microsoftonline.com/$__env{GF_AUTH_AZUREAD_TENANT_ID}/oauth2/v2.0/authorize
        token_url: https://login.microsoftonline.com/$__env{GF_AUTH_AZUREAD_TENANT_ID}/oauth2/v2.0/token
        # allowed_organizations takes tenant IDs (tid claim); allowed_tenants is not a real key.
        allowed_organizations: $__env{GF_AUTH_AZUREAD_TENANT_ID}
        allowed_groups: 29c2994c-95ad-4fb5-af6d-015866f151bc 171f6cc7-644d-457a-85ea-397b9eb70eb1 82f559e3-e191-46e1-a920-a860b906c69e
        # org_mapping only grants None|Viewer|Editor|Admin, so server admin stays on the local account.
        org_mapping: 29c2994c-95ad-4fb5-af6d-015866f151bc:1:Admin 171f6cc7-644d-457a-85ea-397b9eb70eb1:1:Editor 82f559e3-e191-46e1-a920-a860b906c69e:1:Viewer
        use_pkce: true
      unified_alerting:
        enabled: true
        ha_peers: grafana-headless:9094
        ha_listen_address: $${POD_IP}:9094
        ha_advertise_address: $${POD_IP}:9094
        rule_version_record_limit: "5"
      alerting:
        enabled: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Mimir
            uid: mimir
            type: prometheus
            access: proxy
            url: http://mimir-gateway.grafana.svc.cluster.local/prometheus
            isDefault: true
            editable: false
            jsonData:
              httpMethod: POST
              timeInterval: 30s
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki-gateway.grafana.svc.cluster.local
            editable: false
            jsonData:
              maxLines: 1000
              derivedFields:
                - datasourceUid: tempo
                  matcherRegex: '"trace_id":"(\w+)"'
                  name: TraceID
                  url: "$${__value.raw}"
          - name: Tempo
            uid: tempo
            type: tempo
            access: proxy
            url: http://tempo-gateway.grafana.svc.cluster.local
            editable: false
            jsonData:
              tracesToLogsV2:
                datasourceUid: loki
                spanStartTimeShift: "-1h"
                spanEndTimeShift: "1h"
                filterByTraceID: false
                filterBySpanID: false
              tracesToMetrics:
                datasourceUid: mimir
                spanStartTimeShift: "-1h"
                spanEndTimeShift: "1h"
              serviceMap:
                datasourceUid: mimir
              nodeGraph:
                enabled: true
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        # Every provider here still serves remote (gnetId/url) dashboards only;
        # its inline ones moved to sidecar ConfigMaps (see dashboards/ next to
        # this file). disableDeletion: true is what makes that move safe: Grafana
        # would otherwise delete the dashboard record once the file disappears
        # and the sidecar would recreate it under a new id, losing the version
        # history; with the flag the record is merely unprovisioned, so the
        # sidecar adopts the existing one by uid.
        providers:
          - name: kubernetes
            orgId: 1
            folder: Kubernetes
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: controllers
            orgId: 1
            folder: Controllers
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/controllers
          - name: observability
            orgId: 1
            folder: Observability
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/observability
          - name: databases
            orgId: 1
            folder: Databases
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/databases
          # applications provider dropped: harbor was its only dashboard and now
          # comes from a sidecar ConfigMap, so the provider had no files left and
          # would only log a missing-directory error.
          - name: storage
            orgId: 1
            folder: Storage
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/storage
    # Collects ConfigMaps labelled grafana_dashboard=1 into one extra file
    # provider, which runs *alongside* the dashboardProviders above. Every
    # dashboard this repo maintains itself now comes from here (see dashboards/
    # next to this file); the providers above are left with remote gnetId/url
    # dashboards, which the chart's initContainer downloads.
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      dashboards:
        enabled: true
        label: grafana_dashboard
        # ALL, not the default own-namespace: spegel-dashboard is in kube-system.
        searchNamespace:
          - ALL
        # Only ConfigMaps carry dashboards here; avoids watching every Secret
        # cluster-wide (RBAC still grants both, the chart hardcodes that).
        resource: configmap
        # Annotation -> subdirectory, and foldersFromFilesStructure turns those
        # subdirectories into Grafana folders, reusing an existing folder of the
        # same title -- that is what keeps the moved dashboards in place.
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
          # The sidecar populates /tmp/dashboards only after it has started, so
          # Grafana's first provisioning pass sees an empty folder. Without this
          # it deletes every sidecar dashboard and they stay gone until the
          # sidecar's reload call (~2min on 2026-08-13); unprovisioning instead
          # keeps them visible. Trade-off: a removed ConfigMap leaves its
          # dashboard behind as an unmanaged one.
          disableDelete: true
    dashboards:
      kubernetes:
        # kubernetes-dashboard (gnetId 22523) removed: it never worked. It
        # pinned revision 2, which does not exist (the API lists only
        # revision 1), so the download 404'd and left a 0-byte file that
        # Grafana rejected with a permanent error=EOF. Bumping to revision 1
        # is not the fix either -- that revision carries uid
        # k8s_views_global, which a manually imported, non-provisioned
        # dashboard already holds, and provisioning adopts an occupied uid
        # instead of erroring, so it would silently overwrite and rename it.
        kubernetes-cluster:
          gnetId: 7249
          revision: 1
          datasource: Mimir
        persistent-volumes:
          gnetId: 15600
          revision: 1
          datasource: Mimir
        node-exporter-full:
          gnetId: 1860
          revision: 41
          datasource: Mimir
      controllers:
        # ingress-nginx dashboard removed: the component was replaced by
        # Envoy Gateway a while back, confirmed 100% dead (zero samples for
        # any nginx_ingress_controller_* metric over 7 days, only stale
        # TSDB label-index metadata remained).
        cert-manager:
          gnetId: 20340
          revision: 1
          datasource:
            - name: DS_PROMETHEUS
              value: Mimir
        cloudflare-tunnel:
          gnetId: 24874
          revision: 1
          datasource:
            - name: DS_PROMETHEUS
              value: Mimir
        envoy-gateway-overview:
          gnetId: 24460
          revision: 1
          datasource: Mimir
        # envoy-proxy (legacy community dashboard, gnetId 21329) removed:
        # built for classic per-upstream-host Envoy clusters, conceptually
        # mismatched with Envoy Gateway's per-route cluster model (no
        # "host" label exists, "Live servers" stat flatlined at 0 despite
        # real traffic). envoy-gateway-overview above already covers this
        # deployment correctly.
      observability:
        # prometheus-overview (legacy community dashboard, gnetId 3662)
        # removed: fully orphaned since metrics scraping migrated from
        # kube-prometheus-stack's Prometheus to clustered Alloy -- no
        # Prometheus server process exists in this cluster anymore, and
        # several referenced metrics are pre-2.0-era names removed from
        # Prometheus/Mimir entirely.
        loki-metrics:
          gnetId: 17781
          revision: 1
          datasource: Mimir
      databases:
        cloudnative-pg:
          url: https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/refs/heads/main/charts/cluster/grafana-dashboard.json
          # Plain "datasource: Mimir" left the DS_PROMETHEUS input pinned to
          # the dead legacy "Prometheus" datasource (same failure mode this
          # dashboard shares with several gnetId imports) -- the list form,
          # naming the input explicitly, is what actually substitutes it
          # (matches the working cert-manager gnetId 20340 entry below).
          datasource:
            - name: DS_PROMETHEUS
              value: Mimir
        mariadb-galera:
          gnetId: 13106
          revision: 1
          datasource: Mimir
        # redis-exporter (gnetId 14091) removed: queried redis_exporter-
        # style redis_* metric names, which nothing in this cluster ever
        # produced (confirmed dead since the bitnami Redis -> Dragonfly
        # migration -- no redis_up sample in 21+ days). Replaced with the
        # official dragonfly-operator dashboard, matched against the
        # dragonfly_* metrics the new PodMonitor actually scrapes; it now lives
        # in dashboards/databases/dragonfly.json.
      storage:
        ceph-pools:
          gnetId: 5342
          revision: 9
          datasource: Mimir
    alerting:
      contactpoints.yaml:
        secret:
          apiVersion: 1
          contactPoints:
            # type: webhook, not discord - only webhook supports settings.payload.template (Grafana 12.0+).
            # settings.url stays at this exact YAML position so the Flux valuesFrom targetPath keeps resolving.
            # No username in the payload, so Discord uses the name configured on the webhook itself.
            - orgId: 1
              name: discord
              receivers:
                - uid: discord_webhook
                  type: webhook
                  settings:
                    url: "placeholder-overwritten-by-valuesFrom"
                    httpMethod: POST
                    payload:
                      template: '{{ `{{ template "discord.payload" . }}` }}'
            # Fault-tolerant path for the meta alarms: Grafana default rendering, deliberately
            # tied to no template, so a template error cannot take this receiver down with it.
            # Same Discord channel.
            - orgId: 1
              name: discord-fallback
              receivers:
                - uid: discord_fallback
                  type: discord
                  settings:
                    url: "placeholder-overwritten-by-valuesFrom"
                    use_discord_username: true
      templates.yaml:
        apiVersion: 1
        templates:
          # Static annotations come from (index .Alerts 0) and must never be templated per-$labels in
          # a rule; per-instance values come from index $a.Labels (Labels, never templated annotations):
          # after a restart warmStateCache hands back the RAW annotation template (grafana#114973,
          # fixed in 12.4.x), while instance labels survive correctly.
          # Three escaping layers (Helm raw string -> chart toYaml/tpl -> Go template): the effective
          # template must contain no backtick (use "\u0060" - Helm ignores \u in a raw string, Go
          # string literals do not), no single quote (toYaml may single-quote a scalar), and no line
          # may end in whitespace.
          # The payload is built via coll.Dict/coll.Slice and serialized by data.ToJSON (= json.Marshal),
          # never concatenated, so no value can break the JSON. Every printf precision is a Discord
          # limit guard; the 12-instance cap follows from field.value <= 1024 (worst case 71 runes/line
          # x 12 + 38 = 890). printf counts runes. No arithmetic is available (no sprig, no math.Sub).
          - name: discord.title
            template: '{{ `{{ define "discord.title" }}` }}{{ `{{ if eq .Status "firing" }}` }}{{ `{{ if eq (index .CommonLabels "severity") "warning" }}` }}🟠{{ `{{ else }}` }}🔴{{ `{{ end }}` }} FIRING{{ `{{ if gt (len .Alerts.Firing) 1 }}` }} ({{ `{{ len .Alerts.Firing }}` }}x){{ `{{ end }}` }}{{ `{{ else }}` }}✅ RESOLVED{{ `{{ if gt (len .Alerts.Resolved) 1 }}` }} ({{ `{{ len .Alerts.Resolved }}` }}x){{ `{{ end }}` }}{{ `{{ end }}` }} · {{ `{{ index .CommonLabels "alertname" }}` }}{{ `{{ end }}` }}'
          # Must open with "{{ define", never "{{- define": Grafana validates with \{\{\s*define, so a
          # trim marker makes it wrap the body in a SECOND define and provisioning crashes the pod.
          # The embed url is only set when absolute: Grafana's own test alert yields a bare "?orgId=1"
          # (no GeneratorURL base), and Discord rejects an embed with a relative url with HTTP 400.
          - name: discord.payload
            template: |
              {{ `{{ define "discord.payload" -}}` }}
              {{ `{{- $f := index .Alerts 0 -}}` }}
              {{ `{{- $ok := $f.Annotations.object_key -}}` }}
              {{ `{{- $lk := $f.Annotations.location_key -}}` }}
              {{ `{{- $loc := or (and $lk (index .CommonLabels $lk)) $f.Annotations.location -}}` }}
              {{ `{{- $sev := index $f.Labels "severity" -}}` }}
              {{ `{{- $bt := "\u0060" -}}` }}
              {{ `{{- $color := 15548997 -}}{{- if eq .Status "resolved" -}}{{- $color = 5763719 -}}{{- else if eq $sev "warning" -}}{{- $color = 16426522 -}}{{- end -}}` }}
              {{ `{{- $ts := $f.StartsAt -}}{{- if and (eq .Status "resolved") (not $f.EndsAt.IsZero) -}}{{- $ts = $f.EndsAt -}}{{- end -}}` }}
              {{ `{{- $desc := or $f.Annotations.problem $f.Annotations.summary "(no description)" -}}` }}
              {{ `{{- if $f.Annotations.dashboard_url -}}{{- $desc = printf "%s\n\n[📊 Open dashboard](<%s>)" $desc $f.Annotations.dashboard_url -}}{{- end -}}` }}
              {{ `{{- $fields := coll.Slice -}}` }}
              {{ `{{- if $sev -}}{{- $fields = coll.Append (coll.Dict "name" "Severity" "value" $sev "inline" true) $fields -}}{{- end -}}` }}
              {{ `{{- if $loc -}}{{- $fields = coll.Append (coll.Dict "name" "Location" "value" (printf "%.60s" $loc) "inline" true) $fields -}}{{- end -}}` }}
              {{ `{{- if eq .Status "firing" -}}{{- $fields = coll.Append (coll.Dict "name" "Since" "value" (printf "<t:%d:R>" $f.StartsAt.Unix) "inline" true) $fields -}}{{- else -}}{{- $fields = coll.Append (coll.Dict "name" "Resolved" "value" (printf "<t:%d:t> (<t:%d:R>)" $ts.Unix $ts.Unix) "inline" true) $fields -}}{{- end -}}` }}
              {{ `{{- if and $f.Annotations.object_label $ok -}}` }}
              {{ `{{- $lines := "" -}}` }}
              {{ `{{- range $i, $a := .Alerts -}}{{- if lt $i 12 -}}` }}
              {{ `{{- $o := index $a.Labels $ok -}}{{- if not $o -}}{{- $o = "?" -}}{{- end -}}` }}
              {{ `{{- $line := printf "%s%.60s%s" $bt $o $bt -}}` }}
              {{ `{{- if and (not $loc) $lk -}}{{- $line = printf "%s%-27.26s%s %.30s" $bt $o $bt (index $a.Labels $lk) -}}{{- end -}}` }}
              {{ `{{- if eq $a.Status "resolved" -}}{{- $line = printf "%s  (resolved)" $line -}}{{- end -}}` }}
              {{ `{{- if eq $i 0 -}}{{- $lines = $line -}}{{- else -}}{{- $lines = printf "%s\n%s" $lines $line -}}{{- end -}}` }}
              {{ `{{- end -}}{{- end -}}` }}
              {{ `{{- if gt (len .Alerts) 12 -}}{{- $lines = printf "%s\n… hidden (%d total)" $lines (len .Alerts) -}}{{- end -}}` }}
              {{ `{{- $label := $f.Annotations.object_label -}}{{- if gt (len .Alerts) 1 -}}{{- $label = printf "%s (%d)" $label (len .Alerts) -}}{{- end -}}` }}
              {{ `{{- $fields = coll.Append (coll.Dict "name" (printf "%.100s" $label) "value" (printf "%.1024s" $lines) "inline" false) $fields -}}` }}
              {{ `{{- else if gt (len .Alerts) 1 -}}{{- $fields = coll.Append (coll.Dict "name" "Affected" "value" (printf "%d instances" (len .Alerts)) "inline" true) $fields -}}{{- end -}}` }}
              {{ `{{- if $f.Annotations.check_command -}}{{- $fields = coll.Append (coll.Dict "name" "Check" "value" (printf "%.900s" (printf "%s%s%s" $bt $f.Annotations.check_command $bt)) "inline" false) $fields -}}{{- end -}}` }}
              {{ `{{- $url := "" -}}{{- if match "^https?://" $f.GeneratorURL -}}{{- $url = $f.GeneratorURL -}}{{- else if match "^https?://" .ExternalURL -}}{{- $url = .ExternalURL -}}{{- end -}}` }}
              {{ `{{- $title := printf "%.200s" (tmpl.Exec "discord.title" .) -}}` }}
              {{ `{{- $desc = printf "%.1000s" $desc -}}` }}
              {{ `{{- $tss := date "2006-01-02T15:04:05Z07:00" $ts -}}` }}
              {{ `{{- $footer := coll.Dict "text" (printf "%.100s" (or (index $f.Labels "grafana_folder") "Grafana")) -}}` }}
              {{ `{{- $embed := coll.Dict "title" $title "color" $color "description" $desc "timestamp" $tss "fields" $fields "footer" $footer -}}` }}
              {{ `{{- if $url -}}{{- $embed = coll.Dict "title" $title "url" $url "color" $color "description" $desc "timestamp" $tss "fields" $fields "footer" $footer -}}{{- end -}}` }}
              {{ `{{- data.ToJSON (coll.Dict "embeds" (coll.Slice $embed)) }}` }}
              {{ `{{- end -}}` }}
          # Unused while the webhook payload template overrides title/message; kept as a rollback
          # target (type: discord restores it as-is). Delete once the embeds are a week green.
          - name: discord.message
            template: |
              {{ `{{ define "discord.message" }}{{ $f := index .Alerts 0 }}{{ $ok := $f.Annotations.object_key }}{{ $lk := $f.Annotations.location_key }}{{ $loc := or (and $lk (index .CommonLabels $lk)) .CommonAnnotations.location }}{{ $age := reReplaceAll "^(([0-9]+h)?([0-9]+m)?).*$" "$1" (printf "%s" (time.Now.Sub $f.StartsAt)) }}` }}```
              {{ `{{ printf "%-12s" "Problem" }}{{ if $f.Annotations.problem }}{{ $f.Annotations.problem }}{{ else }}{{ $f.Annotations.summary }}{{ end }}` }}
              {{ `{{ if $f.Labels.severity }}{{ printf "%-12s" "Schwere" }}{{ $f.Labels.severity }}` }}
              {{ `{{ end }}{{ if eq .Status "firing" }}{{ printf "%-12s" "Seit" }}{{ date "15:04" (tz "Europe/Berlin" $f.StartsAt) }} Uhr  ({{ if $age }}{{ $age }}{{ else }}<1m{{ end }})` }}
              {{ `{{ else if not $f.EndsAt.IsZero }}{{ printf "%-12s" "Behoben" }}{{ date "15:04" (tz "Europe/Berlin" $f.EndsAt) }} Uhr` }}
              {{ `{{ end }}{{ if gt (len .Alerts) 1 }}{{ printf "%-12s" "Betroffen" }}{{ if gt (len .Alerts.Firing) 0 }}{{ len .Alerts.Firing }} aktiv{{ if gt (len .Alerts.Resolved) 0 }}, {{ end }}{{ end }}{{ if gt (len .Alerts.Resolved) 0 }}{{ len .Alerts.Resolved }} behoben{{ end }}` }}
              {{ `{{ end }}{{ if $loc }}{{ printf "%-12s" "Ort" }}{{ $loc }}` }}
              {{ `{{ end }}{{ if and $f.Annotations.object_label $ok }}────────────────────────────────────────────` }}
              {{ `{{ range $i, $a := .Alerts }}{{ if lt $i 8 }}{{ if eq $i 0 }}{{ printf "%-12s" $f.Annotations.object_label }}{{ else }}{{ printf "%-12s" "" }}{{ end }}{{ $o := index $a.Labels $ok }}{{ if $loc }}{{ $o }}{{ else if $lk }}{{ printf "%-27.26s" $o }}{{ index $a.Labels $lk }}{{ else }}{{ $o }}{{ end }}{{ if eq $a.Status "resolved" }}  (behoben){{ end }}` }}
              {{ `{{ end }}{{ end }}{{ if gt (len .Alerts) 8 }}{{ printf "%-12s" "" }}… weitere ausgeblendet ({{ len .Alerts }} insgesamt)` }}
              {{ `{{ end }}{{ end }}{{ if $f.Annotations.check_command }}────────────────────────────────────────────` }}
              {{ `{{ printf "%-12s" "Prüfen" }}{{ $f.Annotations.check_command }}` }}
              {{ `{{ end }}` }}```
              {{ `🔗 [Regel](<{{ $f.GeneratorURL }}>){{ if $f.Annotations.dashboard_url }}  ·  📊 [Dashboard](<{{ $f.Annotations.dashboard_url }}>){{ end }}{{ end }}` }}
      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: discord
            # Do NOT change: discord.message assumes one group == the instances of exactly one rule.
            group_by: ['alertname']
            # A full evaluation period, so all instances of a rule land in ONE message.
            group_wait: 1m
            # Membership churn is fixed at the source, so no routing damping is needed here; 5m
            # halves both the RESOLVED delay and the wait for a newly added object.
            group_interval: 5m
            # A repeat carries no new information; two people, no on-call rotation.
            repeat_interval: 24h
            # The meta alarm must not travel the path it reports as broken, so it goes to the
            # fault-tolerant discord contact point. Everything else falls through to discord.
            # Prometheus-style matchers, NOT object_matchers: the chart re-serializes values with
            # toYaml, which emits the "=" of an object_matchers triple as a bare scalar that YAML
            # then resolves to the special value tag instead of the string "=".
            routes:
              - receiver: discord-fallback
                matchers:
                  - alertname = "Alert notifications failing"
      rules.yaml:
        apiVersion: 1
        groups:
          - orgId: 1
            name: core_services
            folder: Core Services
            interval: 60s
            rules:
              - uid: flux-core-layer-not-ready
                title: Flux core layer not ready
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 1200
                      to: 0
                    datasourceUid: mimir
                    model:
                      editorMode: code
                      # Sustain check lives in PromQL instead of `for:`, so short reconcile blips never
                      # fire; aggregating to exactly 2 labels is a hard requirement of the Discord template.
                      expr: min_over_time((max by (exported_namespace, name) (gotk_resource_info{customresource_kind="Kustomization", ready!="True"}) or max by (exported_namespace, name) (gotk_resource_info{customresource_kind="Kustomization"}) * 0)[15m:1m])
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
