                  location: "cnpg-system"
                  check_command: "kubectl -n cnpg-system exec feather-core-cluster-pg-1 -- psql -Atc \"select datname,count(*) from pg_stat_activity group by 1 order by 2 desc\""
                  dashboard_url: "https://grafana.apps.onelite.feather/d/cloudnative-pg"
                labels:
                  severity: critical
              - uid: mariadb-galera-cluster-degraded
                title: MariaDB Galera cluster degraded
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: mimir
                    model:
                      editorMode: code
                      expr: min(mysql_global_status_wsrep_cluster_size{namespace="mariadb-galera"})
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: '-100'
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 3
                            type: lt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: B
                      type: threshold
                noDataState: Alerting
                execErrState: Alerting
                # In 28 days wsrep_cluster_size was below 3 for 7 minutes total, in exactly one
                # episode >=2m and none >=5m - so 2m paged monthly for a rolling restart.
                for: 5m
                annotations:
                  # min() across all 3 nodes' own view of cluster size - a node that loses
                  # connectivity to its peers (e.g. the Flannel host-gw/MTU incident) reports a
                  # smaller cluster size on its own, so this catches split-brain, not just a
                  # fully-down node.
                  summary: "MariaDB Galera cluster size has dropped below 3 - the cluster is degraded or split-brained."
                  problem: "Galera cluster below 3 nodes"
                  location: "mariadb-galera"
                  check_command: "kubectl -n mariadb-galera exec mariadb-galera-0 -- mariadb -e \"show status like 'wsrep_cluster%'\""
                  dashboard_url: "https://grafana.apps.onelite.feather/d/pXgz0qFGk/galera-mariadb-overview"
                labels:
                  severity: critical
          - orgId: 1
            name: cluster_health
            folder: Core Services
            interval: 60s
            rules:
              - uid: pods-stuck-terminating
                title: Pods stuck in Terminating
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: mimir
                    model:
                      editorMode: code
                      # "OR vector(0)" always yields a series, so the noDataState path is unreachable here.
                      expr: count(time() - kube_pod_deletion_timestamp > 900) OR vector(0)
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: '-100'
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 0
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: B
                      type: threshold
                noDataState: OK
                execErrState: Alerting
                for: 5m
                annotations:
                  summary: "One or more pods have been stuck in Terminating for over 15 minutes. Matches the containerd shim task.Delete hang on SIGKILL teardown seen before."
                  problem: "Pods stuck in Terminating"
                  check_command: "kubectl get pods -A | grep Terminating"
                labels:
                  severity: warning
          - orgId: 1
            name: observability
            folder: Observability
            interval: 60s
            rules:
              - uid: observability-pipeline-no-data
                title: Observability pipeline producing no data
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: mimir
                    model:
                      editorMode: code
                      # count() returns a real value (currently 10, one per kubelet target) when
                      # the pipeline is healthy - evaluated normally against the threshold below,
                      # not firing. If every kubelet target vanishes from Mimir (the whole Alloy
                      # remote-write pipeline going dark), this query returns NO series, which
                      # triggers Grafana's NoData path -> noDataState: Alerting -> fires. Do NOT
                      # use absent() here: it returns empty exactly when healthy (the opposite of
                      # what noDataState: Alerting needs), which was a real bug (empty result +
                      # noDataState: Alerting fired immediately on a healthy cluster).
                      expr: count(up{job="kubelet", metrics_path="/metrics"})
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: '-100'
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 1
                            type: lt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: B
                      type: threshold
                noDataState: Alerting
                execErrState: Alerting
                for: 5m
                annotations:
                  summary: "No kubelet metrics are reaching Mimir at all - the Alloy scrape/remote-write pipeline is likely down. Every other alert in this cluster depends on this pipeline and will read as falsely healthy while this fires."
                  problem: "No kubelet metrics in Mimir"
                  location: "grafana"
                  check_command: "kubectl -n grafana get pods -l app.kubernetes.io/name=alloy-metrics"
                labels:
                  severity: critical
              - uid: kube-state-metrics-down
                title: kube-state-metrics producing no data
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: mimir
                    model:
                      editorMode: code
                      # Same count()/NoData pattern as observability-pipeline-no-data above, not
                      # absent(): absent() is empty while healthy, which reads as NoData forever.
                      expr: count(up{job="kube-state-metrics"})
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: '-100'
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 1
                            type: lt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: B
                      type: threshold
                noDataState: Alerting
                execErrState: Alerting
                for: 5m
                annotations:
                  # No dashboard_url: the Kubernetes Objects dashboard is built from the same
                  # metrics, so it is empty exactly while this alert fires.
                  summary: "kube-state-metrics has stopped producing metrics. Both Flux alerts read gotk_resource_info from it, so they report healthy while blind for as long as this fires."
                  problem: "No kube-state-metrics data"
                  location: "monitoring"
                  check_command: "kubectl -n monitoring get pods -l app.kubernetes.io/name=kube-state-metrics"
                labels:
                  severity: critical
              - uid: alert-notifications-failing
                title: Alert notifications failing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: mimir
                    model:
                      editorMode: code
                      # Both counters are registered WithSkipZeroValueMetrics, so they do not exist
                      # at all until they were once >0 - a bare sum() would read as NoData instead
                      # of 0. Hence "or vector(0)" per counter. Both are summed because the webhook
                      # notifier failure path may bump either one.
                      expr: (sum(increase(grafana_alerting_notification_requests_failed_total[10m])) or vector(0)) + (sum(increase(grafana_alerting_notifications_failed_total[10m])) or vector(0))
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: '-100'
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 0
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: B
                      type: threshold
                # "or vector(0)" always yields a value while Mimir is reachable, so NoData here only
                # means the datasource itself is down - already covered by observability-pipeline-no-data,
                # and firing this rule on it would falsely claim notifications are broken.
                noDataState: OK
                execErrState: Alerting
                for: 5m
                annotations:
                  summary: "Grafana failed to deliver alert notifications, so Discord messages are being dropped - the webhook notifier does not retry. Alerts themselves keep evaluating and stay visible in the Grafana alerting UI, so use it as the source of truth until this clears."
                  problem: "Discord delivery failing"
                  location: "grafana"
                  check_command: "kubectl -n grafana logs -l app.kubernetes.io/name=grafana --tail=200 | grep -i \"Notify for alerts failed\""
                labels:
                  severity: critical
          - orgId: 1
            name: node_health
            folder: Core Services
            interval: 60s
            rules:
              - uid: node-not-ready
                title: Node not Ready
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: mimir
                    model:
                      editorMode: code
                      # kube_node_status_condition carries all 3 statuses for every
                      # condition (150 series = 10 nodes x 5 conditions x 3 statuses),
                      # so this always has data -> noDataState: OK is correct.
                      # status="false" is NotReady, status="unknown" is Unreachable
                      # (kubelet stopped reporting) - both are pages, one rule.
                      # Do NOT write `{status="true"} == 0`: the filtered value is 0,
                      # so a `gt 0` threshold would never fire.
                      expr: max by (node) (kube_node_status_condition{condition="Ready", status=~"false|unknown"})
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: '-100'
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 0
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: B
                      type: threshold
                noDataState: OK
                execErrState: Alerting
                for: 5m
                annotations:
                  summary: "Node {{ `{{ $labels.node }}` }} is NotReady or Unreachable."
                  problem: "Node NotReady/Unreachable"
                  object_label: "Node"
                  object_key: "node"
                  check_command: "kubectl get nodes -o wide"
                labels:
                  severity: critical
              - uid: kubelet-down
                title: Kubelet down
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: mimir
                    model:
                      editorMode: code
                      # min by (node) keeps a real 0/1 value per node instead of
                      # filtering healthy nodes out of the result, so the series
                      # never disappears while the scrape pipeline is alive. Total
                      # pipeline loss is already covered by observability-pipeline-no-data.
                      expr: min by (node) (up{job="kubelet", metrics_path="/metrics"})
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: '-100'
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 1
                            type: lt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: B
                      type: threshold
                noDataState: OK
                execErrState: Alerting
                for: 5m
                annotations:
                  summary: "Kubelet on node {{ `{{ $labels.node }}` }} is not being scraped - the node is down, the kubelet is dead, or its serving cert expired."
                  problem: "Kubelet not being scraped"
                  object_label: "Node"
                  object_key: "node"
                  check_command: "kubectl get nodes -o wide"
                labels:
                  severity: critical
              - uid: node-clock-unsynchronised
                title: Node clock not synchronised
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: mimir
                    model:
                      editorMode: code
                      # machine.time.servers is /dev/ptp0 only (talos repo:
                      # clusters/feather-core/talos/patches/common/time-ptp.yaml) and
                      # Talos makes PTP and NTP mutually exclusive - there is NO NTP
                      # fallback. A live-migration onto a host without ptp_kvm leaves
                      # the clock free-running silently. node-exporter series carry
                      # instance (IP:9100), not node.
                      expr: min by (instance) (node_timex_sync_status)
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: '-100'
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 1
                            type: lt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: B
                      type: threshold
                noDataState: OK
                execErrState: Alerting
                for: 15m
                annotations:
                  summary: "Clock on {{ `{{ $labels.instance }}` }} is not synchronised - /dev/ptp0 is the only time source and there is no NTP fallback."
                  problem: "Clock not synchronised"
                  object_label: "Node"
                  object_key: "instance"
                  check_command: "talosctl -n <node> time"
                labels:
                  severity: warning
              - uid: node-clock-offset-high
                title: Node clock offset high
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: mimir
                    model:
                      editorMode: code
                      # Current cluster-wide max is 5.7 microseconds; 50ms is ~4
                      # orders of magnitude above that and well below the point
                      # where Galera/etcd/TLS start misbehaving.
                      expr: max by (instance) (abs(node_timex_offset_seconds))
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: '-100'
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 0.05
                            type: gt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: B
                      type: threshold
                noDataState: OK
                execErrState: Alerting
                for: 15m
                annotations:
                  summary: "Clock offset on {{ `{{ $labels.instance }}` }} exceeds 50ms. Galera certification, etcd leases and TLS validity all assume a tight cluster clock."
                  problem: "Clock offset over 50 ms"
                  object_label: "Node"
                  object_key: "instance"
                  check_command: "talosctl -n <node> time"
                labels:
                  severity: warning
          - orgId: 1
            name: certificates
            folder: Core Services
            interval: 60s
            rules:
              - uid: certificate-expiring-soon
                title: Certificate expiring within 14 days
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: mimir
                    model:
                      editorMode: code
                      # cert-manager's own metric. The certificate's namespace is in
                      # exported_namespace (namespace= is cert-manager, where the
                      # controller runs). Lowest value across the 20 series today is
                      # ~72.7 days, so this will not fire on merge.
                      # noDataState MUST stay OK: if a Certificate is deleted its
                      # series vanishes, and "no certs" is not an emergency.
                      expr: min by (exported_namespace, name) ((certmanager_certificate_expiration_timestamp_seconds - time()) / 86400)
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: '-100'
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 14
                            type: lt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: B
                      type: threshold
                noDataState: OK
                execErrState: Alerting
                for: 1h
                annotations:
                  summary: "Certificate {{ `{{ $labels.name }}` }} in namespace {{ `{{ $labels.exported_namespace }}` }} expires in under 14 days and has not renewed."
                  problem: "Certificate expires in <14 days"
                  object_label: "Certificate"
                  object_key: "name"
                  location_key: "exported_namespace"
                  check_command: "kubectl get certificate -A | grep -v True"
                labels:
                  severity: warning
              - uid: certificate-expiring-critical
                title: Certificate expiring within 3 days
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: mimir
                    model:
                      editorMode: code
                      expr: min by (exported_namespace, name) ((certmanager_certificate_expiration_timestamp_seconds - time()) / 86400)
                      instant: true
                      intervalMs: 1000
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: '-100'
                    model:
                      conditions:
                        - evaluator:
                            params:
                              - 3
                            type: lt
                          operator:
                            type: and
                          query:
                            params:
                              - B
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: B
                      type: threshold
                noDataState: OK
                execErrState: Alerting
                for: 15m
                annotations:
                  summary: "Certificate {{ `{{ $labels.name }}` }} in namespace {{ `{{ $labels.exported_namespace }}` }} expires in under 3 days. Renewal has failed."
                  problem: "Certificate expires in <3 days"
                  object_label: "Certificate"
                  object_key: "name"
                  location_key: "exported_namespace"
                  check_command: "kubectl get certificate -A | grep -v True"
                labels:
                  severity: critical
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi
