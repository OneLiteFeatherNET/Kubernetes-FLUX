apiVersion: 1
groups:
  - orgId: 1
    name: core_services
    folder: Core Services
    interval: 60s
    rules:
      - uid: flux-core-layer-not-ready
        title: Flux core layer not ready
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Sustain check lives in PromQL instead of `for:`, so short reconcile blips never
              # fire; aggregating to exactly 2 labels is a hard requirement of the Discord template.
              expr: min_over_time((max by (exported_namespace, name) (gotk_resource_info{customresource_kind="Kustomization", ready!="True"}) or max by (exported_namespace, name) (gotk_resource_info{customresource_kind="Kustomization"}) * 0)[15m:1m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        keepFiringFor: 15m
        annotations:
          summary: "Flux Kustomization {{ $labels.name }} (namespace {{ $labels.exported_namespace }}) has not been Ready for 15 minutes."
          problem: "Kustomization not Ready for >15 min"
          object_label: "Layer"
          object_key: "name"
          location_key: "exported_namespace"
          check_command: "flux get kustomization -A"
          dashboard_url: "https://grafana.apps.onelite.feather/d/flux-control-plane"
        labels:
          severity: critical
      - uid: core-infra-helmrelease-not-ready
        title: Core infrastructure HelmRelease not ready
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1200
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Dropped metallb/dragonfly (never existed in 90d retention), added 9 real infra
              # releases; descheduler stays out on purpose (optimiser, not a dependency).
              expr: min_over_time((max by (exported_namespace, name) (gotk_resource_info{customresource_kind="HelmRelease", ready!="True", name=~"alloy-logs|alloy-metrics|alloy-receiver|ceph-csi-drivers|cert-manager|cloudflare-tunnel-ingress-controller|cnpg|envoy|grafana|kube-prometheus-stack|loki|mariadb-operator|mariadb-operator-crds|mimir|rook-ceph|spegel|step-ca|step-issuer|tempo"}) or max by (exported_namespace, name) (gotk_resource_info{customresource_kind="HelmRelease", name=~"alloy-logs|alloy-metrics|alloy-receiver|ceph-csi-drivers|cert-manager|cloudflare-tunnel-ingress-controller|cnpg|envoy|grafana|kube-prometheus-stack|loki|mariadb-operator|mariadb-operator-crds|mimir|rook-ceph|spegel|step-ca|step-issuer|tempo"}) * 0)[15m:1m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        keepFiringFor: 15m
        annotations:
          summary: "Flux HelmRelease {{ $labels.name }} (namespace {{ $labels.exported_namespace }}) has not been Ready for 15 minutes."
          problem: "HelmRelease not Ready for >15 min"
          object_label: "Release"
          object_key: "name"
          location_key: "exported_namespace"
          check_command: "flux get helmrelease -A"
          dashboard_url: "https://grafana.apps.onelite.feather/d/flux-control-plane"
        labels:
          severity: critical
  - orgId: 1
    name: backups
    folder: Backups
    interval: 60s
    rules:
      - uid: cnpg-backup-stale
        title: CNPG backup stale
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # cnpg_collector_last_available_backup_timestamp never updates for
              # plugin-based (barman-cloud) backups -- confirmed live it stays
              # stuck at 0 even after real completed backups. cnpg_backup_stopped_at_seconds
              # (kube-state-metrics customResourceState reading the Backup CR itself)
              # is the metric that actually reflects reality.
              expr: (time() - max(cnpg_backup_stopped_at_seconds{cluster="feather-core-cluster-pg", phase="completed"})) / 3600
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 24
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "No successful CloudNativePG (Postgres) backup in over 24h."
          problem: "No backup for over 24 h"
          location: "cnpg-system"
          check_command: "kubectl -n cnpg-system get backups.postgresql.cnpg.io"
          dashboard_url: "https://grafana.apps.onelite.feather/d/cloudnative-pg"
        labels:
          severity: warning
      - uid: cnpg-backup-failing
        title: CNPG backup failing
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Same dead-metric issue as cnpg-backup-stale: the legacy
              # cnpg_collector_last_failed_backup_timestamp metric never fires
              # for plugin-based backups. Failed backups never get a stoppedAt
              # (only completed ones do), so use createdAt instead: any Backup
              # CR that entered phase=failed within the staleness window (24h).
              expr: count(cnpg_backup_created_at_seconds{cluster="feather-core-cluster-pg", phase="failed"} > (time() - 86400)) OR vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "CloudNativePG's most recent backup attempt failed (a failure timestamp is newer than the last successful one)."
          problem: "Backup attempt failed"
          location: "cnpg-system"
          check_command: "kubectl -n cnpg-system get backups.postgresql.cnpg.io"
          dashboard_url: "https://grafana.apps.onelite.feather/d/cloudnative-pg"
        labels:
          severity: warning
      - uid: mariadb-galera-backup-job-failed
        title: MariaDB Galera backup job failed
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              expr: sum(kube_job_status_failed{namespace="mariadb-galera"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          # No dashboard_url: the mariadb-galera dashboard (gnetId 13106) covers
          # cluster health, not backup jobs, so it wouldn't add useful context here.
          summary: "The mariadb-galera-backup CronJob's most recent Job run failed."
          problem: "Backup CronJob failed"
          location: "mariadb-galera"
          check_command: "kubectl -n mariadb-galera get jobs"
        labels:
          severity: warning
  - orgId: 1
    name: storage
    folder: Storage
    interval: 60s
    rules:
      - uid: mariadb-galera-pvc-usage-high
        title: MariaDB Galera PVC usage high
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Aggregating to (persistentvolumeclaim, node) is what the Discord template needs and keeps a pod reschedule (new instance label) from spawning a second alert instance.
              expr: max by (persistentvolumeclaim, node) (kubelet_volume_stats_used_bytes{namespace="mariadb-galera", persistentvolumeclaim=~"storage-mariadb-galera-.*"} / kubelet_volume_stats_capacity_bytes{namespace="mariadb-galera", persistentvolumeclaim=~"storage-mariadb-galera-.*"}) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "MariaDB Galera PVC {{ $labels.persistentvolumeclaim }} on node {{ $labels.node }} is above 80% capacity."
          problem: "PVC over 80 % full"
          object_label: "PVC"
          object_key: "persistentvolumeclaim"
          location_key: "node"
          check_command: "kubectl -n mariadb-galera get pvc"
          dashboard_url: "https://grafana.apps.onelite.feather/d/pXgz0qFGk/galera-mariadb-overview"
        labels:
          severity: warning
      - uid: mariadb-galera-pvc-usage-critical
        title: MariaDB Galera PVC almost full
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              expr: max by (persistentvolumeclaim, node) (kubelet_volume_stats_used_bytes{namespace="mariadb-galera", persistentvolumeclaim=~"storage-mariadb-galera-.*"} / kubelet_volume_stats_capacity_bytes{namespace="mariadb-galera", persistentvolumeclaim=~"storage-mariadb-galera-.*"}) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "MariaDB Galera PVC {{ $labels.persistentvolumeclaim }} on node {{ $labels.node }} is above 90% capacity and at risk of filling up."
          problem: "PVC over 90 % full"
          object_label: "PVC"
          object_key: "persistentvolumeclaim"
          location_key: "node"
          check_command: "kubectl -n mariadb-galera get pvc"
          dashboard_url: "https://grafana.apps.onelite.feather/d/pXgz0qFGk/galera-mariadb-overview"
        labels:
          severity: critical
      - uid: ceph-cluster-health-warning
        title: Ceph cluster health degraded
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              expr: max(ceph_health_status)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        # Only rule kept as the sentinel for "Ceph telemetry is gone": ceph_health_status was
        # present 40319/40321 min in 28 days (longest gap 1 min), so for: 10m cannot blip-fire.
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "Ceph cluster health is not HEALTH_OK (HEALTH_WARN or worse)."
          problem: "Ceph not HEALTH_OK"
          location: "rook-ceph-fr01"
          check_command: "kubectl -n rook-ceph-fr01 exec deploy/rook-ceph-tools -- ceph health detail"
          dashboard_url: "https://grafana.apps.onelite.feather/d/tbO9LAiZK/ceph-cluster"
        labels:
          severity: warning
      - uid: ceph-cluster-health-critical
        title: Ceph cluster health critical
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              expr: max(ceph_health_status)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Ceph cluster health is HEALTH_ERR."
          problem: "Ceph HEALTH_ERR"
          location: "rook-ceph-fr01"
          check_command: "kubectl -n rook-ceph-fr01 exec deploy/rook-ceph-tools -- ceph health detail"
          dashboard_url: "https://grafana.apps.onelite.feather/d/tbO9LAiZK/ceph-cluster"
        labels:
          severity: critical
      - uid: ceph-rgw-failed-request-rate
        title: Ceph RGW failed request rate elevated
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              expr: sum(rate(ceph_rgw_failed_req[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          # Baseline observed 2026-07-18 was 0.02-0.3 req/s; a real RGW degradation
          # incident (Rook 1.20 upgrade, S3 access broken for non-owner users) would
          # show as a sustained multi-request/s error rate, not baseline noise.
          summary: "RGW failed request rate is elevated (baseline is <1/s). This is the class of failure that broke S3 access for backups/Loki/Mimir/Postgres WAL during the Rook 1.20 upgrade incident."
          problem: "RGW failure rate elevated"
          location: "rook-ceph-fr01"
          check_command: "kubectl -n rook-ceph-fr01 logs -l app=rook-ceph-rgw --tail=200"
          dashboard_url: "https://grafana.apps.onelite.feather/d/tbO9LAiZK/ceph-cluster"
        labels:
          severity: warning
      - uid: ceph-osd-usage-high
        title: Ceph OSD usage high
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Per-OSD, not cluster-aggregate: the 2026-07-26 InsufficientCapacity
              # incident had individual OSDs at 94% (backfillfull) while the cluster-wide
              # average still read 86.7% -- ceph-cluster-health-warning only fires once
              # Ceph itself declares HEALTH_WARN (nearfull/backfillfull already tripped),
              # this is the earlier leading indicator on the single most-full OSD.
              expr: max(ceph_osd_stat_bytes_used / ceph_osd_stat_bytes) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: "The most-full Ceph OSD is above 80% used. Ceph's own nearfull/backfillfull thresholds trip around here and will start rejecting large S3 uploads (InsufficientCapacity) before HEALTH_WARN fires."
          problem: "OSD over 80 % full"
          location: "rook-ceph-fr01"
          check_command: "kubectl -n rook-ceph-fr01 exec deploy/rook-ceph-tools -- ceph osd df"
          dashboard_url: "https://grafana.apps.onelite.feather/d/tbO9LAiZK/ceph-cluster"
        labels:
          severity: warning
      - uid: ceph-osd-usage-critical
        title: Ceph OSD usage critical
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              expr: max(ceph_osd_stat_bytes_used / ceph_osd_stat_bytes) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "The most-full Ceph OSD is above 90% used -- at or past Ceph's backfillfull threshold, new writes to affected pools (including S3/RGW uploads) will start being rejected."
          problem: "OSD over 90 % full"
          location: "rook-ceph-fr01"
          check_command: "kubectl -n rook-ceph-fr01 exec deploy/rook-ceph-tools -- ceph osd df"
          dashboard_url: "https://grafana.apps.onelite.feather/d/tbO9LAiZK/ceph-cluster"
        labels:
          severity: critical
  - orgId: 1
    name: databases
    folder: Databases
