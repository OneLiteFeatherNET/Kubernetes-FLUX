  - orgId: 1
    name: observability
    folder: Observability
    interval: 60s
    rules:
      - uid: observability-pipeline-no-data
        title: Observability pipeline producing no data
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Do NOT use absent() here: it returns empty when healthy, which is the
              # opposite of what noDataState: Alerting needs. count() relies on NoData.
              expr: count(up{job="kubelet", metrics_path="/metrics"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "No kubelet metrics are reaching Mimir at all - the Alloy scrape/remote-write pipeline is likely down. Every other alert in this cluster depends on this pipeline and will read as falsely healthy while this fires."
          problem: "No kubelet metrics in Mimir"
          location: "grafana"
          check_command: "kubectl -n grafana get pods -l app.kubernetes.io/name=alloy-metrics"
        labels:
          severity: critical
      - uid: kube-state-metrics-down
        title: kube-state-metrics producing no data
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Same count()/NoData pattern as observability-pipeline-no-data above, not
              # absent(): absent() is empty while healthy, which reads as NoData forever.
              expr: count(up{job="kube-state-metrics"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          # No dashboard_url: the Kubernetes Objects dashboard is built from the same
          # metrics, so it is empty exactly while this alert fires.
          summary: "kube-state-metrics has stopped producing metrics. Both Flux alerts read gotk_resource_info from it, so they report healthy while blind for as long as this fires."
          problem: "No kube-state-metrics data"
          location: "monitoring"
          check_command: "kubectl -n monitoring get pods -l app.kubernetes.io/name=kube-state-metrics"
        labels:
          severity: critical
      - uid: alert-notifications-failing
        title: Alert notifications failing
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Both counters are registered WithSkipZeroValueMetrics, so they do not exist
              # at all until they were once >0 - a bare sum() would read as NoData instead
              # of 0. Hence "or vector(0)" per counter. Both are summed because the webhook
              # notifier failure path may bump either one.
              expr: (sum(increase(grafana_alerting_notification_requests_failed_total[10m])) or vector(0)) + (sum(increase(grafana_alerting_notifications_failed_total[10m])) or vector(0))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        # "or vector(0)" always yields a value while Mimir is reachable, so NoData here only
        # means the datasource itself is down - already covered by observability-pipeline-no-data,
        # and firing this rule on it would falsely claim notifications are broken.
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Grafana failed to deliver alert notifications, so Discord messages are being dropped - the webhook notifier does not retry. Alerts themselves keep evaluating and stay visible in the Grafana alerting UI, so use it as the source of truth until this clears."
          problem: "Discord delivery failing"
          location: "grafana"
          check_command: "kubectl -n grafana logs -l app.kubernetes.io/name=grafana --tail=200 | grep -i \"Notify for alerts failed\""
        labels:
          severity: critical
      - uid: alerting-provisioning-failing
        title: Alerting provisioning failing
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              editorMode: code
              queryType: instant
              # Two signatures: the sidecar reload path (HTTP 500) and the fatal startup
              # path. sum() collapses both replicas into one message.
              expr: 'sum(count_over_time({namespace="grafana", container="grafana"} |~ "Failed to provision alerting|provisioning/alerting/reload.*status=500" [10m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        # Inverted from the metric rules: a log-based query returns NOTHING while healthy, so
        # NoData is the good case and must not fire. execErrState stays Alerting - if Loki
        # itself errors we are blind to this failure and want to hear about it.
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Grafana rejected the provisioned alerting configuration. Alerting comes from a sidecar-collected ConfigMap and is applied through the reload endpoint, so a bad file is an HTTP 500 instead of a crash: Grafana keeps serving the last configuration it accepted, and contact points, templates, notification policies and rules silently no longer match git."
          problem: "Alerting provisioning rejected"
          location: "grafana"
          check_command: "kubectl -n grafana logs -l app.kubernetes.io/name=grafana --tail=200 | grep -i \"provisioning/alerting/reload\""
        labels:
          severity: critical
  - orgId: 1
    name: node_health
    folder: Core Services
    interval: 60s
    rules:
      - uid: node-not-ready
        title: Node not Ready
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Always has data, so noDataState: OK is correct. Do NOT write
              # `{status="true"} == 0` — the filtered value is 0 and gt 0 never fires.
              expr: max by (node) (kube_node_status_condition{condition="Ready", status=~"false|unknown"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Node {{ $labels.node }} is NotReady or Unreachable."
          problem: "Node NotReady/Unreachable"
          object_label: "Node"
          object_key: "node"
          check_command: "kubectl get nodes -o wide"
        labels:
          severity: critical
      - uid: kubelet-down
        title: Kubelet down
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # min by (node) keeps a real 0/1 value per node instead of
              # filtering healthy nodes out of the result, so the series
              # never disappears while the scrape pipeline is alive. Total
              # pipeline loss is already covered by observability-pipeline-no-data.
              expr: min by (node) (up{job="kubelet", metrics_path="/metrics"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Kubelet on node {{ $labels.node }} is not being scraped - the node is down, the kubelet is dead, or its serving cert expired."
          problem: "Kubelet not being scraped"
          object_label: "Node"
          object_key: "node"
          check_command: "kubectl get nodes -o wide"
        labels:
          severity: critical
      - uid: node-clock-unsynchronised
        title: Node clock not synchronised
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # machine.time.servers is /dev/ptp0 only (talos repo:
              # clusters/feather-core/talos/patches/common/time-ptp.yaml) and
              # Talos makes PTP and NTP mutually exclusive - there is NO NTP
              # fallback. A live-migration onto a host without ptp_kvm leaves
              # the clock free-running silently. node-exporter series carry
              # instance (IP:9100), not node.
              expr: min by (instance) (node_timex_sync_status)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          summary: "Clock on {{ $labels.instance }} is not synchronised - /dev/ptp0 is the only time source and there is no NTP fallback."
          problem: "Clock not synchronised"
          object_label: "Node"
          object_key: "instance"
          check_command: "talosctl -n <node> time"
        labels:
          severity: warning
      - uid: node-clock-offset-high
        title: Node clock offset high
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # Current cluster-wide max is 5.7 microseconds; 50ms is ~4
              # orders of magnitude above that and well below the point
              # where Galera/etcd/TLS start misbehaving.
              expr: max by (instance) (abs(node_timex_offset_seconds))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          summary: "Clock offset on {{ $labels.instance }} exceeds 50ms. Galera certification, etcd leases and TLS validity all assume a tight cluster clock."
          problem: "Clock offset over 50 ms"
          object_label: "Node"
          object_key: "instance"
          check_command: "talosctl -n <node> time"
        labels:
          severity: warning
  - orgId: 1
    name: certificates
    folder: Core Services
    interval: 60s
    rules:
      - uid: certificate-expiring-soon
        title: Certificate expiring within 14 days
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              # cert-manager's own metric. The certificate's namespace is in
              # exported_namespace (namespace= is cert-manager, where the
              # controller runs). Lowest value across the 20 series today is
              # ~72.7 days, so this will not fire on merge.
              # noDataState MUST stay OK: if a Certificate is deleted its
              # series vanishes, and "no certs" is not an emergency.
              expr: min by (exported_namespace, name) ((certmanager_certificate_expiration_timestamp_seconds - time()) / 86400)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 14
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 1h
        annotations:
          summary: "Certificate {{ $labels.name }} in namespace {{ $labels.exported_namespace }} expires in under 14 days and has not renewed."
          problem: "Certificate expires in <14 days"
          object_label: "Certificate"
          object_key: "name"
          location_key: "exported_namespace"
          check_command: "kubectl get certificate -A | grep -v True"
        labels:
          severity: warning
      - uid: certificate-expiring-critical
        title: Certificate expiring within 3 days
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: mimir
            model:
              editorMode: code
              expr: min by (exported_namespace, name) ((certmanager_certificate_expiration_timestamp_seconds - time()) / 86400)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params:
                      - 3
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: '-100'
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          summary: "Certificate {{ $labels.name }} in namespace {{ $labels.exported_namespace }} expires in under 3 days. Renewal has failed."
          problem: "Certificate expires in <3 days"
          object_label: "Certificate"
          object_key: "name"
          location_key: "exported_namespace"
          check_command: "kubectl get certificate -A | grep -v True"
        labels:
          severity: critical
