apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plane
  namespace: plane
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: feather-standard
          # The chart renders RabbitMQ, Postgres (unused here), and OpenSearch as
          # StatefulSets, not Deployments, so they need their own patch target to
          # get the same priority class.
          - target:
              kind: StatefulSet
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: feather-standard
          # The image entrypoint runs celery without --concurrency and forks one
          # process per node core (32 here) regardless of cpuLimit. This pins it.
          # The chart exposes no resources for rabbitmq, leaving it BestEffort and
          # first to be evicted. No CPU limit on purpose: never throttle a broker.
          - target:
              kind: StatefulSet
              name: plane-rabbitmq-wl
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  requests:
                    cpu: 250m
                    memory: 256Mi
                  limits:
                    memory: 1Gi
          - target:
              kind: Deployment
              name: plane-worker-wl
            patch: |
              - op: replace
                path: /spec/template/spec/containers/0/command
                value: ["/bin/bash", "-c"]
              - op: add
                path: /spec/template/spec/containers/0/args
                value: ["python manage.py wait_for_db && python manage.py wait_for_migrations && celery -A plane worker -l info --concurrency=2"]
  values:
    planeVersion: v3.0.0

    ingress:
      enabled: false

    license:
      licenseDomain: tasks.onelitefeather.net

    services:
      postgres:
        local_setup: false
      redis:
        local_setup: false
      minio:
        local_setup: false
      rabbitmq:
        local_setup: true
      opensearch:
        local_setup: true

      # Requests were the chart default 50m/50Mi against 1000-2000Mi limits
      # while `kubectl top` showed 150-483Mi. Floors below are ~real usage
      # rounded up; there is no LimitRange anywhere in the cluster to correct
      # them. plane-opensearch-wl is deliberately absent — the chart already
      # sizes it correctly (500m/2Gi).
      web:
        assign_cluster_ip: true
        memoryRequest: 64Mi
        cpuRequest: 25m
      space:
        assign_cluster_ip: true
        memoryRequest: 256Mi
        cpuRequest: 50m
      admin:
        assign_cluster_ip: true
        memoryRequest: 64Mi
        cpuRequest: 25m
      api:
        assign_cluster_ip: true
        memoryRequest: 320Mi
        cpuRequest: 100m
      live:
        assign_cluster_ip: true
        memoryRequest: 256Mi
        cpuRequest: 50m
      monitor:
        memoryRequest: 64Mi
        cpuRequest: 25m

      # Same reasoning as the CE cutover: chart default (1000Mi) OOMKilled the
      # worker repeatedly under real load. Bump both async components.
      worker:
        memoryLimit: 2000Mi
        cpuLimit: "1"
        memoryRequest: 512Mi
        cpuRequest: 100m
      beatworker:
        memoryLimit: 1500Mi
        cpuLimit: 500m
        memoryRequest: 320Mi
        cpuRequest: 50m

      silo:
        enabled: true
        memoryRequest: 256Mi
        cpuRequest: 50m

      # Left disabled: without an AI provider key the migrator job hard-fails and
      # blocks the whole release from becoming Ready.

    external_secrets:
      app_env_existingSecret: plane-app-env
      doc_store_existingSecret: plane-doc-store
      live_env_existingSecret: plane-live-env
      rabbitmq_existingSecret: plane-rabbitmq
      opensearch_existingSecret: plane-opensearch
      silo_env_existingSecret: plane-silo

    env:
      # Global, not per-service — services.*.storageClass does not exist. Leaving
      # it unset renders storageClassName: "" and pins those PVCs Pending forever.
      storageClass: ceph-rbd-fr01
      docstore_bucket: plane
      cors_allowed_origins: "https://tasks.onelitefeather.net"
      default_cluster_domain: cluster.local
      web_url: "https://tasks.onelitefeather.net"
