apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plane-cloudflare-tunnel
  annotations:
    cloudflare-tunnel-ingress-controller.strrl.dev/backend-protocol: http
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: tasks.onelitefeather.net
      http:
        paths:
          # Paths are matched as UNANCHORED regexes, sorted by length, not by the
          # order below. Equal-length rules race non-deterministically — keep every
          # length distinct. Two outages came from this:
          # outline.onelitefeather.dev/doc/betriebsfallen-im-feather-core-cluster-qgL9Dgd4Ra

          # plane-space's own hashed JS/CSS bundle, e.g.
          # /spaces/assets/entry.client-*.js — must outrank the generic
          # /assets rule (both would otherwise tie at 7 chars).
          - path: /spaces/assets
            pathType: Prefix
            backend:
              service:
                name: plane-space
                port:
                  number: 3000

          # Asset upload/attachment API (plane.app.urls, mounted at /api/),
          # e.g. /api/assets/v2/workspaces/<slug>/ — must outrank the
          # generic /assets rule (both would otherwise tie at 7 chars).
          - path: /api/assets
            pathType: Prefix
            backend:
              service:
                name: plane-api
                port:
                  number: 8000

          - path: /god-mode
            pathType: Prefix
            backend:
              service:
                name: plane-admin
                port:
                  number: 3000

          - path: /spaces
            pathType: Prefix
            backend:
              service:
                name: plane-space
                port:
                  number: 3000

          # plane-web's own hashed JS/CSS bundle, e.g. /assets/auth.service-*.js
          # or /assets/api.service-*.js. Some filenames contain "/auth" or
          # "/api" as a substring (right at the /assets + filename boundary)
          # — this rule's length (7) must stay longer than /auth (5) and
          # /api (4) so it's evaluated first for those.
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: plane-web
                port:
                  number: 3000

          # Must point at plane-silo-ingress, not the chart's headless plane-silo
          # Service — a headless backend took the whole domain down once.
          - path: /silo
            pathType: Prefix
            backend:
              service:
                name: plane-silo-ingress
                port:
                  number: 3000

          - path: /live
            pathType: Prefix
            backend:
              service:
                name: plane-live
                port:
                  number: 3000

          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: plane-api
                port:
                  number: 8000

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: plane-api
                port:
                  number: 8000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: plane-web
                port:
                  number: 3000
