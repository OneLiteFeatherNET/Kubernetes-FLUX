apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sentry
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ../../../../../apps/base/sentry/
  - ingress.yaml
patches:
  - path: release.yaml
  - path: clickhouse.yaml

secretGenerator:
  # Must carry the same password as the CNPG role-sentry secret.
  - name: sentry-db
    envs:
      - sentry-db.sops.env
  # The shared Dragonfly password; Sentry selects DB 3 via externalRedis.db.
  - name: sentry-redis
    envs:
      - sentry-redis.sops.env
  # Rook-minted keys for the sentry bucket. Key names match the chart's
  # defaults (s3-access-key-id / s3-secret-access-key).
  - name: sentry-s3
    envs:
      - sentry-s3.sops.env
  # Django SECRET_KEY. Rotating it invalidates every session and signed value,
  # so keep it stable.
  - name: sentry-secret
    envs:
      - sentry-secret.sops.env
  # Password for the initial superuser. That account has to exist and work
  # BEFORE SSO is switched on -- once it is, SSO becomes the only way in.
  - name: sentry-admin
    envs:
      - sentry-admin.sops.env
  # GitHub App "onelitefeather-sentry" (app id 196299). The chart references
  # every one of these keys unconditionally once github.existingSecret is set,
  # so a partial secret would stop the pods from starting. private-key comes
  # from a file rather than the env: it is a multi-line PEM.
  - name: sentry-github
    envs:
      - sentry-github.sops.env
    files:
      - private-key=sentry-github.sops.key
  # Discord application for the Sentry integration -- a separate app from the
  # existing discordbot, since both would otherwise fight over the same
  # interactions endpoint. Same trap as sentry-github: with
  # discord.existingSecret set, the chart references all four keys
  # unconditionally.
  - name: sentry-discord
    envs:
      - sentry-discord.sops.env
  # SMTP password for system@onelitefeather.net. The chart wires this through
  # the shared `sentry.env` helper, so every component gets it -- mail is sent
  # by the workers, not the web pods.
  - name: sentry-mail
    envs:
      - sentry-mail.sops.env
