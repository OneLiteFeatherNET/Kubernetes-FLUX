apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse
  namespace: sentry
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: feather-standard
  values:
    clickhouse:
      # Upstream self-hosted Sentry runs a single ClickHouse. The chart default
      # is 3, but replication here needs Zookeeper, which this cluster does not
      # have -- three nodes without it would be three unsynchronised copies,
      # not a cluster.
      replicas: 1
      persistentVolumeClaim:
        enabled: true
        dataPersistentVolume:
          enabled: true
          accessModes:
            - ReadWriteOnce
          storageClassName: ceph-rbd-fr01
          storage: 200Gi
        logsPersistentVolume:
          enabled: true
          accessModes:
            - ReadWriteOnce
          storageClassName: ceph-rbd-fr01
          storage: 20Gi
      podLabels:
        logs.onelitefeather.net/env: prod
      resources:
        requests:
          cpu: 500m
          memory: 4Gi
        limits:
          memory: 8Gi
