apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sentry
  namespace: sentry
spec:
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: feather-standard
          - target:
              kind: StatefulSet
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: feather-standard
  values:
    # Everything stateful lives outside this release: postgres in CNPG, redis
    # in the shared Dragonfly, kafka in the Strimzi cluster, clickhouse in its
    # own release. Only memcached stays bundled -- it is stateless and tiny.
    postgresql:
      enabled: false
    redis:
      enabled: false
    kafka:
      enabled: false
    nginx:
      enabled: false
    ingress:
      enabled: false
    # PgBouncer stays off and the CNPG pooler is bypassed: it rejects some
    # startup parameters, the same reason n8n talks to the -rw service.
    pgbouncer:
      enabled: false

    system:
      url: "https://sentry.onelitefeather.net"
      adminEmail: "themeinerlp@onelitefeather.net"
      public: false

    config:
      # Makes SAML with Entra ID possible at all.
      #
      # Sentry derives its SAML SP entityId from a Django URL, so it always
      # ends in a slash: https://sentry.onelitefeather.net/saml/metadata/sentry/
      # Entra refuses to store any identifierUri ending in a slash --
      # "IdentifierUrisEndsWithSlash", on both the v1.0 and beta Graph APIs --
      # and python3-saml compares the assertion Audience with `not in`, i.e.
      # exact string equality with no normalisation. Without this the two can
      # never agree and every login fails the audience check.
      #
      # Dropping the trailing slash lines both sides up: Sentry then sends and
      # expects the same value Entra is able to store.
      #
      # Patched lazily on the first request rather than at import time: this
      # file is the Django settings module, and importing sentry.auth there
      # would touch the app registry before it is ready. The try/except is
      # deliberate -- a broken patch must never stop Sentry from booting; it
      # would only mean SSO stays unconfigurable.
      sentryConfPy: |
        from django.core.signals import request_started

        def _strip_saml_sp_entity_id_slash(*args, **kwargs):
            request_started.disconnect(_strip_saml_sp_entity_id_slash)
            try:
                from sentry.auth.providers.saml2 import provider as _saml2

                _orig_build_saml_config = _saml2.build_saml_config

                def _build_saml_config(provider_config, org):
                    config = _orig_build_saml_config(provider_config, org)
                    sp = config.get("sp") or {}
                    entity_id = sp.get("entityId")
                    if isinstance(entity_id, str) and entity_id.endswith("/"):
                        sp["entityId"] = entity_id[:-1]
                    return config

                _saml2.build_saml_config = _build_saml_config
            except Exception:
                pass

        request_started.connect(_strip_saml_sp_entity_id_slash, weak=False)

    user:
      create: true
      email: "themeinerlp@onelitefeather.net"
      existingSecret: sentry-admin
      existingSecretKey: admin-password

    # GitHub App "onelitefeather-sentry" -- it already existed in the org and
    # was built for this instance (its external_url already pointed at
    # https://sentry.onelitefeather.net/organizations/onelitefeather).
    #
    # appId and appName stay here in plain sight because they are not secrets
    # and are visible through the public /apps/<slug> API anyway; the private
    # key, webhook secret, client id and client secret live in the SOPS secret.
    #
    # Setting existingSecret makes the chart reference private-key,
    # webhook-secret, client-id and client-secret unconditionally, so every one
    # of them has to be present or the pods will not start.
    github:
      appId: "196299"
      appName: "onelitefeather-sentry"
      existingSecret: sentry-github
      existingSecretAppIdKey: app-id
      existingSecretAppNameKey: app-name

    # Discord application dedicated to Sentry. Deliberately not the existing
    # discordbot: Discord allows one interactions endpoint per application, so
    # sharing one would make the two integrations fight over it.
    #
    # Everything including the application id lives in the secret -- unlike
    # GitHub, where appId is public anyway, Discord's id is paired with a bot
    # token whose leak would let someone act as the bot.
    #
    # Same trap as github above: existingSecret makes the chart reference
    # application-id, public-key, client-secret and bot-token unconditionally.
    discord:
      existingSecret: sentry-discord

    sentry:
      singleOrganization: true
      existingSecret: sentry-secret
      existingSecretKey: secret-key
      # Chart default is {}, which leaves the web pods BestEffort and first to
      # be evicted. The many Snuba consumers keep chart defaults until
      # `kubectl top` shows what they actually need.
      web:
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 2Gi

    externalPostgresql:
      host: feather-core-cluster-pg-rw.cnpg-system.svc.cluster.local
      port: 5432
      database: sentry
      existingSecret: sentry-db
      existingSecretKeys:
        username: username
        password: password

    # Shared Dragonfly, dedicated DB 3 (see docs/dragonfly-redis-allocations.md).
    # Sentry drives this hard -- it is the Celery broker as well as the cache --
    # so watch the Dragonfly latency alert after this goes live.
    externalRedis:
      host: dragonfly.dragonfly.svc.cluster.local
      port: 6379
      db: 3
      existingSecret: sentry-redis
      existingSecretKey: redis-password

    externalKafka:
      host: feather-kafka-kafka-bootstrap.kafka.svc
      port: 9092
      # Creates Sentry's 116 topics with topicctl. This template is gated on
      # `not kafka.enabled`, so it runs precisely in this external setup, and
      # falls back to the chart's full built-in topic list.
      provisioning:
        enabled: true
        replicationFactor: 3
        numPartitions: 3

    externalClickhouse:
      host: clickhouse.sentry.svc.cluster.local
      tcpPort: 9000
      httpPort: 8123
      username: default
      password: ""
      database: default

    filestore:
      backend: s3
      s3:
        existingSecret: sentry-s3
        bucketName: sentry
        endpointUrl: "https://s3.onelitefeather.net"
        region_name: us-east-1
        signature_version: s3v4
        # Ceph RGW is reachable by bucket path, not by virtual-host DNS; the
        # boto default would resolve sentry.s3.onelitefeather.net and fail.
        addressing_style: path

    symbolicator:
      enabled: true
      api:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi

    relay:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    snuba:
      api:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
