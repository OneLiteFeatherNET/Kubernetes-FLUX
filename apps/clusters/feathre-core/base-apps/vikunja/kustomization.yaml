apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vikunja
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ../../../../../apps/base/vikunja/
  - bucket.yaml
  - ingress.yaml
patches:
  - path: release.yaml

secretGenerator:
  # service.secret signs the JWTs. Changing it invalidates every issued token
  # and logs everyone out — keep it stable.
  - name: vikunja-core
    envs:
      - vikunja-core.sops.env
  # Must carry the same password as the CNPG role-vikunja secret.
  - name: vikunja-db
    envs:
      - vikunja-db.sops.env
  # S3 has no entry here on purpose: bucket name, endpoint and credentials are
  # generated by the ObjectBucketClaim in bucket.yaml (ConfigMap + Secret
  # `vikunja-bucket`) and wired into the container in release.yaml.
  #
  # Dragonfly password, DB 14 (https://outline.onelitefeather.dev/doc/dragonfly-belegung-der-redis-datenbanken-AcDqZ4M5Te).
  - name: vikunja-redis
    envs:
      - vikunja-redis.sops.env
  # Client id and secret of the "Vikunja" Entra app registration. The secret
  # expires two years after it was issued — see https://outline.onelitefeather.dev/doc/vikunja-login-uber-microsoft-entra-id-oidc-hl1b5v7SmR.
  - name: vikunja-oidc
    envs:
      - vikunja-oidc.sops.env
