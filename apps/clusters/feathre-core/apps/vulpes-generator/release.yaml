apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vulpes-generator
  namespace: vulpes
spec:
  releaseName: vulpes-generator
  interval: 1m0s
  install:
    remediation:
      retries: 3
  # Pinned in base-sources; the chart's appVersion decides the image tag, so the
  # source pin is the only version to bump.
  chartRef:
    kind: OCIRepository
    name: vulpes-generator
    namespace: flux-system
  values:
    # Deployed into the backend's namespace rather than one of its own: it reads
    # the same database, so the credential and the pull secret already exist here
    # and no copy of either has to be made.
    replicaCount: 2
    priorityClassName: feather-standard
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: vulpes-generator
                  app.kubernetes.io/name: vulpes-generator
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

    imagePullSecrets:
      - name: harbor-pull

    metrics:
      serviceMonitor:
        enabled: true

    ingress:
      enabled: false
    httpRoute:
      enabled: true
      parentRefs:
        - name: eg
          namespace: envoy
          sectionName: https
      hostnames:
        - vulpes-generator.apps.onelite.feather
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /

    # Alloy log pipeline: JSON parsing + per-env stream label.
    podLabels:
      logs.onelitefeather.net/format: json
      logs.onelitefeather.net/env: prod

    # The chart's javaagent injection stays OFF: this service instruments itself
    # (micronaut-tracing-opentelemetry is a compile-time dependency), and running
    # the agent on top of it would instrument everything twice. Its own exporter
    # is switched on through the environment below instead, which is exactly what
    # the application.yml comment asks for.
    tracing:
      enabled: false

    env:
      - name: LOG_JSON
        value: "true"
      - name: OTEL_TRACES_EXPORTER
        value: "otlp"
      # Same tempo-gateway target the chart's own tracing default uses, gRPC as
      # the application configures the protocol.
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://tempo-gateway.grafana.svc.cluster.local:4317"

    # Generated by the vulpes-backend overlay in this namespace. Carries
    # JDBC_URL, DB_USER and DB_PASS, which the datasource below maps onto the
    # names this application expects.
    envFrom:
      - secretRef:
          name: vulpes-app-db

    profiles: [ "prod" ]

    config:
      base: |-
        micronaut:
          application:
            name: Vulpes Generator
          server:
            port: 8080
            # Stelaris is served from its own host, so every call it makes here
            # is cross-origin. This service has no CORS configuration of its own
            # -- without this block the browser rejects every response, and the
            # generate page fails in a way that looks like the service is down.
            cors:
              enabled: true
              configurations:
                stelaris-ui:
                  allowed-origins:
                    - https://stelaris.apps.onelite.feather
            netty:
              access-logger:
                enabled: true
                # Drop probe/metrics noise: kubelet hits /health every 5-10s and
                # Prometheus scrapes /prometheus. Regexes match the request URI.
                exclusions:
                  - /health.*
                  - /prometheus.*
        # Overrides the MariaDB defaults the image ships: the Vulpes data lives
        # in the shared CNPG Postgres. Read-only, because this service only ever
        # reads a schema the backend owns.
        datasources:
          default:
            url: $${JDBC_URL}
            username: $${DB_USER}
            password: $${DB_PASS}
            driverClassName: org.postgresql.Driver
            read-only: true
            # Deliberately small. The CNPG cluster runs at max_connections=100
            # and is shared; a read-only generator does not need a large pool,
            # and idle pools here are what starve the applications that do.
            maximum-pool-size: 5
            minimum-idle: 1
            poolName: "HikariPool-Vulpes-Generator"
        jpa:
          default:
            properties:
              hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
                hbm2ddl.auto: none
      profiles:
        prod: |-
          logger:
            levels:
              root: WARN
              # Per-request access logs (micronaut.server.netty.access-logger).
              # root is WARN, so the access logger must be raised explicitly.
              HTTP_ACCESS_LOGGER: INFO
              "org.hibernate.SQL": WARN
              "com.zaxxer.hikari": WARN
