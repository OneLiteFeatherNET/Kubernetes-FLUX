apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: grafana
spec:
  values:
    global:
      podLabels:
        logs.onelitefeather.net/env: prod
      priorityClassName: feather-high
      extraEnvFrom:
        - secretRef:
            name: tempo-s3
    multitenancyEnabled: false
    traces:
      otlp:
        http:
          enabled: true
        grpc:
          enabled: true
    storage:
      trace:
        backend: s3
        s3:
          # Internal RGW service (path-style, http) — decoupled from the
          # external s3.onelitefeather.net ingress path.
          bucket: tempo-traces
          endpoint: rook-ceph-rgw-feather-s3.rook-ceph-fr01.svc:80
          region: us-west-1
          access_key: $${AWS_ACCESS_KEY_ID}
          secret_key: $${AWS_SECRET_ACCESS_KEY}
          insecure: true
          forcepathstyle: true
    compactor:
      replicas: 1
      # Needed here (not on global.extraArgs) so $${AWS_ACCESS_KEY_ID}/
      # $${AWS_SECRET_ACCESS_KEY} above get expanded — global.extraArgs also
      # reaches memcached, which doesn't understand this Tempo-binary flag
      # and crashloops on it ("Maximum connections must be greater than 0").
      extraArgs:
        - -config.expand-env=true
      # vParquet4 compaction memory scales with the number of distinct trace IDs,
      # not with block size on disk — small blocks still OOMKilled at 1Gi.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      affinity: |
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - fr01
      config:
        compaction:
          # Traces are far higher-volume/lower-value per byte than logs or
          # metrics, so keep retention short to bound the S3 bucket size.
          block_retention: 168h
    distributor:
      # 3 replicas 2026-07-19: distributor is stateless, safe to scale
      # directly for HA - no per-replica config needed beyond replica count.
      replicas: 3
      extraArgs:
        - -config.expand-env=true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
      affinity: |
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - fr01
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tempo
                    app.kubernetes.io/component: distributor
                topologyKey: kubernetes.io/hostname
    ingester:
      # RF == replica count: every ingester holds a full copy of every trace.
      # Full mirroring for redundancy, not sharding for load.
      replicas: 3
      extraArgs:
        - -config.expand-env=true
      config:
        replication_factor: 3
      # Each OOM leaves more WAL to replay on the next start, so an undersized
      # limit compounds its own crashloop. Do not trim this back marginally.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 4Gi
      persistence:
        enabled: true
        size: 10Gi
        storageClass: ceph-rbd-fr01
      affinity: |
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - fr01
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tempo
                    app.kubernetes.io/component: ingester
                topologyKey: kubernetes.io/hostname
    querier:
      # 3 replicas 2026-07-19: stateless, safe to scale directly for HA -
      # also gives real headroom against the cache-miss-storm OOM class
      # fixed just above (three independent pods instead of one).
      replicas: 3
      extraArgs:
        - -config.expand-env=true
      # Sized to survive a transient cache-miss storm, not for day-to-day need:
      # a brief memcached outage pushed the working set from ~30MB past 394MB.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 1Gi
      affinity: |
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - fr01
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tempo
                    app.kubernetes.io/component: querier
                topologyKey: kubernetes.io/hostname
    queryFrontend:
      # 3 replicas 2026-07-19: stateless, safe to scale directly for HA.
      replicas: 3
      extraArgs:
        - -config.expand-env=true
      config:
        metrics:
          # Max allowed range for a TraceQL-metrics query (chart default 3h).
          # Anything longer is rejected -> Traces Drilldown's histogram/rate
          # panels go "No data" the moment you pick "Last 12 hours". Raised to
          # 24h so the common Drilldown ranges work; query_backend_after stays
          # at its 30m default (recent from the generator, older from S3).
          max_duration: 24h
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
      affinity: |
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - fr01
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tempo
                    app.kubernetes.io/component: query-frontend
                topologyKey: kubernetes.io/hostname
    metricsGenerator:
      enabled: true
      extraArgs:
        - -config.expand-env=true
      config:
        storage:
          remote_write:
            - url: http://mimir-gateway.grafana.svc.cluster.local/api/v1/push
        processor:
          # Without this, TraceQL-metrics panels show "No data" past the ~30m live
          # window. Costs generator and compactor load — both have OOM history.
          local_blocks:
            flush_to_storage: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 512Mi
      affinity: |
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - fr01
    # Enables the metrics-generator processors above — without this the
    # generator runs but produces no metrics (span rate/service graph
    # panels in Grafana would keep showing "empty ring"/no data).
    # local-blocks is additionally required for Grafana's Traces Drilldown
    # app, which queries recent/live TraceQL metrics straight from the
    # generator rather than pre-aggregated Prometheus series.
    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
            - local-blocks
    gateway:
      enabled: true
      replicas: 2
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 128Mi
      # This block replaces the chart's default affinity wholesale, so the
      # podAntiAffinity has to be restated here — without it the only spread
      # signal left is the chart's zone-keyed topologySpreadConstraint, which
      # is a no-op on a single-zone cluster (all nodes are zone fr01).
      affinity: |
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      - fr01
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tempo
                    app.kubernetes.io/component: gateway
                topologyKey: kubernetes.io/hostname
      ingress:
        enabled: false
    metaMonitoring:
      serviceMonitor:
        enabled: true
