apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metabase
  namespace: metabase
spec:
  releaseName: metabase
  chart:
    spec:
      chart: metabase
      version: "2.27.6"
      sourceRef:
        kind: HelmRepository
        name: metabase-chart
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  interval: 1m0s
  # Default values
  # https://github.com/pmint93/helm-charts/blob/master/charts/metabase/values.yaml
  values: {}
