apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencost
  namespace: opencost
spec:
  releaseName: opencost
  chart:
    spec:
      chart: opencost
      version: "2.5.30"
      sourceRef:
        kind: HelmRepository
        name: opencost
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  interval: 1m0s
  # Default values
  # https://github.com/opencost/opencost-helm-chart/blob/main/charts/opencost/values.yaml
  values: {}
