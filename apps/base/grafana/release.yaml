apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
spec:
  releaseName: grafana
  chart:
    spec:
      chart: grafana
      version: "=10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana-labs
        namespace: flux-system
  install:
    remediation:
      retries: 0
  interval: 1m0s
  # Default values
  # https://github.com/grafana/helm-charts/blob/main/charts/grafana/values.yaml
  values: {}
