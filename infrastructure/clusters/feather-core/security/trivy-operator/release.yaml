apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  chart:
    spec:
      version: "=0.35.0"
  values:
    resources:
      requests:
        cpu: 100m
        # The operator sits at ~400Mi steady-state with this many reports.
        memory: 384Mi
      limits:
        # 512Mi OOMKilled it in a loop (119 restarts/7d), which silently
        # truncated the reports it had already written.
        memory: 1Gi

    # The image already declares USER 10000; this only states it so the
    # admission-level checks (KSV-0012/0118) can see it.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10000
      runAsGroup: 10000
      seccompProfile:
        type: RuntimeDefault

    trivy:
      # ClientServer, not Standalone: a Standalone scan job runs one trivy
      # container per container in the target pod, all sharing one cache dir,
      # and they deadlock each other on the DB lock. ~25% of pods here are
      # multi-container. The server also holds the 107 MB DB once instead of
      # every job re-downloading it.
      mode: ClientServer
      storageClassName: ceph-rbd-fr01
      storageSize: 5Gi
      # Reports carrying every severity exceeded etcd's object size limit
      # ("request is too large") on image-heavy workloads. Unfixable and
      # LOW findings are what nobody acts on anyway.
      ignoreUnfixed: true
      severity: "MEDIUM,HIGH,CRITICAL"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          # 512Mi OOMKilled the scans of larger images (reposilite, bluemap,
          # dependency-track). Requests stay low — this is a burst ceiling.
          memory: 2Gi

      server:
        # Restates the chart defaults (runAsUser/fsGroup 65534) so the added
        # keys don't drop them — Helm replaces the whole map.
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

    operator:
      builtInTrivyServer: true
      scannerReportTTL: "168h"
      scanJobsConcurrentLimit: 5
      scanJobTimeout: "10m"

    nodeCollector:
      # Disabled: these nodes run Talos, which has no systemd and a
      # read-only rootfs, so the collector cannot even start
      # ("mkdir /etc/systemd: read-only file system"). Excluding every
      # linux node is the only switch the chart offers. The namespaced
      # InfraAssessmentReports for the control-plane pods are unaffected —
      # those come from the API, not from this collector.
      excludeNodes: "kubernetes.io/os=linux"

    # Alloy discovers ServiceMonitors cluster-wide, same as the gateway.
    serviceMonitor:
      enabled: true
      interval: 60s
