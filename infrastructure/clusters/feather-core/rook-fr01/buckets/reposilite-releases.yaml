apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: reposilite-releases
  namespace: rook-ceph-fr01
spec:
  bucketName: reposilite-releases
  storageClassName: ceph-bucket-fr01
  additionalConfig:
    # Public artifacts get their own owner: a leaked public key must not open
    # the private onelitefeather-* buckets, which stay owned by `reposilite`.
    bucketOwner: reposilite-public
