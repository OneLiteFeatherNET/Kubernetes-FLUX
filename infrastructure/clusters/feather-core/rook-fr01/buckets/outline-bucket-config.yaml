# Bucket-seitige Konfiguration für Outline: CORS und die Public-Read-Policy.
# Beides kennt der ObjectBucketClaim nicht, und beides muss am Bucket hängen --
# öffentlicher Traffic läuft Cloudflare Tunnel -> RGW und sieht die Envoy-
# SecurityPolicy nie. Neue Origins hier eintragen, der CronJob schreibt sie
# idempotent zurück und stellt sie wieder her, falls der Bucket neu entsteht.
apiVersion: v1
kind: ConfigMap
metadata:
  name: outline-bucket-config
  namespace: rook-ceph-fr01
data:
  cors.json: |
    {
      "CORSRules": [
        {
          "AllowedOrigins": [
            "https://outline.onelitefeather.dev"
          ],
          "AllowedMethods": ["GET", "HEAD", "PUT", "POST", "DELETE"],
          "AllowedHeaders": ["*"],
          "ExposeHeaders": [
            "ETag",
            "Content-Length",
            "Content-Type",
            "Content-Range",
            "Accept-Ranges"
          ],
          "MaxAgeSeconds": 3600
        }
      ]
    }
  # Outline liefert Avatare und Team-Logos unter public/ direkt an den Browser
  # aus, ohne presigned URL. Alles andere (uploads/) bleibt privat.
  policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Sid": "PublicReadForPublicPrefix",
          "Effect": "Allow",
          "Principal": {"AWS": ["*"]},
          "Action": ["s3:GetObject"],
          "Resource": ["arn:aws:s3:::outline/public/*"]
        }
      ]
    }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: outline-bucket-config
  namespace: rook-ceph-fr01
spec:
  # Konvergenz-Job, kein Zeitplan im eigentlichen Sinn. Nach einer Änderung an
  # der ConfigMap sofort ausführen:
  #   kubectl -n rook-ceph-fr01 create job --from=cronjob/outline-bucket-config outline-bucket-config-now
  schedule: "17 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: outline-bucket-config
        spec:
          restartPolicy: Never
          containers:
            - name: apply-config
              image: amazon/aws-cli:2.36.27
              env:
                # Credentials des Bucket-Owners, vom ObjectBucketClaim erzeugt.
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: outline
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: outline
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_DEFAULT_REGION
                  # RGW ignoriert den Wert, die CLI startet ohne ihn nicht.
                  value: us-east-1
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  ENDPOINT=http://rook-ceph-rgw-feather-s3.rook-ceph-fr01.svc:80
                  aws --endpoint-url "$ENDPOINT" s3api put-bucket-cors \
                    --bucket outline \
                    --cors-configuration file:///config/cors.json
                  aws --endpoint-url "$ENDPOINT" s3api put-bucket-policy \
                    --bucket outline \
                    --policy file:///config/policy.json
                  echo "Applied. Current configuration:"
                  aws --endpoint-url "$ENDPOINT" s3api get-bucket-cors --bucket outline
                  aws --endpoint-url "$ENDPOINT" s3api get-bucket-policy --bucket outline
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: outline-bucket-config
