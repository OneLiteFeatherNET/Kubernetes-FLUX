apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rook-ceph-fr01
resources:
  - harbor.yaml
  - loki.yaml
  - velero.yaml
  - mariadb.yaml
  - postgresql-cluster-backup.yaml
  - bluemap.yaml
  - reposilite.yaml
  - outline.yaml
  - mimir.yaml
  - reposilite-public.yaml
  - bakery.yaml
  - olf.yaml
  - tempo.yaml
  - cygnus-pack.yaml
  - apus.yaml
  - penpot.yaml
  - sentry.yaml
  - vikunja.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  # Credentials the vikunja CephObjectStoreUser is created *with*
  # (spec.keys), so the same values can go to the app without copying them
  # back out of an operator-minted Secret. The app-side copy lives in
  # apps/.../base-apps/vikunja/vikunja-s3.sops.env — keep both in sync.
  - name: vikunja-s3-keys
    envs:
      - vikunja-s3.sops.env
