apiVersion: ceph.rook.io/v1
kind: CephBlockPool
metadata:
  name: feather-rbd
  namespace: rook-ceph-fr01
spec:
  failureDomain: host
  replicated:
    size: 3
    requireSafeReplicaSize: true
  # Ohne pg_num_min klemmt der Autoscaler den Pool auf den Ceph-Default 32,
  # unabhängig von der Last. 128 gibt gleichzeitigen Zugriffen mehr Parallelität.
  parameters:
    pg_num_min: "128"
